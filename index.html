  <!-- PD14: Método Apply -->
  <div class="sub-sec" id="sub-pd14">
    <div class="callout tip">
      <span class="callout-icon">⚙️</span>
      <p><strong>La idea clave:</strong> <code>.apply()</code> aplica una función a cada elemento de una columna (o fila). Es especialmente útil para operaciones personalizadas que los métodos estándar de Pandas no cubren.</p>
    </div>

    <h2>Sintaxis general</h2>
    <pre><span class="lt">python</span><code>df[<span class="str">'nueva_col'</span>] = df[<span class="str">'columna'</span>].<span class="fn">apply</span>(funcion)
<span class="cm"># La función recibe el valor de cada fila de 'columna'</span></code></pre>

    <h2>Caso 1 — Función propia: categorizar edades</h2>
    <pre><span class="lt">python</span><code><span class="kw">def</span> <span class="fn">categorizar_edad</span>(n):
    <span class="kw">if</span>   <span class="num">18</span> &lt;= n &lt;= <span class="num">28</span>: <span class="kw">return</span> <span class="str">"Jóvenes adultos"</span>
    <span class="kw">elif</span> <span class="num">29</span> &lt;= n &lt;= <span class="num">39</span>: <span class="kw">return</span> <span class="str">"Adultos jóvenes"</span>
    <span class="kw">elif</span> <span class="num">40</span> &lt;= n &lt;= <span class="num">50</span>: <span class="kw">return</span> <span class="str">"Mediana edad"</span>
    <span class="kw">else</span>:                <span class="kw">return</span> <span class="str">"Adultos mayores"</span>

user[<span class="str">'age_category'</span>] = user[<span class="str">'age'</span>].<span class="fn">apply</span>(categorizar_edad)
user.<span class="fn">head</span>()</code></pre>

    <h2>Caso 2 — Cambiar tipo de dato</h2>
    <pre><span class="lt">python</span><code>user[<span class="str">"income"</span>].<span class="var">dtype</span>   <span class="cm"># dtype('int64')</span>

user[<span class="str">'income'</span>] = user[<span class="str">'income'</span>].<span class="fn">apply</span>(<span class="kw">lambda</span> x: <span class="fn">float</span>(x))
user[<span class="str">'income'</span>].<span class="var">dtype</span>  <span class="cm"># dtype('float64')</span></code></pre>
    <div class="code-out">dtype('float64')</div>

    <h2>Caso 3 — Lambda con condicional</h2>
    <pre><span class="lt">python</span><code><span class="cm"># Convertir booleano a texto "yes"/"no"</span>
user[<span class="str">"Owns_Car"</span>] = user[<span class="str">"Owns_Car"</span>].<span class="fn">apply</span>(<span class="kw">lambda</span> x: <span class="str">"yes"</span> <span class="kw">if</span> x == <span class="kw">True</span> <span class="kw">else</span> <span class="str">"no"</span>)</code></pre>

    <div class="callout info">
      <span class="callout-icon">💡</span>
      <p>La lambda <code>lambda x: "yes" if x == True else "no"</code> solo admite un <code>if/else</code> simple. Para lógica con <code>elif</code> define una función normal.</p>
    </div>

    <h2>Caso 4 — Lambda con función de dos parámetros</h2>
    <pre><span class="lt">python</span><code><span class="kw">def</span> <span class="fn">travel_female</span>(interests, gender):
    <span class="kw">return</span> interests == <span class="str">'Travel'</span> <span class="kw">and</span> gender == <span class="str">'female'</span>

<span class="cm"># axis=1 aplica la función fila a fila (en lugar de por columna)</span>
user[<span class="str">'target'</span>] = user.<span class="fn">apply</span>(<span class="kw">lambda</span> x: <span class="fn">travel_female</span>(x[<span class="str">'interests'</span>], x[<span class="str">'gender'</span>]), axis=<span class="num">1</span>)</code></pre>

    <span class="kw">return</span> edad + offset

<span class="cm"># Pasar argumentos extra con args=[...]</span>
user[<span class="str">"age"</span>] = user[<span class="str">"age"</span>].<span class="fn">apply</span>(corregir_edad, args=[<span class="num">10</span>])
user.<span class="fn">head</span>()</code></pre>

      <p>Las funciones que uses con <code>.apply()</code> deben aceptar <strong>al menos un parámetro</strong>. Si la función no recibe ninguno, Pandas lanzará un error porque siempre le pasa el valor de la fila/celda como primer argumento.</p>

  <!-- PD15: Combinación de DataFrames -->
  <div class="sub-sec" id="sub-pd15">
    <div class="callout tip">
      <span class="callout-icon">🔗</span>
      <p><strong>La idea clave:</strong> cuando tenemos varios conjuntos de datos relacionados, Pandas nos da tres métodos para combinarlos: <code>concat()</code>, <code>merge()</code> y <code>join()</code>. Cada uno resuelve un problema distinto.</p>
    </div>

    <h2>¿Por qué combinar DataFrames?</h2>
    <p>Es muy habitual tener dos o más conjuntos de datos que interesa unir. Los usos más comunes son:</p>
    <ul>
      <li>Combinar datos de múltiples fuentes.</li>
      <li>Ampliar conjuntos de datos.</li>
      <li>Análisis de datos relacionales.</li>
      <li>Limpiar y transformar datos.</li>
      <li>Integración de datos estructurados y no estructurados.</li>
    </ul>
    <p>Como ejemplo guía usaremos tres CSV de un concesionario Ford: ventas de <strong>2023</strong>, ventas de <strong>2024</strong> y las <strong>características</strong> de los coches vendidos.</p>

    <div class="table-wrap"><table>
      <thead><tr><th>Método</th><th>Para qué sirve</th></tr></thead>
      <tbody>
        <tr><td><code>concat()</code></td><td>Combina DataFrames horizontal o verticalmente. No hay columna de referencia para unirlos.</td></tr>
        <tr><td><code>merge()</code></td><td>Combina DataFrames basándose en una o más <strong>columnas comunes</strong>, que hay que especificar.</td></tr>
        <tr><td><code>join()</code></td><td>Combina DataFrames basándose en las <strong>etiquetas del índice</strong>, en lugar de columnas comunes.</td></tr>
      </tbody>
    </table></div>

    <h2>Cargar los datos</h2>
    <pre><span class="lt">python</span><code><span class="kw">import</span> pandas <span class="kw">as</span> pd
<span class="kw">import</span> numpy <span class="kw">as</span> np

<span class="var">coches_2024</span> = pd.<span class="fn">read_csv</span>(<span class="str">"...\\14.datos_ford_2024.csv"</span>)
<span class="var">coches_2023</span> = pd.<span class="fn">read_csv</span>(<span class="str">"...\\14.datos_ford_2023.csv"</span>)
<span class="var">coches_caracteristicas</span> = pd.<span class="fn">read_csv</span>(<span class="str">"...\\14.datos_ford_caracteristicas.csv"</span>)</code></pre>
    <p>Los dos primeros conjuntos son ventas de distintos años (mismas columnas, perfectamente unificables). El tercero contiene características técnicas de algunos coches, identificables por su <code>VIN</code> (número de identificación del vehículo), que podríamos añadir a los datos de ventas.</p>

    <h2>concat()</h2>
    <p>Concatena DataFrames a lo largo de un eje. Sintaxis general:</p>
    <pre><span class="lt">python</span><code>df_concat = pd.<span class="fn">concat</span>([df_1, df_2], axis = <span class="num">0</span>, join = <span class="str">'outer'</span>, ignore_index = <span class="kw">False</span>)</code></pre>
    <div class="table-wrap"><table>
      <thead><tr><th>Parámetro</th><th>Significado</th></tr></thead>
      <tbody>
        <tr><td><code>axis</code></td><td><code>0</code> concatena verticalmente (filas); <code>1</code> concatena horizontalmente (columnas)</td></tr>
        <tr><td><code>join</code></td><td><code>outer</code>: se unen todas las columnas, estén en ambos conjuntos o no. <code>inner</code>: solo las que coinciden en ambos.</td></tr>
        <tr><td><code>ignore_index</code></td><td>Si se deben restablecer los índices originales. Por defecto <code>False</code>.</td></tr>
      </tbody>
    </table></div>

    <p>Probamos primero <code>axis=1</code> (horizontal) y después <code>axis=0</code> (vertical), para comparar:</p>
    <pre><span class="lt">python</span><code><span class="var">concat_1</span> = pd.<span class="fn">concat</span>([<span class="var">coches_2023</span>, <span class="var">coches_2024</span>], axis=<span class="num">1</span>, join=<span class="str">"inner"</span>)
<span class="var">concat_1</span>.<span class="fn">head</span>()</code></pre>
    <div class="df-out"><table>
      <thead><tr><th></th><th>VIN</th><th>modelo_coche</th><th>fecha_venta</th><th>VIN</th><th>modelo_coche</th><th>fecha_venta</th></tr></thead>
      <tbody>
        <tr><td>0</td><td>1FA6P8...23</td><td>Focus</td><td>2023-01-15</td><td>1FA6P8...41</td><td>Fiesta</td><td>2024-02-02</td></tr>
        <tr><td>1</td><td>3FA6P0...07</td><td>Kuga</td><td>2023-02-03</td><td>3FA6P0...88</td><td>Puma</td><td>2024-03-11</td></tr>
        <tr><td>2</td><td>1FA6P8...19</td><td>Fiesta</td><td>2023-02-20</td><td>1FA6P8...52</td><td>Focus</td><td>2024-04-05</td></tr>
      </tbody>
    </table></div>
    <div class="callout warn"><span class="callout-icon">⚠️</span><p>Con <code>axis=1</code> las columnas se quedan <strong>duplicadas</strong> una al lado de la otra (dos columnas <code>VIN</code>, dos <code>modelo_coche</code>...) porque cada fila combina la fila <em>i</em> de un DataFrame con la fila <em>i</em> del otro, sin tener en cuenta si son el mismo coche. No es lo que buscamos aquí.</p></div>

    <pre><span class="lt">python</span><code><span class="var">concat_0</span> = pd.<span class="fn">concat</span>([<span class="var">coches_2023</span>, <span class="var">coches_2024</span>], axis=<span class="num">0</span>, join=<span class="str">"inner"</span>)
<span class="var">concat_0</span>.<span class="fn">head</span>()</code></pre>
    <div class="df-out"><table>
      <thead><tr><th></th><th>VIN</th><th>modelo_coche</th><th>fecha_venta</th><th>id_del_vendedor</th></tr></thead>
      <tbody>
        <tr><td>0</td><td>1FA6P8...23</td><td>Focus</td><td>2023-01-15</td><td>V12</td></tr>
        <tr><td>1</td><td>3FA6P0...07</td><td>Kuga</td><td>2023-02-03</td><td>V07</td></tr>
        <tr><td>2</td><td>1FA6P8...19</td><td>Fiesta</td><td>2023-02-20</td><td>V12</td></tr>
        <tr><td>0</td><td>1FA6P8...41</td><td>Fiesta</td><td>2024-02-02</td><td>V03</td></tr>
        <tr><td>1</td><td>3FA6P0...88</td><td>Puma</td><td>2024-03-11</td><td>V07</td></tr>
      </tbody>
    </table></div>
    <div class="callout tip"><span class="callout-icon">✅</span><p>Con <code>axis=0</code>, como las columnas se llaman igual en ambos años, la nueva información se añade <strong>debajo</strong> de la anterior. Es la forma más conveniente cuando solo quieres apilar registros de la misma estructura, como ventas de distintos años.</p></div>

    <h2>merge()</h2>
    <p>Combina dos DataFrames basándose en una o más <strong>columnas comunes</strong>. Sintaxis general:</p>
    <pre><span class="lt">python</span><code>df_left.<span class="fn">merge</span>(df_right, how = <span class="str">'inner'</span>, on = <span class="kw">None</span>, left_on = <span class="kw">None</span>, right_on = <span class="kw">None</span>)</code></pre>
    <div class="table-wrap"><table>
      <thead><tr><th>Parámetro</th><th>Significado</th></tr></thead>
      <tbody>
        <tr><td><code>how</code></td><td><code>inner</code> (solo coincidencias en ambos), <code>left</code> (todo el izquierdo + coincidencias), <code>right</code> (todo el derecho + coincidencias), <code>outer</code> (todos los valores de ambos)</td></tr>
        <tr><td><code>on</code></td><td>Columna común en la que se basa la unión. Debe llamarse <strong>igual</strong> en ambos DataFrames.</td></tr>
        <tr><td><code>left_on</code> / <code>right_on</code></td><td>Si las columnas de unión tienen nombres distintos en cada DataFrame</td></tr>
      </tbody>
    </table></div>

    <p>Todos nuestros conjuntos comparten la columna <code>VIN</code>. Vamos a comprobar de qué año tenemos coincidencias con <code>coches_caracteristicas</code>:</p>
    <pre><span class="lt">python</span><code><span class="cm"># Comprobamos primero los datos del 2023</span>
<span class="var">coches_2023_merge</span> = <span class="var">coches_2023</span>.<span class="fn">merge</span>(<span class="var">coches_caracteristicas</span>, how = <span class="str">'inner'</span>, on = <span class="str">'VIN'</span>)
<span class="var">coches_2023_merge</span>.<span class="fn">head</span>()</code></pre>
    <div class="df-out"><table>
      <thead><tr><th colspan="1"></th><th colspan="4" style="text-align:center;color:var(--muted)">DataFrame vacío — Columns: [], Index: []</th></tr></thead>
    </table></div>
    <p>El resultado está <strong>vacío</strong>. ¿Por qué? Al usar <code>how='inner'</code>, Pandas solo conserva las filas cuyo <code>VIN</code> aparece en <strong>ambos</strong> conjuntos de datos. Si no hay ningún VIN coincidente, no aparece ningún dato.</p>

    <pre><span class="lt">python</span><code><span class="cm"># Comprobamos ahora los datos del 2024</span>
<span class="var">coches_2024_merge</span> = <span class="var">coches_2024</span>.<span class="fn">merge</span>(<span class="var">coches_caracteristicas</span>, how = <span class="str">'inner'</span>, on = <span class="str">'VIN'</span>).<span class="fn">head</span>(<span class="num">3</span>)
<span class="var">coches_2024_merge</span>.<span class="fn">head</span>()</code></pre>
    <div class="df-out"><table>
      <thead><tr><th></th><th>VIN</th><th>modelo_coche</th><th>fecha_venta</th><th>numero_puertas</th><th>camara_trasera</th><th>sensor_aparcamiento</th></tr></thead>
      <tbody>
        <tr><td>0</td><td>1FA6P8...41</td><td>Fiesta</td><td>2024-02-02</td><td>5</td><td>Sí</td><td>No</td></tr>
        <tr><td>1</td><td>3FA6P0...88</td><td>Puma</td><td>2024-03-11</td><td>5</td><td>Sí</td><td>Sí</td></tr>
        <tr><td>2</td><td>1FA6P8...52</td><td>Focus</td><td>2024-04-05</td><td>3</td><td>No</td><td>No</td></tr>
      </tbody>
    </table></div>
    <div class="callout tip"><span class="callout-icon">✅</span><p>Esta vez sí hay coincidencias: la columna <code>VIN</code> aparece <strong>una sola vez</strong> (no duplicada) y a su lado se añaden las columnas de características de cada coche. Esto confirma que las características que tenemos corresponden a coches vendidos en <strong>2024</strong>, no en 2023.</p></div>

    <h2>join()</h2>
    <p>Combina DataFrames en función de las <strong>etiquetas de índice</strong>, en lugar de columnas comunes. Sintaxis general:</p>
    <pre><span class="lt">python</span><code>df_left.<span class="fn">join</span>(df_right, how = <span class="str">'tipo_de_join'</span>, lsuffix = <span class="str">''</span>, rsuffix = <span class="str">''</span>)</code></pre>
    <div class="table-wrap"><table>
      <thead><tr><th>Parámetro</th><th>Significado</th></tr></thead>
      <tbody>
        <tr><td><code>how</code></td><td>Igual que en <code>merge()</code>: <code>inner</code>, <code>left</code>, <code>right</code>, <code>outer</code></td></tr>
        <tr><td><code>lsuffix</code> / <code>rsuffix</code></td><td>Sufijo a añadir si hay columnas con el mismo nombre en ambos DataFrames (por defecto, ninguno)</td></tr>
      </tbody>
    </table></div>
    <div class="callout warn"><span class="callout-icon">⚠️</span><p>Para usar <code>join()</code>, las columnas a combinar deben ser las que ocupan el <strong>índice</strong> de cada DataFrame, y deben llamarse igual. Si no lo son, hay que fijarlas primero con <code>set_index()</code>.</p></div>

    <pre><span class="lt">python</span><code><span class="var">coches_2024</span>.<span class="fn">set_index</span>([<span class="str">"VIN"</span>], inplace = <span class="kw">True</span>)
<span class="var">coches_caracteristicas</span>.<span class="fn">set_index</span>([<span class="str">"VIN"</span>], inplace = <span class="kw">True</span>)</code></pre>

    <p>Con los índices ya preparados, hacemos el <code>join</code>:</p>
    <pre><span class="lt">python</span><code><span class="var">coches_join</span> = <span class="var">coches_2024</span>.<span class="fn">join</span>(<span class="var">coches_caracteristicas</span>, on = <span class="str">'VIN'</span>, lsuffix=<span class="str">'_left'</span>, rsuffix=<span class="str">'_right'</span>)
<span class="var">coches_join</span>.<span class="fn">head</span>()</code></pre>
    <div class="df-out"><table>
      <thead><tr><th>VIN</th><th>modelo_coche</th><th>fecha_venta</th><th>numero_puertas</th><th>camara_trasera</th><th>sensor_aparcamiento</th></tr></thead>
      <tbody>
        <tr><td>1FA6P8...41</td><td>Fiesta</td><td>2024-02-02</td><td>5</td><td>Sí</td><td>No</td></tr>
        <tr><td>3FA6P0...88</td><td>Puma</td><td>2024-03-11</td><td>5</td><td>Sí</td><td>Sí</td></tr>
        <tr><td>1FA6P8...52</td><td>Focus</td><td>2024-04-05</td><td>3</td><td>No</td><td>No</td></tr>
      </tbody>
    </table></div>

    <div class="callout info">
      <span class="callout-icon">💡</span>
      <p>En este caso ningún nombre de columna se repite entre ambos DataFrames, así que los sufijos <code>_left</code>/<code>_right</code> no llegan a usarse; solo aparecerían si hubiera columnas duplicadas con el mismo nombre en los dos conjuntos.</p>
    </div>
  </div>

  <!-- PD16: Pivotado de datos -->
  <div class="sub-sec" id="sub-pd16">
    <div class="callout tip">
      <span class="callout-icon">📊</span>
      <p><strong>La idea clave:</strong> una tabla dinámica (<em>pivot table</em>) resume información agrupando filas y columnas y aplicando una función de agregación en cada intersección.</p>
    </div>

    <h2>¿Qué es una tabla dinámica?</h2>
    <p>Las tablas dinámicas resumen la información de otra tabla siguiendo este proceso:</p>
    <ol>
      <li>Se selecciona una característica para ocupar el <strong>índice de filas</strong>.</li>
      <li>Se selecciona otra característica para ocupar el <strong>índice de columnas</strong>.</li>
      <li>Se selecciona una o más características para ocupar las <strong>intersecciones</strong> entre filas y columnas.</li>
      <li>Al conjunto de intersecciones se le aplica una <strong>función de agregación</strong> (suma, conteo, media...).</li>
    </ol>

    <h2>pivot_table()</h2>
    <p>Sintaxis general:</p>
    <pre><span class="lt">python</span><code>df.<span class="fn">pivot_table</span>(values = <span class="kw">None</span>, index = <span class="kw">None</span>, columns = <span class="kw">None</span>, aggfunc = <span class="str">'mean'</span>)</code></pre>
    <div class="table-wrap"><table>
      <thead><tr><th>Parámetro</th><th>Significado</th></tr></thead>
      <tbody>
        <tr><td><code>values</code></td><td>Columna o columnas sobre las que se aplica la función de agregación</td></tr>
        <tr><td><code>index</code></td><td>Columna cuyos valores se convierten en el índice (filas) del resultado</td></tr>
        <tr><td><code>columns</code></td><td>Columna cuyos valores se convierten en las columnas del resultado</td></tr>
        <tr><td><code>aggfunc</code></td><td>Función de agregación a aplicar. Por defecto, <code>'mean'</code></td></tr>
      </tbody>
    </table></div>

    <h2>Ejemplo: coches vendidos por vendedor y modelo</h2>
    <p>Retomamos <code>concat_0</code> (las ventas de 2023 y 2024 ya unificadas). Queremos calcular cuántos coches de cada modelo ha vendido cada vendedor:</p>
    <pre><span class="lt">python</span><code><span class="var">concat_0</span>.<span class="fn">pivot_table</span>(values = <span class="str">'fecha_venta'</span>, index = <span class="str">'id_del_vendedor'</span>, columns = <span class="str">'modelo_coche'</span>, aggfunc = <span class="str">'count'</span>)</code></pre>
    <div class="df-out"><table>
      <thead><tr><th>id_del_vendedor</th><th>Fiesta</th><th>Focus</th><th>Kuga</th><th>Puma</th></tr></thead>
      <tbody>
        <tr><td>V03</td><td>1</td><td>0</td><td>0</td><td>0</td></tr>
        <tr><td>V07</td><td>0</td><td>0</td><td>1</td><td>1</td></tr>
        <tr><td>V12</td><td>1</td><td>1</td><td>0</td><td>0</td></tr>
      </tbody>
    </table></div>
    <div class="callout info">
      <span class="callout-icon">💡</span>
      <p>Cada fila es un vendedor (<code>id_del_vendedor</code>), cada columna un modelo de coche, y cada celda el número de ventas de ese modelo por ese vendedor — calculado con <code>aggfunc='count'</code> sobre la columna <code>fecha_venta</code> (cualquier columna no nula nos sirve para contar registros).</p>
    </div>

    <div class="callout tip">
      <span class="callout-icon">✅</span>
      <p>Si en vez de <code>'count'</code> usáramos <code>aggfunc='mean'</code> sobre una columna numérica (por ejemplo, el precio de venta), obtendríamos el <strong>precio medio</strong> vendido por cada vendedor y modelo, en lugar del número de ventas.</p>
    </div>
  </div>

  <!-- PD17: Melt -->
  <div class="sub-sec" id="sub-pd17">
    <div class="callout tip">
      <span class="callout-icon">🌡️</span>
      <p><strong>La idea clave:</strong> <code>melt()</code> hace justo lo contrario de pivotar: convierte columnas en filas, "derritiendo" un DataFrame ancho en uno más largo y estrecho.</p>
    </div>

    <h2>¿Qué hace melt()?</h2>
    <p><code>melt()</code> transforma un DataFrame con muchas columnas en otro con menos: una o más columnas se mantienen como <strong>variables identificadoras</strong>, y el resto se fusionan en dos columnas nuevas (una con el nombre de la variable, otra con su valor).</p>
    <pre><span class="lt">python</span><code>pd.<span class="fn">melt</span>(df, id_vars = <span class="kw">None</span>, value_vars = <span class="kw">None</span>, var_name = <span class="kw">None</span>, value_name = <span class="kw">None</span>)</code></pre>
    <div class="table-wrap"><table>
      <thead><tr><th>Parámetro</th><th>Significado</th></tr></thead>
      <tbody>
        <tr><td><code>df</code></td><td>DataFrame que vamos a transformar</td></tr>
        <tr><td><code>id_vars</code></td><td>Columnas identificadoras. <strong>No</strong> cambian al generar el nuevo DataFrame</td></tr>
        <tr><td><code>value_vars</code></td><td>Columnas que se van a fundir/fusionar</td></tr>
        <tr><td><code>var_name</code></td><td>Nombre de la nueva columna que contendrá los nombres de las variables fusionadas</td></tr>
        <tr><td><code>value_name</code></td><td>Nombre de la nueva columna que contendrá los valores</td></tr>
      </tbody>
    </table></div>

    <h2>Ejemplo: características de los coches</h2>
    <p>Partimos del DataFrame que obtuvimos al hacer el <code>merge()</code> de 2024 con las características (<code>coches_2024_merge</code>), reducido a 3 filas para ver mejor el resultado:</p>
    <pre><span class="lt">python</span><code><span class="cm"># Reducimos el DataFrame del merge para ver mejor el resultado del melt</span>
<span class="var">coches_2024_merge</span> = <span class="var">coches_2024_merge</span>.<span class="fn">head</span>(<span class="num">3</span>)</code></pre>
    <div class="df-out"><table>
      <thead><tr><th></th><th>modelo_coche</th><th>numero_puertas</th><th>camara_trasera</th><th>sensor_aparcamiento</th></tr></thead>
      <tbody>
        <tr><td>0</td><td>Fiesta</td><td>5</td><td>Sí</td><td>No</td></tr>
        <tr><td>1</td><td>Puma</td><td>5</td><td>Sí</td><td>Sí</td></tr>
        <tr><td>2</td><td>Focus</td><td>3</td><td>No</td><td>No</td></tr>
      </tbody>
    </table></div>

    <p>Fusionamos las columnas <code>numero_puertas</code>, <code>camara_trasera</code> y <code>sensor_aparcamiento</code>, usando <code>modelo_coche</code> como variable identificadora:</p>
    <pre><span class="lt">python</span><code>pd.<span class="fn">melt</span>(<span class="var">coches_2024_merge</span>, id_vars = <span class="str">'modelo_coche'</span>,
        value_vars = [<span class="str">'numero_puertas'</span>, <span class="str">'camara_trasera'</span>, <span class="str">'sensor_aparcamiento'</span>],
        var_name = <span class="str">'Características'</span>, value_name = <span class="str">'Valor'</span>)</code></pre>
    <div class="df-out"><table>
      <thead><tr><th></th><th>modelo_coche</th><th>Características</th><th>Valor</th></tr></thead>
      <tbody>
        <tr><td>0</td><td>Fiesta</td><td>numero_puertas</td><td>5</td></tr>
        <tr><td>1</td><td>Puma</td><td>numero_puertas</td><td>5</td></tr>
        <tr><td>2</td><td>Focus</td><td>numero_puertas</td><td>3</td></tr>
        <tr><td>3</td><td>Fiesta</td><td>camara_trasera</td><td>Sí</td></tr>
        <tr><td>4</td><td>Puma</td><td>camara_trasera</td><td>Sí</td></tr>
        <tr><td>5</td><td>Focus</td><td>camara_trasera</td><td>No</td></tr>
        <tr><td>6</td><td>Fiesta</td><td>sensor_aparcamiento</td><td>No</td></tr>
        <tr><td>7</td><td>Puma</td><td>sensor_aparcamiento</td><td>Sí</td></tr>
        <tr><td>8</td><td>Focus</td><td>sensor_aparcamiento</td><td>No</td></tr>
      </tbody>
    </table></div>

    <div class="callout info">
      <span class="callout-icon">💡</span>
      <p><code>modelo_coche</code> (en <code>id_vars</code>) se repite tal cual en cada fila nueva, mientras que las 3 columnas de <code>value_vars</code> se "apilan" verticalmente: cada una pasa a ocupar 3 filas (una por modelo), identificada por su nombre en la columna <code>Características</code> y su valor en <code>Valor</code>. El DataFrame original tenía 3 filas × 3 columnas de datos; el resultado tiene 9 filas × 1 columna de datos.</p>
    </div>

    <div class="callout tip">
      <span class="callout-icon">✅</span>
      <p><code>melt()</code> es muy útil antes de graficar con librerías como Matplotlib o Seaborn, que muchas veces esperan los datos en formato "largo" (una fila por observación) en lugar de "ancho" (una columna por variable).</p>
    </div>
  </div>
</template>

  <!-- GSP1: Tabla dinámica -->
  <div class="sub-sec on" id="sub-gsp1">
    <h2>¿Qué es una tabla dinámica?</h2>
    <p>Una <strong>tabla dinámica (Pivot Table)</strong> reorganiza y resume datos de una tabla más grande <strong>sin modificar los datos originales</strong>. Es la herramienta más potente de Sheets para responder preguntas tipo "¿cuánto vendimos por cliente?" o "¿cuántas unidades por categoría?" sin escribir una sola fórmula.</p>
    <div class="callout info"><span class="callout-icon">💡</span><p>Piensa en ella como una "calculadora automática de agrupaciones": tú eliges qué agrupar (Filas/Columnas) y qué calcular (Valores), y la tabla dinámica hace el resto.</p></div>

    <p>Usaremos como ejemplo estos datos en bruto de ventas — los iremos resumiendo a lo largo de esta lección:</p>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Hoja1 — Ventas (datos en bruto)</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th><th class="gs-colhead">D</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Región</td><td>Producto</td><td>Vendedor</td><td>Ventas (€)</td></tr>
          <tr><td class="gs-rownum">2</td><td>Norte</td><td>Portátil</td><td>Ana</td><td>1.200</td></tr>
          <tr><td class="gs-rownum">3</td><td>Norte</td><td>Monitor</td><td>Luis</td><td>450</td></tr>
          <tr><td class="gs-rownum">4</td><td>Sur</td><td>Portátil</td><td>Ana</td><td>1.500</td></tr>
          <tr><td class="gs-rownum">5</td><td>Sur</td><td>Monitor</td><td>Marta</td><td>600</td></tr>
          <tr><td class="gs-rownum">6</td><td>Norte</td><td>Portátil</td><td>Luis</td><td>900</td></tr>
        </tbody>
      </table>
    </div>

    <h2>Requisitos antes de crear una</h2>
    <ul>
      <li>Cada columna debe tener un <strong>encabezado</strong> en la primera fila.</li>
      <li>Los datos deben estar en formato de <strong>tabla "plana"</strong>: una fila por registro, sin celdas combinadas ni totales intermedios.</li>
      <li>Si el conjunto de datos incluye totales o subtotales, hay que excluirlos: las tablas dinámicas parten siempre de datos en bruto.</li>
    </ul>

    <h2>Pasos para crearla</h2>
    <ol>
      <li>Selecciona el rango de datos (o simplemente haz clic en una celda dentro de la tabla; Sheets detecta el rango automáticamente).</li>
      <li>Ve a <code>Insertar → Tabla dinámica</code>.</li>
      <li>Elige si la quieres en una <strong>hoja nueva</strong> (recomendado) o en una existente, y pulsa <strong>Crear</strong>.</li>
      <li>Se abre el <strong>Editor de tablas dinámicas</strong> a la derecha, con cuatro secciones: Filas, Columnas, Valores y Filtros.</li>
    </ol>
    <div class="callout tip"><span class="callout-icon">✅</span><p>Verifica siempre que el "Intervalo de datos" que propone Sheets coincide con el rango real de tu tabla; si no, puedes corregirlo ahí mismo antes de crear la tabla dinámica.</p></div>

    <h2>Las cuatro secciones del editor</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Sección</th><th>Qué hace</th><th>Ejemplo</th></tr></thead>
      <tbody>
        <tr><td><strong>Filas</strong></td><td>Cada valor único del campo elegido se convierte en una fila de la tabla dinámica.</td><td>Añadir "Región" → una fila por cada región</td></tr>
        <tr><td><strong>Columnas</strong></td><td>Igual que filas, pero en horizontal: cada valor único se convierte en un encabezado de columna.</td><td>Añadir "Producto" → una columna por producto</td></tr>
        <tr><td><strong>Valores</strong></td><td>El número que se calcula donde se cruzan fila y columna. Por defecto usa SUMA, pero puedes cambiarlo a CONTAR, PROMEDIO, etc.</td><td>Añadir "Ventas" → suma de ventas por celda</td></tr>
        <tr><td><strong>Filtros</strong></td><td>Limita qué datos entran en el cálculo de la tabla dinámica (ver más abajo).</td><td>Filtrar por "Año = 2026"</td></tr>
      </tbody>
    </table></div>
    <p>Aplicando "Región" a Filas, "Producto" a Columnas y "Ventas" a Valores (con SUMA), la tabla dinámica resultante a partir de los datos en bruto de arriba queda así:</p>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Resultado — Tabla dinámica (Filas: Región · Columnas: Producto · Valores: SUMA de Ventas)</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Región</td><td>Monitor</td><td>Portátil</td></tr>
          <tr><td class="gs-rownum">2</td><td>Norte</td><td>450</td><td>2.100</td></tr>
          <tr><td class="gs-rownum">3</td><td>Sur</td><td>600</td><td>1.500</td></tr>
          <tr><td class="gs-rownum">4</td><td class="hl-yellow">Total general</td><td class="hl-yellow">1.050</td><td class="hl-yellow">3.600</td></tr>
        </tbody>
      </table>
    </div>
    <p>Fíjate en la celda "Norte / Portátil" (2.100): es la <strong>suma</strong> de las dos ventas de portátiles en la región Norte (1.200 de Ana + 900 de Luis) — exactamente lo que hace una tabla dinámica: agrupar y calcular automáticamente.</p>
    <div class="callout warn"><span class="callout-icon">📌</span><p>Puedes anidar varios campos en Filas o Columnas: si añades "Región" y luego "Producto" en Filas, verás cada producto desglosado dentro de cada región.</p></div>

    <h2>Agrupar fechas y números</h2>
    <p>Las listas largas de fechas son difíciles de leer. Haciendo clic derecho sobre un valor de fecha dentro de la tabla dinámica y eligiendo <strong>Crear grupo de fechas dinámicas</strong>, puedes agruparlas por mes, trimestre o año en lugar de ver cada día suelto. De forma parecida, los números se pueden agrupar en rangos (por ejemplo, pedidos de 1–10, 11–20, 21–30 unidades).</p>

    <h2>Errores típicos al crear tablas dinámicas</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Síntoma</th><th>Causa probable</th></tr></thead>
      <tbody>
        <tr><td>No refleja datos nuevos añadidos abajo</td><td>El rango de origen está fijo (ej. A1:F50). Usa un rango abierto como <code>A:F</code> para que incluya filas futuras automáticamente.</td></tr>
        <tr><td>Faltan filas o columnas</td><td>Se seleccionó un rango incorrecto al crearla; omitir una sola columna puede cambiar los resultados.</td></tr>
        <tr><td>Los campos no aparecen bien</td><td>El dataset no tiene encabezados adecuados en la primera fila.</td></tr>
        <tr><td>Los totales salen mal</td><td>La tabla dinámica está usando el cálculo incorrecto (ej. CONTAR en vez de SUMA), o los números están guardados como texto.</td></tr>
      </tbody>
    </table></div>
  </div>

  <!-- GSP2: Filtro normal -->
  <div class="sub-sec" id="sub-gsp2">
    <h2>¿Qué es el filtro normal?</h2>
    <p>El <strong>filtro básico</strong> (el icono de embudo de la barra de herramientas, o <code>Datos → Crear un filtro</code>) oculta temporalmente filas según los criterios que definas. <strong>No borra ni modifica los datos</strong>, solo deja de mostrar las filas que no cumplen la condición.</p>

    <h2>Cómo aplicarlo</h2>
    <ol>
      <li>Selecciona el rango de datos (con encabezados).</li>
      <li><code>Datos → Crear un filtro</code>. Aparece un icono de embudo en cada encabezado de columna.</li>
      <li>Haz clic en el embudo de la columna que quieras filtrar:
        <ul>
          <li><strong>Filtrar por condición:</strong> eliges una condición de una lista (mayor que, contiene texto, fecha posterior a...) o creas una propia.</li>
          <li><strong>Filtrar por valores:</strong> desmarcas los valores concretos que quieras ocultar.</li>
        </ul>
      </li>
    </ol>

    <h2>La gran limitación del filtro normal</h2>
    <div class="callout warn"><span class="callout-icon">⚠️</span><p>El filtro normal es <strong>único por hoja y visible para todos</strong> los que tengan acceso a ella. Si tú aplicas un filtro y otra persona abre la hoja al mismo tiempo, verá exactamente el mismo filtro aplicado — y si lo cambia, te afecta a ti también.</p></div>
    <p>Además, si usas el filtro para <strong>ordenar</strong> los datos, esa ordenación sí que modifica físicamente el orden de las filas en la hoja (a diferencia de la vista de filtro, que es no destructiva).</p>

    <h2>Quitar el filtro</h2>
    <p>Vuelve a <code>Datos → Quitar filtro</code>, o haz clic en el icono de embudo de la barra de herramientas para desactivarlo.</p>
  </div>

  <!-- GSP3: Vista de filtro -->
  <div class="sub-sec" id="sub-gsp3">
    <h2>¿Qué es una vista de filtro?</h2>
    <p>Una <strong>vista de filtro (Filter View)</strong> es un filtro con nombre, guardado y reutilizable, que <strong>solo tú ves</strong> mientras está activa — no afecta a lo que ven los demás colaboradores de la hoja. Es la solución al problema principal del filtro normal.</p>
    <div class="callout tip"><span class="callout-icon">✅</span><p>Úsala cuando varias personas trabajan a la vez sobre la misma hoja y cada una necesita ver los datos ordenados o filtrados de forma distinta, sin pisarse entre sí.</p></div>

    <h2>Cómo crear una vista de filtro</h2>
    <ol>
      <li><code>Datos → Vistas de filtro → Crear una nueva vista de filtro</code>.</li>
      <li>Se abre un modo especial (fondo oscuro) donde puedes filtrar y ordenar libremente sin miedo a afectar a nadie más ni a los datos originales.</li>
      <li>Por defecto se llama "Filtro 1"; puedes hacer clic en el nombre, en la esquina superior izquierda, para renombrarla a algo descriptivo (ej. "Solo 2026 — Cliente B").</li>
      <li>Para salir, haz clic en <strong>Cerrar</strong> en la esquina superior derecha.</li>
    </ol>

    <h2>Reabrir o cambiar de vista</h2>
    <p><code>Datos → Cambiar vista</code> y elige la vista de filtro guardada que quieras aplicar. Solo se puede aplicar <strong>una vista de filtro a la vez</strong> por hoja.</p>

    <h2>Compartir una vista de filtro</h2>
    <p>Cada vista de filtro genera un código en la URL (algo como <code>...&amp;fvid=1808337978</code>). Si compartes esa URL completa con alguien, al abrirla verá automáticamente los datos con esa vista de filtro aplicada.</p>

    <h2>Filtro normal vs. Vista de filtro</h2>
    <div class="table-wrap"><table>
      <thead><tr><th></th><th>Filtro normal</th><th>Vista de filtro</th></tr></thead>
      <tbody>
        <tr><td><strong>¿Quién lo ve?</strong></td><td>Todos los que tengan acceso a la hoja</td><td>Solo quien la activó</td></tr>
        <tr><td><strong>¿Se puede guardar?</strong></td><td>No, hay uno único por hoja</td><td>Sí, varias con nombre, reutilizables</td></tr>
        <tr><td><strong>¿Modifica el orden real?</strong></td><td>Si ordenas, sí</td><td>No, nunca toca los datos originales</td></tr>
        <tr><td><strong>Permisos para crearla</strong></td><td>Acceso de edición</td><td>Con solo acceso de lectura puedes crear una temporal</td></tr>
      </tbody>
    </table></div>
  </div>

  <!-- GSP4: Control de filtros -->
  <div class="sub-sec" id="sub-gsp4">
    <h2>¿Qué es un control de filtros?</h2>
    <p>El <strong>control de filtros (Filter control / Slicer)</strong> es un elemento visual independiente que se coloca sobre la hoja y permite filtrar <strong>un gráfico o una tabla dinámica</strong> sin tocar la tabla de datos original. Es la herramienta pensada específicamente para paneles e informes interactivos.</p>
    <div class="callout info"><span class="callout-icon">🎛️</span><p>Mientras la vista de filtro filtra la hoja entera para ti solo, el control de filtros es un mando visible para todos que filtra un gráfico o tabla dinámica concretos.</p></div>

    <h2>Cómo añadir un control de filtros</h2>
    <ol>
      <li>Haz clic en el gráfico o la tabla dinámica que quieras filtrar.</li>
      <li><code>Datos → Añadir un control de filtros</code>.</li>
      <li>A la derecha, elige la columna por la que quieres filtrar.</li>
      <li>Haz clic en el control y define las reglas: <strong>Filtrar por condición</strong> (elige o crea una condición) o <strong>Filtrar por valores</strong> (desmarca lo que quieras ocultar).</li>
    </ol>
    <div class="callout warn"><span class="callout-icon">📌</span><p>Un control de filtros solo puede filtrar por <strong>una columna</strong>. Si necesitas filtrar por varias, añade varios controles de filtros, uno por columna.</p></div>

    <h2>Visibilidad y permisos</h2>
    <ul>
      <li><strong>Visibilidad:</strong> cualquiera con acceso a la hoja ve el control y puede ajustarlo, pero el cambio que aplique <strong>solo lo ve esa persona</strong> (a menos que se marque como predeterminado).</li>
      <li><strong>Permisos para añadir/quitar:</strong> hace falta acceso de edición.</li>
      <li><strong>Reutilización:</strong> los filtros que aplica cada usuario no se guardan, salvo que se fijen como predeterminados desde el menú "Más" del control (y entonces sí se aplican a todo el mundo que abra la hoja).</li>
    </ul>

    <h2>Eliminar un control de filtros</h2>
    <p>Haz clic en el control de filtros, pulsa <code>Eliminar</code> o <code>Retroceso</code>, y luego confirma en <code>Menú → Eliminar control de filtros</code>.</p>

    <h2>Resumen: las tres herramientas de filtrado</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Herramienta</th><th>Filtra...</th><th>¿Para quién?</th><th>Caso de uso típico</th></tr></thead>
      <tbody>
        <tr><td><strong>Filtro normal</strong></td><td>La hoja entera</td><td>Todos por igual</td><td>Vista principal compartida (ej. solo proyectos activos)</td></tr>
        <tr><td><strong>Vista de filtro</strong></td><td>La hoja entera</td><td>Solo quien la activa</td><td>Cada persona necesita ver/explorar los datos a su manera</td></tr>
        <tr><td><strong>Control de filtros</strong></td><td>Un gráfico o tabla dinámica concreta</td><td>Visible para todos, ajuste individual</td><td>Dashboards e informes interactivos</td></tr>
      </tbody>
    </table></div>
  </div>
</template>

    <h2>Atajos de teclado esenciales</h2>

    <div class="callout info"><span class="callout-icon">💡</span><p>En el menú de atajos (<code>Ctrl + /</code>) puedes activar "Habilitar atajos de hoja de cálculo compatibles" para usar también los atajos clásicos de Excel.</p></div>

    <h2>Funciones que conviene dominar</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Función</th><th>Para qué sirve</th></tr></thead>

        <tr><td><code>SUMAR.SI</code> / <code>CONTAR.SI</code></td><td>Sumar o contar celdas que cumplen una condición</td></tr>
        <tr><td><code>SUMAR.SI.CONJUNTO</code></td><td>Igual, pero con varias condiciones a la vez</td></tr>
        <tr><td><code>BUSCARV</code> / <code>XLOOKUP</code></td><td>Buscar un valor en una columna y devolver un dato relacionado de otra. <code>XLOOKUP</code> es más flexible (busca en cualquier dirección)</td></tr>

  <!-- GST2: IMPORTRANGE -->
  <div class="sub-sec" id="sub-gst2">
    <h2>IMPORTRANGE — referencia a otro libro de Sheets</h2>
    <p><strong>IMPORTRANGE</strong> trae un rango de celdas desde <strong>otro archivo</strong> de Google Sheets (un libro distinto, no solo otra pestaña del mismo archivo). El resultado queda <strong>vinculado</strong>: si los datos de origen cambian, la copia importada se actualiza sola.</p>
    <pre><span class="lt">sheets</span><code><span class="fn">IMPORTRANGE</span>(url_o_id_hoja_origen; cadena_de_rango)</code></pre>

    <h2>Ejemplo: traer ventas desde otro libro a un panel de control</h2>
    <p>Imagina un libro "Ventas_Origen" con esta hoja llamada "Datos":</p>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Libro "Ventas_Origen" — Hoja "Datos"</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Producto</td><td>Región</td><td>Ventas</td></tr>
          <tr><td class="gs-rownum">2</td><td>Teclado</td><td>Norte</td><td>1.200</td></tr>
          <tr><td class="gs-rownum">3</td><td>Monitor</td><td>Sur</td><td>2.300</td></tr>
        </tbody>
      </table>
    </div>
    <p>Desde un libro distinto, "Panel_Control", se importa ese rango con:</p>
    <pre><span class="lt">sheets</span><code><span class="fn">IMPORTRANGE</span>(<span class="str">"https://docs.google.com/spreadsheets/d/abc123XYZ"</span>; <span class="str">"Datos!A1:C3"</span>)</code></pre>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Libro "Panel_Control" — resultado de la fórmula en A1</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td class="hl-green">Producto</td><td class="hl-green">Región</td><td class="hl-green">Ventas</td></tr>
          <tr><td class="gs-rownum">2</td><td class="hl-green">Teclado</td><td class="hl-green">Norte</td><td class="hl-green">1.200</td></tr>
          <tr><td class="gs-rownum">3</td><td class="hl-green">Monitor</td><td class="hl-green">Sur</td><td class="hl-green">2.300</td></tr>
        </tbody>
      </table>
    </div>
    <div class="callout warn"><span class="callout-icon">⚠️</span><p>La primera vez que se ejecuta contra una hoja nueva aparece <code>#REF!</code> con un botón "Permitir acceso": hay que pulsarlo una vez, y a partir de ahí la conexión queda autorizada permanentemente.</p></div>

    <h2>Errores comunes y cómo resolverlos</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Error o síntoma</th><th>Causa habitual</th></tr></thead>
      <tbody>
        <tr><td><code>#REF! — Acceso no autorizado</code></td><td>Aún no se ha pulsado "Permitir acceso" la primera vez</td></tr>
        <tr><td><code>#REF! — No se encuentra la hoja o el rango</code></td><td>El nombre de la pestaña cambió, o el rango especificado ya no existe en el origen</td></tr>
        <tr><td>Error de análisis de la fórmula</td><td>Faltan comillas alrededor de la URL o del rango, o hay un carácter de más</td></tr>
        <tr><td>Los datos no se actualizan</td><td>El libro de origen tiene que estar accesible; IMPORTRANGE necesita conexión a internet y recalcular al abrir el archivo destino</td></tr>
      </tbody>
    </table></div>
    <div class="callout tip"><span class="callout-icon">✅</span><p>Si solo necesitas un dato puntual (no toda la tabla), combina IMPORTRANGE con BUSCARV: <code>=BUSCARV(A2; IMPORTRANGE("url";"Datos!A:C"); 3; FALSO)</code> — así no traes toda la tabla a la vista, solo el valor que te interesa.</p></div>
    <div class="callout warn"><span class="callout-icon">📌</span><p>Hay un límite de 10 MB de datos por solicitud, y cuantas más fórmulas IMPORTRANGE tenga una hoja, más lenta se vuelve. Si necesitas importar mucho volumen de datos de forma habitual, conviene explorar alternativas como Hojas conectadas o Apps Script.</p></div>
  </div>

  <!-- GST3: Casillas de verificación -->
  <div class="sub-sec" id="sub-gst3">
    <h2>Casillas de verificación — checkboxes interactivos</h2>
    <p>Una <strong>casilla de verificación</strong> es, por debajo, una celda con dos posibles valores: <strong>VERDADERO</strong> cuando está marcada, <strong>FALSO</strong> cuando no — pero mostrada como un cuadradito interactivo en el que se puede hacer clic, en vez de tener que escribir el texto a mano.</p>
    <ol>
      <li>Selecciona la celda o el rango donde quieres las casillas.</li>
      <li><code>Insertar → Casilla de verificación</code>.</li>
    </ol>

    <h2>Ejemplo: lista de tareas con seguimiento</h2>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Hoja1 — Lista de tareas, con casillas en la columna B</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Tarea</td><td>Hecho</td></tr>
          <tr><td class="gs-rownum">2</td><td>Enviar informe mensual</td><td class="hl-green">☑ VERDADERO</td></tr>
          <tr><td class="gs-rownum">3</td><td>Revisar presupuesto</td><td class="hl-yellow">☐ FALSO</td></tr>
          <tr><td class="gs-rownum">4</td><td>Llamar al proveedor</td><td class="hl-green">☑ VERDADERO</td></tr>
        </tbody>
      </table>
    </div>
    <p>Haciendo clic en cualquier celda con casilla, en la barra de fórmulas se ve literalmente <code>VERDADERO</code> o <code>FALSO</code> — la casilla es solo la forma visual de ese valor lógico.</p>

    <h2>Combinarlas con formato condicional: tachar tareas completadas</h2>
    <p>El uso más popular: que el texto de la tarea se tache y cambie de color automáticamente al marcar su casilla.</p>
    <ol>
      <li>Selecciona el rango con los textos de las tareas (columna A).</li>
      <li><code>Formato → Formato condicional → La fórmula personalizada es</code>.</li>
      <li>Escribe: <code>=$B2=VERDADERO</code> (apuntando a la casilla de esa misma fila).</li>
      <li>Estilo: texto tachado y color gris.</li>
    </ol>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Resultado tras marcar las casillas de las filas 2 y 4</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Tarea</td><td>Hecho</td></tr>
          <tr><td class="gs-rownum">2</td><td style="text-decoration:line-through;color:#9aa0a6">Enviar informe mensual</td><td class="hl-green">☑</td></tr>
          <tr><td class="gs-rownum">3</td><td>Revisar presupuesto</td><td class="hl-yellow">☐</td></tr>
          <tr><td class="gs-rownum">4</td><td style="text-decoration:line-through;color:#9aa0a6">Llamar al proveedor</td><td class="hl-green">☑</td></tr>
        </tbody>
      </table>
    </div>

    <h2>Contar tareas completadas con CONTAR.SI</h2>
    <p>Como cada casilla es en el fondo un VERDADERO/FALSO, se puede contar directamente con CONTAR.SI, igual que cualquier otra condición:</p>
    <pre><span class="lt">sheets</span><code><span class="fn">CONTAR.SI</span>(B2:B4; <span class="kw">VERDADERO</span>)   <span class="cm">// devuelve 2 (tareas completadas)</span></code></pre>
    <div class="callout tip"><span class="callout-icon">✅</span><p>Esto permite crear un indicador de progreso del tipo "2 de 3 tareas completadas" sin tocar nada manualmente: la cuenta se actualiza solo cada vez que se marca o desmarca una casilla.</p></div>

    <h2>Combinando casilla + SI: calcular un precio según el tipo de visitante</h2>
    <p>Otro uso muy práctico: usar la casilla como un interruptor "adulto / infantil" dentro de una fórmula <code>SI</code>, para que el precio se calcule solo con un clic, sin tener que escribirlo a mano.</p>
    <p>Primero, dos celdas con los precios de referencia:</p>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Hoja1 — Precios de entrada</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>entrada adulto</td><td class="hl-yellow">24</td></tr>
          <tr><td class="gs-rownum">2</td><td>entrada infantil</td><td class="hl-yellow">12</td></tr>
        </tbody>
      </table>
    </div>
    <p>Más abajo, una lista de visitantes con una casilla en la columna "adulto" (marcada si es adulto, sin marcar si es infantil) y una columna "precio" con la fórmula:</p>
    <pre><span class="lt">sheets</span><code><span class="fn">SI</span>(B7; $B$1; $B$2)</code></pre>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Hoja1 — Visitantes (fórmula en C7, copiada hacia abajo)</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">6</td><td>visitante</td><td>adulto</td><td>precio</td></tr>
          <tr><td class="gs-rownum">7</td><td>Miguel</td><td class="hl-green">☑</td><td class="hl-blue">24</td></tr>
          <tr><td class="gs-rownum">8</td><td>Paula</td><td class="hl-yellow">☐</td><td class="hl-blue">12</td></tr>
          <tr><td class="gs-rownum">9</td><td>Nicole</td><td class="hl-yellow">☐</td><td class="hl-blue">12</td></tr>
        </tbody>
      </table>
    </div>
    <p>La lógica es la misma que cualquier SI, solo que la "prueba lógica" es directamente la casilla: como una casilla marcada equivale a <code>VERDADERO</code>, <code>SI(B7;...)</code> es exactamente lo mismo que escribir <code>SI(B7=VERDADERO;...)</code>. Para Miguel (casilla marcada → adulto), la fórmula devuelve el precio de A1 (24€); para Paula y Nicole (casilla sin marcar → infantil), devuelve el precio de A2 (12€).</p>
    <div class="callout warn"><span class="callout-icon">📌</span><p>Los precios de referencia (<code>$B$1</code> y <code>$B$2</code>) van con <strong>$</strong> para fijarlos: así, al copiar la fórmula de C7 hacia abajo (C8, C9...), la referencia a la casilla de cada fila se ajusta sola (B7 → B8 → B9), pero los precios siempre apuntan a las mismas dos celdas.</p></div>
    <div class="callout tip"><span class="callout-icon">✅</span><p>Esta misma idea sirve para cualquier "interruptor de dos opciones": tarifa socio/no socio, envío estándar/exprés, con IVA/sin IVA... — una casilla, dos valores de referencia fijos, y un SI que decide cuál usar.</p></div>

    <h2>Valores personalizados (en vez de VERDADERO/FALSO)</h2>
    <p>Si VERDADERO/FALSO no es lo más claro para tu caso, puedes hacer que la casilla represente otro par de valores (ej. "Sí"/"No", o "Pagado"/"Pendiente"):</p>
    <ol>
      <li>Selecciona la celda con la casilla.</li>
      <li><code>Datos → Validación de datos</code>, con criterio "Casilla de verificación".</li>
      <li>Activa "Usar valores personalizados de celda" y escribe el valor para marcada y para desmarcada.</li>
    </ol>
    <div class="callout warn"><span class="callout-icon">📌</span><p>Las casillas de verificación también funcionan dentro de filtros, tablas dinámicas y gráficos — por ejemplo, puedes filtrar una lista para ver solo las filas marcadas como VERDADERO.</p></div>
  </div>

  <!-- GST4: Formato, rangos y protección -->
  <div class="sub-sec" id="sub-gst4">
    <h2>Formato condicional</h2>
    <p>Resalta automáticamente celdas según una regla (ej. número mayor que X, texto que contiene una palabra). Convierte una hoja llena de números en algo que se lee de un vistazo: <code>Formato → Formato condicional</code>.</p>

    <h2>Proteger rangos</h2>
    <p>Para evitar cambios accidentales en una hoja compartida: selecciona el rango → clic derecho → <strong>Proteger rango</strong>. Puedes limitar quién tiene permiso para editar esa zona, dejando el resto de la hoja libre para todos.</p>

    <h2>Rangos con nombre</h2>
    <p>En vez de escribir <code>=SUMA(B2:B500)</code>, puedes nombrar ese rango (ej. "Ingresos_Mensuales") desde <code>Datos → Rangos con nombre</code> y luego escribir <code>=SUMA(Ingresos_Mensuales)</code>. Las fórmulas quedan mucho más legibles, y el rango con nombre también funciona en validación de datos y gráficos.</p>
  </div>

  <!-- GST5: Proteger hojas y formularios -->
  <div class="sub-sec" id="sub-gst5">
    <h2>Proteger una hoja completa</h2>
    <p>Cuando una hoja entera no debe tocarse (por ejemplo, una pestaña de "Resumen" o "Dashboard" que solo lee de otras hojas), se protege de un solo golpe en vez de celda a celda.</p>
    <ol>
      <li>Haz clic en la flecha de la pestaña de la hoja (abajo) → <strong>Proteger hoja</strong>, o bien <code>Datos → Hojas y rangos protegidos</code>.</li>
      <li>En el panel derecho, selecciona <strong>Hoja</strong> y elige cuál.</li>
      <li><strong>Establecer permisos</strong>: elige quién puede editar — "Solo tú", usuarios concretos, o "Mostrar una advertencia" si prefieres avisar en vez de bloquear del todo.</li>
    </ol>
    <div class="callout warn"><span class="callout-icon">⚠️</span><p>Esto no es una medida de seguridad real: cualquiera con acceso de lectura puede igualmente imprimir, copiar o exportar una copia de los datos. Sirve para evitar ediciones accidentales, no para ocultar información sensible.</p></div>

    <h2>Ejemplo: proteger solo el encabezado, no los datos</h2>
    <p>Un caso muy habitual: quieres que el equipo pueda seguir actualizando precios y stock, pero sin que nadie inserte o borre columnas y rompa las fórmulas que dependen de ese orden.</p>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Hoja1 — solo la fila 1 (encabezado) está protegida</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td class="hl-red">Producto 🔒</td><td class="hl-red">Precio 🔒</td><td class="hl-red">Stock 🔒</td></tr>
          <tr><td class="gs-rownum">2</td><td>Teclado</td><td>25</td><td>40</td></tr>
          <tr><td class="gs-rownum">3</td><td>Monitor</td><td>150</td><td>12</td></tr>
        </tbody>
      </table>
    </div>
    <p>Para conseguirlo: selecciona solo la <strong>fila 1</strong> → <code>Datos → Hojas y rangos protegidos</code> → restringe la edición de ese rango a ti. El resto de la tabla (filas 2 en adelante) queda totalmente libre para que cualquiera actualice precios y stock sin tocar la estructura de columnas.</p>
    <div class="callout tip"><span class="callout-icon">✅</span><p>El mismo truco funciona en vertical: proteger la primera columna evita que se inserten o eliminen filas de forma descontrolada, manteniendo intacto el orden que usan tus fórmulas.</p></div>

    <h2>Proteger un rango concreto, con excepciones</h2>
    <p>Si en vez de toda la hoja solo quieres bloquear un rango específico (por ejemplo, una tabla de fórmulas en medio de la hoja), pero permitir que se edite alguna celda suelta dentro de ese rango:</p>
    <ol>
      <li>Selecciona el rango a proteger → <code>Datos → Hojas y rangos protegidos → Añadir un rango</code>.</li>
      <li>Marca <strong>"Excepto ciertas celdas"</strong> y elige las celdas que sí quieres dejar editables dentro de ese rango.</li>
      <li>Establece permisos: "Solo tú", o usuarios concretos como excepción.</li>
    </ol>
    <div class="callout warn"><span class="callout-icon">📌</span><p>Para ver de un vistazo qué celdas están protegidas en una hoja compartida: <code>Ver → Mostrar rangos protegidos</code>. Aparecen marcadas con un patrón de rayas diagonales.</p></div>

    <h2>Ocultar una hoja (no es lo mismo que protegerla)</h2>
    <p>Clic derecho en la pestaña de la hoja → <strong>Ocultar hoja</strong>. Es útil para esconder pestañas auxiliares de cálculo que no necesitan verse a diario.</p>
    <div class="callout warn"><span class="callout-icon">⚠️</span><p>Ocultar ≠ proteger: cualquier persona con permiso de edición puede volver a mostrar una hoja oculta desde <code>Ver → Mostrar [nombre de hoja]</code>. Si los datos son sensibles, hace falta protección de permisos, no solo ocultarlos.</p></div>

    <h2>Cómo crear un formulario de Google (Forms)</h2>
    <p>Antes de proteger un formulario, hay que saber montarlo. Se crea desde <code>forms.google.com</code>, o directamente desde Drive (<code>Nuevo → Más → Formularios de Google</code>), eligiendo entre <strong>en blanco</strong> o una plantilla prediseñada (encuesta, inscripción, evaluación...).</p>
    <ol>
      <li>Ponle un <strong>título</strong> claro y, si hace falta, una <strong>descripción</strong> (qué es, cuánto tarda en rellenarse, instrucciones).</li>
      <li>Pulsa el icono <strong>+</strong> de la barra lateral derecha para añadir cada pregunta.</li>
      <li>Para cada pregunta, elige el tipo de respuesta en el desplegable de la derecha.</li>
      <li>Marca <strong>Obligatorio</strong> en las preguntas que no se puedan dejar en blanco.</li>
    </ol>

    <h2>Los tipos de pregunta disponibles</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Tipo</th><th>Cuándo usarlo</th></tr></thead>
      <tbody>
        <tr><td><strong>Respuesta corta</strong></td><td>Datos breves: nombre, email, teléfono</td></tr>
        <tr><td><strong>Párrafo</strong></td><td>Comentarios u observaciones más largas</td></tr>
        <tr><td><strong>Opción múltiple</strong></td><td>Elegir <em>una</em> opción de una lista visible</td></tr>
        <tr><td><strong>Casillas de verificación</strong></td><td>Elegir <em>una o varias</em> opciones de una lista visible</td></tr>
        <tr><td><strong>Lista desplegable</strong></td><td>Elegir una opción de una lista, ahorrando espacio en pantalla</td></tr>
        <tr><td><strong>Subir archivos</strong></td><td>Que el encuestado adjunte un documento, imagen o vídeo (requiere su cuenta de Google)</td></tr>
        <tr><td><strong>Escala lineal</strong></td><td>Valorar algo en un rango numérico (ej. del 1 al 10)</td></tr>
        <tr><td><strong>Cuadrícula de opción múltiple / de casillas</strong></td><td>Varias preguntas con las mismas opciones de respuesta, en formato tabla</td></tr>
        <tr><td><strong>Fecha / Hora</strong></td><td>Capturar una fecha u hora con su propio selector</td></tr>
      </tbody>
    </table></div>

    <h2>Organizar preguntas largas: secciones</h2>
    <p>Cuando el formulario tiene muchas preguntas, dividirlo en <strong>secciones</strong> (icono de los dos rectángulos en la barra lateral) reduce la sensación de agobio: cada sección se muestra en su propia pantalla, con un botón "Siguiente" entre una y otra.</p>
    <div class="callout tip"><span class="callout-icon">✅</span><p>Con varias secciones puedes activar <strong>navegación condicional</strong>: por ejemplo, que una respuesta de opción múltiple decida a qué sección salta el encuestado a continuación, saltándose preguntas que no le aplican.</p></div>

    <h2>Validar respuestas</h2>
    <p>Para evitar datos mal escritos (un email sin "@", un teléfono con letras...), cada pregunta de texto tiene su propia <strong>validación de respuesta</strong> (menú <code>⋮</code> de la pregunta → Validación de respuesta): puedes exigir un número dentro de un rango, una longitud máxima de texto, una expresión regular, o que el texto coincida con un patrón (como un formato de email). Se puede personalizar el mensaje de error que ve el encuestado si no cumple la regla.</p>

    <h2>Personalizar el aspecto</h2>
    <p>El icono de la <strong>paleta de colores</strong> (arriba) abre el panel de tema: color de fondo y de acento, una imagen de encabezado, y el estilo/tamaño de fuente de títulos y preguntas.</p>

    <h2>Conectar el formulario con una hoja de respuestas</h2>
    <p>Esta es la pieza que conecta Forms con todo lo que ya sabes de Sheets: en la pestaña <strong>Respuestas</strong> del formulario, pulsa el icono verde de Sheets para <strong>vincular a una hoja de cálculo</strong>.</p>
    <ul>
      <li><strong>Crear una hoja de cálculo nueva</strong>: Google genera un archivo de Sheets dedicado, con una pestaña que se va rellenando en tiempo real con cada respuesta.</li>
      <li><strong>Seleccionar una hoja existente</strong>: las respuestas se añaden como una pestaña nueva dentro de un archivo que ya tienes — útil si quieres mantener varios formularios centralizados en el mismo libro.</li>
    </ul>
    <div class="callout tip"><span class="callout-icon">✅</span><p>También puedes hacerlo al revés: desde una hoja de cálculo ya creada, <code>Herramientas → Crear un formulario</code> — Forms se abre automáticamente vinculado a esa hoja, ideal cuando ya tienes la estructura de columnas pensada de antemano.</p></div>
    <div class="callout warn"><span class="callout-icon">📌</span><p>Para dejar de enviar nuevas respuestas a la hoja sin perder lo ya recogido: en Respuestas → icono de los tres puntos junto al icono de Sheets → <strong>Desvincular formulario</strong>. Las respuestas que ya estaban guardadas se quedan intactas; solo se detienen las futuras.</p></div>

    <h2>Proteger un formulario de Google (Forms)</h2>
    <p>Con Forms, "proteger" se traduce en controlar <strong>quién puede responder</strong> y <strong>quién puede editar</strong> — son dos enlaces y dos permisos completamente distintos.</p>
    <div class="table-wrap"><table>
      <thead><tr><th>Enlace</th><th>Qué permite</th><th>A quién se le da</th></tr></thead>
      <tbody>
        <tr><td><strong>Enlace para responder</strong></td><td>Rellenar el formulario</td><td>El público objetivo (alumnos, clientes, equipo...)</td></tr>
        <tr><td><strong>Enlace/acceso de editor</strong></td><td>Modificar preguntas, diseño y configuración</td><td>Solo colaboradores de confianza</td></tr>
      </tbody>
    </table></div>
    <div class="callout warn"><span class="callout-icon">⚠️</span><p>Error muy común: compartir por accidente el enlace de <strong>edición</strong> en vez del de <strong>respuesta</strong>. Quien lo reciba podrá cambiar las preguntas en vez de solo contestarlas. Siempre comprueba que copias el enlace que aparece tras pulsar <strong>Publicar</strong>, no la URL de la barra de direcciones mientras editas.</p></div>

    <h2>Restringir quién puede responder</h2>
    <ol>
      <li>En el formulario, pulsa <strong>Publicar</strong> (arriba a la derecha).</li>
      <li>En "Acceso general", elige si el enlace es para cualquiera que lo tenga, o restringido a usuarios/grupos concretos de tu organización.</li>
      <li>Para revocar el acceso pasado un tiempo, añade una <strong>fecha de caducidad</strong> al enlace.</li>
    </ol>
    <div class="callout tip"><span class="callout-icon">✅</span><p>Si solo quieres una respuesta por persona, activa <strong>"Limitar a 1 respuesta"</strong> en <code>Configuración → Respuestas</code>. Esto exige que el encuestado inicie sesión con una cuenta de Google, lo cual de paso impide respuestas duplicadas o anónimas.</p></div>

    <h2>Añadir colaboradores sin que puedan responder más de una vez</h2>
    <p>Para que alguien te ayude a construir el formulario sin exponerlo al público: menú <code>⋮ → Añadir colaboradores</code>, e inclúyelo como <strong>editor</strong>. Si solo necesita ver las respuestas, dáselo en la hoja de cálculo vinculada en vez de en el formulario.</p>
    <div class="callout warn"><span class="callout-icon">📌</span><p>Quien tiene acceso de editor en el formulario obtiene automáticamente acceso a la hoja de respuestas vinculada. Si le quitas el acceso más adelante, tienes que quitárselo en los dos sitios por separado: el formulario y la hoja.</p></div>
  </div>

  <!-- GST6: Buenas prácticas -->
  <div class="sub-sec" id="sub-gst6">
    <h2>Buenas prácticas generales</h2>
    <ul>
      <li><strong>Mantén los datos en bruto en su propia hoja</strong> y construye las tablas dinámicas o paneles en hojas separadas.</li>
      <li><strong>Usa rangos abiertos</strong> (ej. <code>A:F</code> en vez de <code>A1:F500</code>) en tablas dinámicas y fórmulas, para que las filas nuevas se incluyan automáticamente.</li>
      <li><strong>Duplica la hoja antes de hacer cambios estructurales grandes</strong> (sobre todo en tablas dinámicas): es más rápido que deshacer una cadena de errores.</li>
      <li>Si una tabla dinámica no se actualiza tras importar muchos datos nuevos, haz clic derecho sobre ella y elige <strong>Actualizar</strong> para forzarlo.</li>
    </ul>
  </div>
</template>
