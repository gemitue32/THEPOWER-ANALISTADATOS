  </div>

  <!-- GSA1: SUMAPRODUCTO -->
  <div class="sub-sec on" id="sub-gsa1">
    <h2>¿Qué hace SUMAPRODUCTO?</h2>
    <p><strong>SUMAPRODUCTO</strong> (en inglés <code>SUMPRODUCT</code>) multiplica cada elemento de un rango por el elemento correspondiente de otro rango, y después suma todos esos resultados. Es la función perfecta para calcular un total cuando hay que multiplicar "fila a fila" antes de sumar — como precio × cantidad.</p>
    <pre><span class="lt">sheets</span><code><span class="fn">SUMAPRODUCTO</span>(arreglo1; arreglo2; ...)</code></pre>

    <h2>Ejemplo: total de ventas sin columna auxiliar</h2>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Hoja1 — Ventas</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Producto</td><td>Precio (€)</td><td>Cantidad</td></tr>
          <tr><td class="gs-rownum">2</td><td>Teclado</td><td class="hl-yellow">25</td><td class="hl-yellow">4</td></tr>
          <tr><td class="gs-rownum">3</td><td>Ratón</td><td class="hl-yellow">12</td><td class="hl-yellow">10</td></tr>
          <tr><td class="gs-rownum">4</td><td>Monitor</td><td class="hl-yellow">150</td><td class="hl-yellow">2</td></tr>
        </tbody>
      </table>
    </div>
    <p>Sin SUMAPRODUCTO, harías falta una columna auxiliar D con <code>=B2*C2</code> en cada fila y luego una SUMA de esa columna. SUMAPRODUCTO hace ambos pasos en una sola fórmula:</p>
    <pre><span class="lt">sheets</span><code><span class="fn">SUMAPRODUCTO</span>(B2:B4; C2:C4)   <span class="cm">// (25×4) + (12×10) + (150×2) = 520</span></code></pre>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Cálculo interno de SUMAPRODUCTO</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th><th class="gs-colhead">D</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Producto</td><td>Precio</td><td>Cantidad</td><td>Precio×Cantidad</td></tr>
          <tr><td class="gs-rownum">2</td><td>Teclado</td><td>25</td><td>4</td><td>100</td></tr>
          <tr><td class="gs-rownum">3</td><td>Ratón</td><td>12</td><td>10</td><td>120</td></tr>
          <tr><td class="gs-rownum">4</td><td>Monitor</td><td>150</td><td>2</td><td>300</td></tr>
          <tr><td class="gs-rownum">5</td><td colspan="3" style="text-align:right"><strong>Total</strong></td><td class="hl-green"><strong>520</strong></td></tr>
        </tbody>
      </table>
    </div>
    <div class="callout tip"><span class="callout-icon">✅</span><p>SUMAPRODUCTO calcula esa columna D "de forma invisible" y directamente suma el resultado, sin necesidad de crearla realmente en la hoja.</p></div>

    <h2>Usarla como SUMAR.SI.CONJUNTO alternativo</h2>
    <p>Multiplicando condiciones (que en Sheets se evalúan como 1/0) por los valores a sumar, SUMAPRODUCTO puede sumar con varios criterios sin usar SUMAR.SI.CONJUNTO:</p>
    <pre><span class="lt">sheets</span><code><span class="fn">SUMAPRODUCTO</span>((A2:A4=<span class="str">"Teclado"</span>)*(C2:C4&gt;<span class="num">3</span>)*B2:B4)</code></pre>
    <div class="callout warn"><span class="callout-icon">📌</span><p>Cada condición entre paréntesis se convierte en VERDADERO/FALSO (1/0) por cada fila; al multiplicarlas todas entre sí y por el rango de valores, las filas que no cumplen alguna condición se anulan automáticamente (se multiplican por 0).</p></div>
  </div>

  <!-- GSA2: SI.FECHA y DIAS.LAB -->
  <div class="sub-sec" id="sub-gsa2">
    <h2>SI.FECHA: la diferencia entre dos fechas</h2>
    <p><strong>SI.FECHA</strong> (en inglés <code>DATEDIF</code>) calcula cuántos días, meses o años hay entre dos fechas — perfecta para calcular edades, antigüedad en un puesto, o duración de un proyecto.</p>
    <pre><span class="lt">sheets</span><code><span class="fn">SI.FECHA</span>(fecha_inicio; fecha_fin; unidad)</code></pre>
    <div class="table-wrap"><table>
      <thead><tr><th>Unidad</th><th>Qué calcula</th></tr></thead>
      <tbody>
        <tr><td><code>"Y"</code></td><td>Años completos entre las dos fechas</td></tr>
        <tr><td><code>"M"</code></td><td>Meses completos entre las dos fechas</td></tr>
        <tr><td><code>"D"</code></td><td>Días entre las dos fechas</td></tr>
        <tr><td><code>"YM"</code></td><td>Meses sobrantes después de restar los años completos</td></tr>
        <tr><td><code>"MD"</code></td><td>Días sobrantes después de restar los meses completos</td></tr>
      </tbody>
    </table></div>

    <h2>Ejemplo: antigüedad de un empleado</h2>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Hoja1 — Empleados</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Empleado</td><td>Fecha de alta</td><td>Antigüedad</td></tr>
          <tr><td class="gs-rownum">2</td><td>Ana</td><td class="hl-yellow">15/03/2019</td><td class="hl-green">7 años, 3 meses</td></tr>
        </tbody>
      </table>
    </div>
    <pre><span class="lt">sheets</span><code><span class="fn">SI.FECHA</span>(B2; HOY(); <span class="str">"Y"</span>)&amp;<span class="str">" años, "</span>&amp;<span class="fn">SI.FECHA</span>(B2; HOY(); <span class="str">"YM"</span>)&amp;<span class="str">" meses"</span></code></pre>
    <p>Combina dos SI.FECHA: el primero da los años completos, el segundo (con <code>"YM"</code>) da los meses sobrantes una vez descontados esos años — el resultado típico de "7 años, 3 meses" en vez de un número de meses totales poco intuitivo.</p>
    <div class="callout warn"><span class="callout-icon">📌</span><p>Si el resultado de SI.FECHA aparece como una fecha rara (ej. "1/4/1900") en vez de un número, cambia el formato de la celda a <strong>Número</strong> — suele heredar el formato de fecha de las celdas vecinas.</p></div>

    <h2>DIAS.LAB: días laborables entre dos fechas</h2>
    <p><strong>DIAS.LAB</strong> (en inglés <code>NETWORKDAYS</code>) cuenta los días hábiles entre dos fechas, excluyendo automáticamente sábados y domingos — y opcionalmente, una lista de festivos.</p>
    <pre><span class="lt">sheets</span><code><span class="fn">DIAS.LAB</span>(fecha_inicio; fecha_fin; [festivos])</code></pre>

    <h2>Ejemplo: duración real de un proyecto</h2>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Hoja1 — Proyecto (incluye un festivo)</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Inicio</td><td class="hl-yellow">01/12/2025 (lunes)</td></tr>
          <tr><td class="gs-rownum">2</td><td>Fin</td><td class="hl-yellow">12/12/2025 (viernes)</td></tr>
          <tr><td class="gs-rownum">3</td><td>Festivo</td><td class="hl-yellow">08/12/2025 (lunes)</td></tr>
          <tr><td class="gs-rownum">4</td><td>Días laborables</td><td class="hl-green">8</td></tr>
        </tbody>
      </table>
    </div>
    <pre><span class="lt">sheets</span><code><span class="fn">DIAS.LAB</span>(B1; B2; B3)   <span class="cm">// devuelve 8</span></code></pre>
    <p>Entre el 1 y el 12 de diciembre hay 12 días naturales, pero descontando los 2 fines de semana (4 días) y el festivo del 8 de diciembre, quedan <strong>8 días laborables</strong> reales.</p>
    <div class="callout tip"><span class="callout-icon">✅</span><p>Si necesitas que el fin de semana no sea sábado-domingo (por ejemplo, en países donde se trabaja en sábado), usa la variante <code>DIAS.LAB.INTL</code>, que permite definir tú mismo qué días son no laborables.</p></div>
  </div>

  <!-- GSA3: EXTRAE y TRANSPONER -->
  <div class="sub-sec" id="sub-gsa3">
    <h2>EXTRAE: sacar un fragmento de texto</h2>
    <p><strong>EXTRAE</strong> (en inglés <code>MID</code>) devuelve un trozo de texto a partir de una posición concreta, con una longitud determinada. A diferencia de IZQUIERDA o DERECHA, EXTRAE puede empezar en cualquier punto del texto, no solo al principio o al final.</p>
    <pre><span class="lt">sheets</span><code><span class="fn">EXTRAE</span>(texto; posición_inicial; nº_caracteres)</code></pre>

    <h2>Ejemplo: extraer el código de producto de una referencia</h2>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Hoja1 — Referencias de producto</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Referencia</td><td>Código producto</td></tr>
          <tr><td class="gs-rownum">2</td><td>REF-<span class="hl-yellow">4521</span>-ES</td><td class="hl-green">4521</td></tr>
        </tbody>
      </table>
    </div>
    <pre><span class="lt">sheets</span><code><span class="fn">EXTRAE</span>(A2; <span class="num">5</span>; <span class="num">4</span>)   <span class="cm">// empieza en el carácter 5, extrae 4 caracteres → "4521"</span></code></pre>
    <p>Contando carácter por carácter desde el principio de "REF-4521-ES": la "4" de "4521" está en la posición 5, y el código tiene 4 caracteres de longitud.</p>
    <div class="callout tip"><span class="callout-icon">✅</span><p>Si no sabes de antemano en qué posición empieza el fragmento (por ejemplo, porque el texto antes del código varía de longitud), combina EXTRAE con <code>HALLAR</code> para que calcule la posición inicial buscando un carácter de referencia, como el primer guion.</p></div>

    <h2>TRANSPONER: girar filas y columnas</h2>
    <p><strong>TRANSPONER</strong> (en inglés <code>TRANSPOSE</code>) convierte un rango horizontal en vertical, o viceversa: las filas se vuelven columnas y las columnas se vuelven filas. El resultado queda <strong>vinculado</strong> al original — si cambian los datos de origen, la versión transpuesta se actualiza sola.</p>
    <pre><span class="lt">sheets</span><code><span class="fn">TRANSPONER</span>(rango)</code></pre>

    <h2>Ejemplo: pasar meses de columnas a filas</h2>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Hoja1 — Datos originales (A1:D2)</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th><th class="gs-colhead">D</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Enero</td><td>Febrero</td><td>Marzo</td><td>Abril</td></tr>
          <tr><td class="gs-rownum">2</td><td>1.200</td><td>1.500</td><td>980</td><td>1.750</td></tr>
        </tbody>
      </table>
    </div>
    <pre><span class="lt">sheets</span><code><span class="fn">TRANSPONER</span>(A1:D2)</code></pre>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Resultado de TRANSPONER(A1:D2), escrito en F1</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">F</th><th class="gs-colhead">G</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Enero</td><td>1.200</td></tr>
          <tr><td class="gs-rownum">2</td><td>Febrero</td><td>1.500</td></tr>
          <tr><td class="gs-rownum">3</td><td>Marzo</td><td>980</td></tr>
          <tr><td class="gs-rownum">4</td><td>Abril</td><td>1.750</td></tr>
        </tbody>
      </table>
    </div>
    <div class="callout warn"><span class="callout-icon">📌</span><p>Asegúrate de que hay suficientes celdas vacías alrededor de donde escribes la fórmula: TRANSPONER necesita espacio para "desplegar" todos los resultados, y el formato de las celdas originales no se copia automáticamente.</p></div>
  </div>

  <!-- GSA4: CONTAR.SI, CONTARA, ESPACIOS -->
  <div class="sub-sec" id="sub-gsa4">
    <h2>CONTAR.SI: contar con una condición</h2>
    <p><strong>CONTAR.SI</strong> (en inglés <code>COUNTIF</code>) cuenta cuántas celdas de un rango cumplen una condición — sin sumar nada, solo cuenta cuántas hay.</p>
    <pre><span class="lt">sheets</span><code><span class="fn">CONTAR.SI</span>(rango; criterio)</code></pre>

    <h2>Ejemplo: cuántos pedidos están "Pendiente"</h2>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Hoja1 — Pedidos</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Pedido</td><td>Estado</td></tr>
          <tr><td class="gs-rownum">2</td><td>#1001</td><td class="hl-yellow">Pendiente</td></tr>
          <tr><td class="gs-rownum">3</td><td>#1002</td><td>Entregado</td></tr>
          <tr><td class="gs-rownum">4</td><td>#1003</td><td class="hl-yellow">Pendiente</td></tr>
          <tr><td class="gs-rownum">5</td><td>#1004</td><td></td></tr>
        </tbody>
      </table>
    </div>
    <pre><span class="lt">sheets</span><code><span class="fn">CONTAR.SI</span>(B2:B5; <span class="str">"Pendiente"</span>)   <span class="cm">// devuelve 2</span></code></pre>

    <h2>CONTARA: contar celdas no vacías (de cualquier tipo)</h2>
    <p><strong>CONTARA</strong> (en inglés <code>COUNTA</code>) cuenta todas las celdas que tienen algún contenido — números, texto, fechas, fórmulas — sin importar el tipo de dato. Es distinta de <code>CONTAR</code>, que solo cuenta valores numéricos.</p>
    <pre><span class="lt">sheets</span><code><span class="fn">CONTARA</span>(rango)</code></pre>
    <p>Sobre la misma tabla de pedidos, para saber cuántas filas tienen algún estado registrado (sin importar cuál):</p>
    <pre><span class="lt">sheets</span><code><span class="fn">CONTARA</span>(B2:B5)   <span class="cm">// devuelve 3 (la fila #1004 está vacía)</span></code></pre>
    <div class="table-wrap"><table>
      <thead><tr><th></th><th>CONTAR</th><th>CONTARA</th></tr></thead>
      <tbody>
        <tr><td><strong>Cuenta números</strong></td><td>Sí</td><td>Sí</td></tr>
        <tr><td><strong>Cuenta texto</strong></td><td>No</td><td>Sí</td></tr>
        <tr><td><strong>Cuenta celdas vacías</strong></td><td>No</td><td>No</td></tr>
        <tr><td><strong>Uso típico</strong></td><td>Promedios, totales numéricos</td><td>"¿Cuántas filas tienen algo registrado?"</td></tr>
      </tbody>
    </table></div>

    <h2>ESPACIOS: limpiar espacios sobrantes</h2>
    <p><strong>ESPACIOS</strong> (en inglés <code>TRIM</code>) elimina los espacios al principio y al final de un texto, y reduce los espacios dobles (o más) entre palabras a uno solo. Es una de las funciones de limpieza de datos más importantes: un espacio invisible de más es una de las causas más comunes de que BUSCARV o CONTAR.SI fallen sin motivo aparente.</p>
    <pre><span class="lt">sheets</span><code><span class="fn">ESPACIOS</span>(texto)</code></pre>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Hoja1 — Nombres con espacios sobrantes (invisibles a simple vista)</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Original</td><td>Limpio</td></tr>
          <tr><td class="gs-rownum">2</td><td class="hl-red">"  Ana   García "</td><td class="hl-green">"Ana García"</td></tr>
        </tbody>
      </table>
    </div>
    <pre><span class="lt">sheets</span><code><span class="fn">ESPACIOS</span>(A2)   <span class="cm">// "  Ana   García " → "Ana García"</span></code></pre>
    <div class="callout warn"><span class="callout-icon">⚠️</span><p>Si después de aplicar ESPACIOS un BUSCARV sigue sin encontrar coincidencias, es posible que el texto tenga "espacios de no separación" (copiados de páginas web), que ESPACIOS no elimina. En ese caso, usa <code>=ESPACIOS(SUSTITUIR(A2; CARACTER(160); " "))</code> para forzar también su limpieza.</p></div>

    <h2>Resumen: cuándo usar cada función de esta lección</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Necesito...</th><th>Función</th></tr></thead>
      <tbody>
        <tr><td>Multiplicar fila a fila y sumar el total (ej. precio × cantidad)</td><td>SUMAPRODUCTO</td></tr>
        <tr><td>Calcular la diferencia entre dos fechas (años, meses, días)</td><td>SI.FECHA</td></tr>
        <tr><td>Contar días hábiles entre dos fechas, sin fines de semana</td><td>DIAS.LAB</td></tr>
        <tr><td>Extraer un fragmento de texto del medio de una celda</td><td>EXTRAE</td></tr>
        <tr><td>Girar una tabla: convertir filas en columnas o al revés</td><td>TRANSPONER</td></tr>
        <tr><td>Contar cuántas celdas cumplen una condición</td><td>CONTAR.SI</td></tr>
        <tr><td>Contar cuántas celdas tienen algo (texto o número)</td><td>CONTARA</td></tr>
        <tr><td>Limpiar espacios sobrantes antes de comparar o buscar texto</td><td>ESPACIOS</td></tr>
      </tbody>
    </table></div>
  </div>
</template>

    <div class="th-eyebrow">Módulo 10 · Google Sheets · Lección 7</div>
    <div class="th-title">Macros: <em>automatizar</em> procesos</div>
    <p class="th-desc">Cómo grabar una secuencia de acciones una sola vez y repetirla con un clic, sin necesidad de saber programar.</p>
  </div>

  <div class="subtab-nav">
    <button class="stab active" data-sub="gsm1">1. Qué es una macro</button>
    <button class="stab" data-sub="gsm2">2. Grabar una macro</button>
    <button class="stab" data-sub="gsm3">3. Referencias absolutas vs relativas</button>

  </div>

  <!-- GSM1: Qué es una macro -->
  <div class="sub-sec on" id="sub-gsm1">
    <h2>¿Qué es una macro?</h2>
    <p>Una <strong>macro</strong> es una secuencia de acciones que Google Sheets "grava" mientras tú las realizas con normalidad (clics, formato, escribir, insertar filas...), para poder <strong>repetirlas después con un solo clic o un atajo de teclado</strong>. No es magia ni inteligencia artificial: es, literalmente, una grabadora de tus propios pasos.</p>
    <div class="callout info"><span class="callout-icon">💡</span><p>Piensa en ella como la macro de un mando a distancia universal: la "programas" pulsando los botones una vez, en el orden correcto, y luego repite exactamente esa secuencia cada vez que aprietas un único botón.</p></div>

    <h2>Qué pasa "por debajo": Google Apps Script</h2>
    <p>Cuando grabas una macro, Google Sheets traduce automáticamente cada acción a código en <strong>Google Apps Script</strong> (una variante de JavaScript) y lo guarda en un archivo del proyecto vinculado a tu hoja. No necesitas leer ni entender ese código para usar la macro — pero está ahí, y se puede editar si en el futuro quieres ajustar algún detalle.</p>

    <h2>¿Cuándo conviene usar una macro?</h2>
    <p>La señal más clara es la repetición: si te preguntas "¿no he hecho esto exactamente igual la semana pasada?", es candidato a macro.</p>
    <div class="table-wrap"><table>
      <thead><tr><th>Situación</th><th>¿Macro?</th><th>Por qué</th></tr></thead>
      <tbody>
        <tr><td>Aplicar el mismo formato a un informe cada semana</td><td class="hl-green">Sí</td><td>Pasos idénticos, repetidos en el tiempo</td></tr>
        <tr><td>Crear el mismo gráfico cada vez que llegan datos nuevos</td><td class="hl-green">Sí</td><td>Secuencia de clics siempre igual</td></tr>
        <tr><td>Analizar un dato puntual, una sola vez</td><td class="hl-red">No</td><td>No hay repetición que ahorrar</td></tr>
        <tr><td>Una tarea que cambia de pasos cada vez que se hace</td><td class="hl-red">No</td><td>Una macro grabada no "razona", solo repite</td></tr>
      </tbody>
    </table></div>

    <h2>Beneficios principales</h2>
    <ul>
      <li><strong>Ahorro de tiempo:</strong> una secuencia de varios minutos se reduce a un clic.</li>
      <li><strong>Consistencia:</strong> el resultado es idéntico cada vez, sin el desgaste de "hoy se me olvidó un paso".</li>
      <li><strong>Menos errores humanos:</strong> especialmente en tareas repetitivas como copiar, formatear o actualizar totales.</li>
    </ul>

    <h2>Limitaciones a tener en cuenta</h2>
    <div class="callout warn"><span class="callout-icon">📌</span><p>Una macro grabada repite <strong>exactamente</strong> los pasos que grabaste, en el mismo orden. Si la estructura de la hoja cambia (columnas movidas, nombres de pestaña distintos), la macro puede fallar o aplicar la acción al sitio incorrecto. Además, Google Sheets permite un máximo de <strong>10 macros</strong> por hoja de cálculo.</p></div>
  </div>

  <!-- GSM2: Grabar una macro -->
  <div class="sub-sec" id="sub-gsm2">
    <h2>Pasos para grabar tu primera macro</h2>
    <ol>
      <li><code>Extensiones → Macros → Grabar macro</code>.</li>
      <li>Aparece una barra en la parte inferior de la pantalla indicando que la grabación está en curso.</li>
      <li>Elige el tipo de referencia: <strong>absolutas</strong> o <strong>relativas</strong> (se explica en detalle en el siguiente subtema).</li>
      <li>Realiza con normalidad las acciones que quieres automatizar: clics, formato, escribir texto, insertar filas...</li>
      <li>Cuando termines, pulsa <strong>Guardar</strong>.</li>
      <li>Asigna un nombre descriptivo a la macro (evita "Macro1"; usa algo como "Formato informe semanal") y, opcionalmente, un atajo de teclado.</li>
    </ol>

    <h2>Ejemplo: grabar el formato de una tabla de informe</h2>
    <p>Supongamos que cada semana recibes una tabla de ventas sin formato, y siempre le aplicas los mismos tres pasos: negrita en encabezados, inmovilizar la primera fila, y aplicar bordes. Antes de tocar nada, lanzas <code>Grabar macro</code>:</p>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Antes — tabla sin formato</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Producto</td><td>Región</td><td>Ventas</td></tr>
          <tr><td class="gs-rownum">2</td><td>Teclado</td><td>Norte</td><td>1200</td></tr>
          <tr><td class="gs-rownum">3</td><td>Monitor</td><td>Sur</td><td>2300</td></tr>
        </tbody>
      </table>
    </div>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Después — mismo contenido, formato aplicado por la macro "Formato_Informe"</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td class="hl-blue"><strong>Producto</strong></td><td class="hl-blue"><strong>Región</strong></td><td class="hl-blue"><strong>Ventas</strong></td></tr>
          <tr><td class="gs-rownum">2</td><td>Teclado</td><td>Norte</td><td>1200</td></tr>
          <tr><td class="gs-rownum">3</td><td>Monitor</td><td>Sur</td><td>2300</td></tr>
        </tbody>
      </table>
    </div>
    <p>La semana siguiente, con datos completamente distintos en la misma estructura de tabla, ejecutar la macro <code>Herramientas → Macros → Formato_Informe</code> deja la tabla con el mismo aspecto en menos de un segundo.</p>

    <h2>Ejecutar una macro ya grabada</h2>
    <p><code>Extensiones → Macros</code> y, en la lista que aparece, haz clic en el nombre de la macro que quieras ejecutar. Si le asignaste un atajo de teclado, también puedes usarlo directamente.</p>
    <div class="callout tip"><span class="callout-icon">✅</span><p>La primera vez que ejecutes una macro nueva, Google Sheets pedirá permiso para activarla — es una medida de seguridad normal, no un error.</p></div>

    <h2>Editar o eliminar una macro</h2>
    <p><code>Extensiones → Macros → Administrar macros</code>. Desde ahí puedes cambiar el nombre, reasignar el atajo de teclado, abrir el código en el editor de Apps Script para ajustes finos, o eliminarla por completo.</p>
  </div>

  <!-- GSM3: Referencias absolutas vs relativas -->
  <div class="sub-sec" id="sub-gsm3">
    <h2>La decisión más importante al grabar: ¿absolutas o relativas?</h2>
    <p>Antes de empezar a grabar, Sheets siempre pregunta qué tipo de referencia usar. Esta elección determina <strong>dónde</strong> aplicará la macro sus acciones cuando la ejecutes después — y es la causa más común de que una macro "no haga lo que esperabas".</p>

    <h2>Referencias absolutas: siempre la misma celda</h2>
    <p>Con <strong>referencias absolutas</strong>, la macro repite la acción exactamente en las mismas celdas que grabaste, sin importar dónde esté el cursor cuando la ejecutes.</p>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Macro grabada: negrita en A1, con referencias ABSOLUTAS</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td class="hl-blue"><strong>Total</strong></td><td>120</td></tr>
          <tr><td class="gs-rownum">2</td><td>Subtotal</td><td>80</td></tr>
        </tbody>
      </table>
    </div>
    <p>Si ejecutas esta macro estando seleccionada la celda B2, la macro <strong>ignora</strong> tu selección y aplica negrita en A1 igualmente — porque fue ahí donde se grabó.</p>

    <h2>Referencias relativas: relativo a donde estés</h2>
    <p>Con <strong>referencias relativas</strong>, la macro aplica la acción tomando como referencia la celda donde tengas el cursor en el momento de ejecutarla — igual que se grabó, pero desplazado a la nueva posición.</p>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Macro grabada: negrita en la celda activa, con referencias RELATIVAS</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Producto</td><td>Región</td><td class="hl-green"><strong>Total</strong></td></tr>
        </tbody>
      </table>
    </div>
    <p>Si te colocas en la celda C1 y ejecutas esta macro, aplicará negrita ahí. Si la próxima vez te colocas en D5 y la ejecutas, aplicará negrita en D5 — la acción "viaja" contigo.</p>

    <h2>Cómo elegir entre una y otra</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Caso de uso</th><th>Tipo de referencia recomendado</th></tr></thead>
      <tbody>
        <tr><td>Aplicar un formato fijo siempre a la misma celda/rango (ej. un título en A1)</td><td>Absolutas</td></tr>
        <tr><td>Aplicar formato a una tabla cuyo tamaño o posición puede variar</td><td>Relativas</td></tr>
        <tr><td>Insertar una fórmula que se repetirá en distintas filas según donde estés</td><td>Relativas</td></tr>
        <tr><td>Limpiar siempre el mismo rango de celdas concreto (ej. un panel de filtros)</td><td>Absolutas</td></tr>
      </tbody>
    </table></div>
    <div class="callout warn"><span class="callout-icon">📌</span><p>Si una macro "no hace nada visible" o aplica el cambio en un sitio inesperado, la causa más frecuente es haber grabado con el tipo de referencia equivocado para el uso que le quieres dar.</p></div>
  </div>

  <!-- GSM4: Automatizar procesos reales -->
  <div class="sub-sec" id="sub-gsm4">
    <h2>Caso 1: actualizar un inventario tras las ventas del día</h2>
    <p>Cada día se registran las unidades vendidas; una macro puede restarlas automáticamente del stock y resaltar en rojo los productos que queden por debajo de un mínimo.</p>

      <div class="gs-sheet-caption">Antes — ventas del día introducidas, stock sin actualizar</div>

          <tr><td class="gs-rownum">3</td><td>Ratón</td><td>15</td><td class="hl-yellow">10</td></tr>
        </tbody>
      </table>
    </div>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Después — macro "Actualizar_Stock" ejecutada</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Producto</td><td>Stock</td><td>Vendido hoy</td></tr>
          <tr><td class="gs-rownum">2</td><td>Teclado</td><td class="hl-green">28</td><td>0</td></tr>
          <tr><td class="gs-rownum">3</td><td>Ratón</td><td class="hl-red">5</td><td>0</td></tr>
        </tbody>
      </table>
    </div>
    <p>La macro resta el stock, deja la columna "Vendido hoy" lista para mañana, y resalta en rojo el ratón porque su stock (5) cayó por debajo del mínimo establecido.</p>

    <h2>Caso 2: limpiar y resetear filtros con un clic</h2>
    <p>Restablecer manualmente cada filtro columna a columna es lento, sobre todo en tablas grandes. Una macro puede quitar y volver a aplicar el filtro de toda la tabla en un solo paso, dejándola lista para la siguiente persona que la use.</p>

    <h2>Caso 3: generar el mismo informe cada semana</h2>
    <p>Si cada lunes copias los datos de la semana, aplicas la misma tabla dinámica y el mismo gráfico, todo ese proceso se puede grabar una sola vez como macro y ejecutar después con un clic — el informe queda listo en segundos en vez de en 15-20 minutos de trabajo manual repetitivo.</p>

    <h2>Más allá de la grabadora: triggers automáticos</h2>
    <p>Las macros grabadas se ejecutan cuando tú las llamas. Pero también es posible configurar <strong>activadores (triggers)</strong> para que una macro se ejecute sola, sin intervención, ante ciertos eventos:</p>
    <div class="table-wrap"><table>
      <thead><tr><th>Tipo de activador</th><th>Cuándo se ejecuta la macro</th></tr></thead>
      <tbody>
        <tr><td>Por tiempo</td><td>Cada día, cada hora, o en una fecha/hora concreta</td></tr>
        <tr><td>Al editar la hoja</td><td>Cada vez que alguien cambia el contenido de una celda</td></tr>
        <tr><td>Al abrir el archivo</td><td>Cada vez que se abre la hoja de cálculo</td></tr>
      </tbody>
    </table></div>
    <p>Se configuran desde <code>Extensiones → Apps Script</code>, en el menú <code>Activadores</code> (icono de reloj) del editor.</p>
    <div class="callout tip"><span class="callout-icon">✅</span><p>Empieza siempre por macros cortas y sencillas: graba pocas acciones por macro y enlaza varias macros pequeñas si la tarea es larga, en vez de una sola macro gigante. Es más fácil de revisar, depurar y reutilizar por partes.</p></div>

    <h2>Resumen: del problema a la solución</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Necesito...</th><th>Solución</th></tr></thead>

        <tr><td>Que la macro se ejecute sola, sin que yo la llame</td><td>Macro + activador (trigger) por tiempo o por edición</td></tr>
        <tr><td>Una tarea de varios pasos que se repite cada semana</td><td>Grabar todos los pasos como una sola macro con nombre descriptivo</td></tr>
      </tbody>
    </table></div>

  <!-- GSE1: Cómo documentar un ejercicio -->
  <div class="sub-sec on" id="sub-gse1">
    <h2>Por qué documentar así</h2>
    <p>Cuando repases dentro de unas semanas, "la fórmula que usé" no es suficiente — necesitas recordar <strong>qué pedía el ejercicio</strong> y <strong>sobre qué datos</strong>, o la fórmula pierde sentido. Por eso cada ejercicio documentado aquí sigue siempre las mismas 5 partes, en el mismo orden:</p>
    <div class="table-wrap"><table>
      <thead><tr><th>Parte</th><th>Qué contiene</th><th>Por qué importa</th></tr></thead>
      <tbody>
        <tr><td><strong>1. Enunciado</strong></td><td>Lo que pedía el ejercicio, tal cual</td><td>Sin esto, la fórmula es un jeroglífico sin propósito</td></tr>
        <tr><td><strong>2. Dataset usado</strong></td><td>Una tabla visual con los datos de partida</td><td>La misma fórmula cambia de sentido según los datos — verla evita tener que adivinar</td></tr>
        <tr><td><strong>3. Fórmula / pasos</strong></td><td>La solución exacta, en código y/o menús</td><td>Es lo que vas a copiar cuando repases</td></tr>
        <tr><td><strong>4. Por qué funciona</strong></td><td>La idea clave o "truco" — no solo qué se escribió, sino qué problema resuelve</td><td>Es lo que realmente hay que recordar; la sintaxis se puede volver a buscar, el truco no</td></tr>
        <tr><td><strong>5. Resultado</strong></td><td>Una tabla visual con el resultado final</td><td>Confirmas de un vistazo que lo que hiciste coincide con lo que ves aquí</td></tr>
      </tbody>
    </table></div>
    <div class="callout tip"><span class="callout-icon">✅</span><p>Esta misma estructura (enunciado → datos → fórmula → por qué → resultado) es la que ya usamos en las lecciones de teoría del módulo. Aplicarla también a los ejercicios hace que repasar un concepto o repasar cómo lo aplicaste sea exactamente la misma experiencia.</p></div>

    <h2>Cómo pedirme que documente un ejercicio nuevo</h2>
    <p>Cuando termines un ejercicio (de esta lección o de cualquier otro), pídeme algo como:</p>
    <ul>
      <li>"Documenta el ejercicio 8 de validación de datos, así: [pega aquí tu fórmula o pasos]"</li>
      <li>"He resuelto el ejercicio 14 con esta fórmula: <code>=SUMAR.SI.CONJUNTO(...)</code>, añádelo a Ejercicios resueltos"</li>
    </ul>
    <p>Con el enunciado original (que ya tenemos en el listado de ejercicios) y tu solución, completo las 5 partes y lo añado como un subtema nuevo en esta misma lección — así se va construyendo tu propio banco de ejercicios resueltos, módulo a módulo.</p>

    <h2>Verificación antes de subir</h2>
    <p>Documentar un ejercicio con buen formato y comprobar que el resultado es <strong>correcto</strong> son dos cosas distintas. Antes de añadir cualquier ejercicio nuevo a esta lección, el proceso ahora incluye un paso intermedio:</p>
    <ol>
      <li>Recalculo los resultados de forma independiente contra el dataset (por ejemplo, en una pequeña comprobación con código), sin asumir que lo que envías es correcto solo por estar bien formateado.</li>
      <li>Te confirmo si los números/resultado coinciden antes de documentarlo.</li>
      <li>Si algo no cuadra, te lo señalo en vez de subirlo tal cual — y solo se añade a la lección una vez verificado.</li>
    </ol>
    <div class="callout warn"><span class="callout-icon">📌</span><p>Que un ejercicio aparezca documentado aquí significa que su resultado ha sido comprobado contra los datos, no solo que tiene buen aspecto visual.</p></div>
  </div>

  <!-- GSE2: Ejercicio 1.1 - Tabla dinámica -->
  <div class="sub-sec" id="sub-gse2">
    <h2>1. Enunciado</h2>
    <p>"Crea una tabla dinámica que muestre el total de 'Cantidad × Precio' (ventas) por Vendedor y por Categoría."</p>
    <div class="callout info"><span class="callout-icon">💡</span><p>Ejercicio <strong>1.1</strong> del bloque <strong>Tablas dinámicas y filtros</strong> (lección 1) de este módulo, dentro de la batería de ejercicios de repaso de las 8 lecciones de Sheets.</p></div>

    <h2>2. Dataset usado</h2>
    <p>El dataset de partida no traía directamente el importe vendido, así que el primer paso fue añadir una columna calculada "Ventas" en la hoja "Tienda":</p>
    <pre><span class="lt">sheets</span><code>=F2*G2   <span class="cm">// Cantidad × Precio</span></code></pre>
    <div class="gs-sheet-wrap">

        </tbody>
      </table>

    <div class="callout tip"><span class="callout-icon">✅</span><p>Este paso previo es clave: una tabla dinámica solo puede sumar una columna que <strong>ya exista</strong> en los datos de origen. No se puede pedirle directamente "Cantidad × Precio" dentro del propio editor de tabla dinámica — primero hay que calcularlo en una columna de la tabla en bruto.</p></div>

    <h2>3. Fórmula / pasos</h2>
    <ol>

    <h2>4. Por qué funciona</h2>
    <p>Una tabla dinámica reorganiza los datos cruzando dos campos categóricos: cada valor único de <strong>Vendedor</strong> se convierte en una fila, cada valor único de <strong>Categoría</strong> se convierte en una columna, y en cada celda donde se cruzan se calcula la <strong>suma</strong> de "Ventas" para esa combinación exacta — sin tener que escribir ninguna fórmula tú mismo.</p>
    <p>El truco a recordar: la tabla dinámica nunca modifica los datos originales de la hoja "Tienda"; es una vista resumida y recalculable que vive aparte. Por eso, si mañana añades una fila nueva de ventas, basta con actualizar la tabla dinámica (clic derecho → Actualizar) para que el resumen la incluya.</p>
    <div class="callout warn"><span class="callout-icon">📌</span><p>La fila y columna "Suma total" que ves en el resultado no hay que crearlas a mano: las añade automáticamente la propia tabla dinámica, sumando todas las filas y todas las columnas respectivamente.</p></div>

    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Hoja "Tienda" — todas las regiones</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">D</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Vendedor</td><td>Región</td></tr>

          <tr><td class="gs-rownum">3</td><td>Luis</td><td>Sur</td></tr>

    <h2>3. Fórmula / pasos</h2>

  <!-- GSE5: Ejercicio 1.4 - Control de filtros -->
  <div class="sub-sec" id="sub-gse5">
    <h2>1. Enunciado</h2>
    <p>"Añade un control de filtros a un gráfico que muestre ventas por categoría."</p>
    <div class="callout info"><span class="callout-icon">💡</span><p>Ejercicio <strong>1.4</strong> del bloque <strong>Tablas dinámicas y filtros</strong> (lección 1), el último de este bloque.</p></div>

    <h2>2. Dataset usado</h2>
    <p>Un gráfico de columnas creado directamente sobre las columnas "Categoría" (C) y "Ventas" (H) de la tabla "Tienda", fila a fila (sin agregación previa):</p>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Hoja "Tienda" — columnas usadas en el gráfico</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">C</th><th class="gs-colhead">H</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Categoría</td><td>Ventas</td></tr>
          <tr><td class="gs-rownum">2</td><td>Periféricos</td><td>100</td></tr>
          <tr><td class="gs-rownum">3</td><td>Pantallas</td><td>300</td></tr>
          <tr><td class="gs-rownum">4</td><td>Periféricos</td><td>120</td></tr>
        </tbody>
      </table>
    </div>

    <h2>3. Fórmula / pasos</h2>
    <ol>
      <li>Selecciona el gráfico ya creado (o créalo primero con <code>Insertar → Gráfico</code> sobre Categoría y Ventas).</li>
      <li><code>Datos → Añadir un control de filtros</code>.</li>
      <li>Repite el proceso para añadir un segundo control, esta vez sobre la columna "Ventas".</li>
    </ol>

    <h2>4. Por qué funciona</h2>
    <p>El control de filtros es un elemento visual independiente, pensado específicamente para filtrar un gráfico o tabla dinámica concreta sin tocar la tabla de datos original. Aquí se añadieron dos controles ("Ventas" y "Categoría"), cada uno mostrando el desplegable "Todos" — es decir, listos para que cualquiera que vea el panel pueda restringir qué categorías o qué rango de ventas se representan en el gráfico, sin necesidad de editar la hoja de datos.</p>
    <div class="callout tip"><span class="callout-icon">✅</span><p>Un control de filtros solo puede filtrar por una columna a la vez — por eso aquí hacen falta dos controles distintos (uno por columna), en vez de uno solo que filtre por ambas.</p></div>

    <h2>5. Resultado</h2>
    <p>El gráfico muestra 10 barras (una por cada fila de la tabla, sin agrupar), alternando "Periféricos" y "Pantallas" según el orden de las filas originales, con valores que van de 96 a 300 — coincidiendo exactamente con la columna "Ventas" fila a fila. Los dos controles de filtros ("Ventas" y "Categoría") aparecen como mandos independientes a la derecha del gráfico, ambos en su estado por defecto "Todos", listos para usarse.</p>
    <div class="callout warn"><span class="callout-icon">📌</span><p>A diferencia de los ejercicios 1.1 y 1.2 (que usaban una tabla dinámica con datos agregados), este gráfico representa los datos en bruto: cada barra es una fila de la tabla, no un total por categoría. Eso es correcto para este ejercicio, ya que lo que pedía era añadir el control de filtros, no agregar los datos.</p></div>
