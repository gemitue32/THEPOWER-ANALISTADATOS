<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data & Analytics — Guía Personal</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS ─────────────────────────────── */
:root {
  --ink:     #0f1117;
  --ink2:    #3a3f52;
  --ink3:    #8891a8;
  --paper:   #fafbfd;
  --white:   #ffffff;
  --border:  #e8eaf2;
  --border2: #d2d6e8;
  --green:   #00b37e;
  --green-d: #007a55;
  --green-t: #e6f7f1;
  --green-b: #b3e8d8;
  --blue:    #3b6bff;
  --blue-t:  #eef1ff;
  --amber:   #e07b00;
  --amber-t: #fff4e0;
  --code-bg: #f3f4f8;
  --sb-w:    268px;
  --radius:  12px;
}

/* ─── RESET ──────────────────────────────── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--paper);
  color: var(--ink);
  display: flex;
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.75;
}

/* ─── SIDEBAR ────────────────────────────── */
#sidebar {
  width: var(--sb-w);
  background: var(--white);
  border-right: 1px solid var(--border);
  position: fixed;
  inset: 0 auto 0 0;
  display: flex;
  flex-direction: column;
  z-index: 200;
  overflow: hidden;
}

/* logo strip */
.sb-brand {
  padding: 22px 20px 18px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sb-course {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink3);
  margin-bottom: 4px;
}
.sb-title {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 18px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.2;
}
.sb-title em { font-style: italic; color: var(--green); }

/* search */
.sb-search {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sb-search-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 11px;
}
.sb-search-wrap svg { flex-shrink: 0; color: var(--ink3); }
.sb-search-wrap input {
  flex: 1;
  border: none;
  background: transparent;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  color: var(--ink);
  outline: none;
}
.sb-search-wrap input::placeholder { color: var(--ink3); }

/* nav scroll area */
.sb-nav {
  flex: 1;
  overflow-y: auto;
  padding: 10px 10px 24px;
}
.sb-nav::-webkit-scrollbar { width: 3px; }
.sb-nav::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* module group */
.mod-wrap { margin-bottom: 2px; }

.mod-btn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 10px;
  border-radius: 9px;
  border: none;
  background: transparent;
  cursor: pointer;
  text-align: left;
  transition: background .13s;
}
.mod-btn:hover { background: var(--paper); }
.mod-btn.open  { background: var(--paper); }

.mod-pip {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 1px;
}
.mod-name {
  flex: 1;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink2);
  line-height: 1.3;
}
.mod-badge {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--ink3);
  background: var(--border);
  padding: 2px 6px;
  border-radius: 4px;
}
.mod-chevron {
  font-size: 9px;
  color: var(--ink3);
  transition: transform .2s;
  flex-shrink: 0;
}
.mod-btn.open .mod-chevron { transform: rotate(90deg); }

/* lesson list */
.lesson-list {
  max-height: 0;
  overflow: hidden;
  transition: max-height .28s ease;
}
.lesson-list.open { max-height: 800px; }

.lesson-btn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px 6px 22px;
  border-radius: 8px;
  border: none;
  background: transparent;
  cursor: pointer;
  text-align: left;
  transition: background .12s;
  margin-bottom: 1px;
}
.lesson-btn:hover:not(.locked) { background: var(--green-t); }
.lesson-btn.active {
  background: var(--green-t);
}
.lesson-btn.locked { opacity: .38; cursor: default; }

.l-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--border2);
  flex-shrink: 0;
}
.lesson-btn.active .l-dot { background: var(--green); }

.l-text {
  flex: 1;
  font-size: 12.5px;
  color: var(--ink2);
  line-height: 1.35;
}
.lesson-btn.active .l-text { color: var(--green-d); font-weight: 500; }
.l-lock { font-size: 11px; color: var(--ink3); margin-left: auto; }

/* module color palette */
.pip-1  { background: #00b37e; } .pip-2  { background: #3b6bff; }
.pip-3  { background: #8b5cf6; } .pip-4  { background: #0891b2; }
.pip-5  { background: #e07b00; } .pip-6  { background: #e11d48; }
.pip-7  { background: #0369a1; } .pip-8  { background: #7c3aed; }
.pip-9  { background: #be185d; } .pip-10 { background: #047857; }
.pip-14 { background: #7e22ce; } .pip-15 { background: #c2410c; }
.pip-16 { background: #0f766e; }

/* ─── MAIN ────────────────────────────────── */
#main {
  margin-left: var(--sb-w);
  flex: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* topbar */
#topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(250,251,253,.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  padding: 0 40px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  color: var(--ink3);
}
.breadcrumb .sep { color: var(--border2); }
.breadcrumb .bc-mod { color: var(--green-d); font-weight: 500; }
.breadcrumb .bc-cur { color: var(--ink); }
.tb-tag {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  background: var(--green-t);
  color: var(--green-d);
  border: 1px solid var(--green-b);
  padding: 3px 10px;
  border-radius: 20px;
}

/* content area */
#content {
  flex: 1;
  padding: 48px 56px 80px;
  max-width: 900px;
}
#content { animation: rise .25s ease both; }
@keyframes rise {
  from { opacity:0; transform:translateY(10px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ─── TOPIC HEADER ───────────────────────── */
.topic-header {
  margin-bottom: 36px;
  padding-bottom: 28px;
  border-bottom: 1px solid var(--border);
}
.th-eyebrow {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--green);
  margin-bottom: 10px;
}
.th-title {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 34px;
  font-weight: 600;
  line-height: 1.15;
  color: var(--ink);
  margin-bottom: 10px;
}
.th-title em { font-style: italic; color: var(--green); font-weight: 300; }
.th-desc {
  font-size: 15px;
  color: var(--ink3);
  max-width: 580px;
  line-height: 1.65;
}

/* ─── SUBTAB NAV ─────────────────────────── */
.subtab-nav {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-bottom: 32px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 5px;
  width: fit-content;
}
.stab {
  font-family: 'DM Sans', sans-serif;
  font-size: 12.5px;
  font-weight: 400;
  padding: 7px 14px;
  border-radius: 7px;
  border: none;
  background: transparent;
  color: var(--ink3);
  cursor: pointer;
  transition: all .14s;
  white-space: nowrap;
}
.stab:hover { background: var(--paper); color: var(--ink2); }
.stab.active {
  background: var(--green);
  color: #fff;
  font-weight: 500;
  box-shadow: 0 2px 8px rgba(0,179,126,.3);
}

/* ─── SUB-SECTIONS ───────────────────────── */
.sub-sec { display: none; animation: rise .18s ease both; }
.sub-sec.on { display: block; }

/* ─── TYPOGRAPHY ─────────────────────────── */
h2 {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 20px;
  font-weight: 600;
  color: var(--ink);
  margin: 36px 0 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}
h2::before {
  content: '';
  width: 3px; height: 20px;
  background: var(--green);
  border-radius: 2px;
  flex-shrink: 0;
}
h3 {
  font-size: 14.5px;
  font-weight: 600;
  color: var(--ink);
  margin: 24px 0 8px;
  display: flex;
  align-items: center;
  gap: 7px;
}
h3::before {
  content: '';
  width: 14px; height: 2px;
  background: var(--border2);
  border-radius: 1px;
}
p { color: var(--ink2); margin-bottom: 12px; }
p strong { color: var(--ink); }
ul, ol { padding-left: 18px; margin-bottom: 14px; }
li { color: var(--ink2); margin-bottom: 5px; }
li strong { color: var(--ink); }

/* ─── CODE ───────────────────────────────── */
pre {
  background: var(--ink);
  border-radius: 12px;
  padding: 22px 24px;
  margin: 14px 0 22px;
  overflow-x: auto;
  position: relative;
}
pre .lt {
  position: absolute;
  top: 10px; right: 16px;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: #4a5568;
  text-transform: uppercase;
  letter-spacing: .1em;
}
code {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  line-height: 1.9;
  color: #e2e8f0;
}
.kw { color: #f97583; }
.fn { color: #b392f0; }
.str { color: #9ecbff; }
.num { color: #79b8ff; }
.cm { color: #586069; font-style: italic; }
.var { color: #ffab70; }
.builtin { color: #85e89d; }

p > code, li > code {
  font-family: 'DM Mono', monospace;
  font-size: 12.5px;
  background: var(--code-bg);
  color: #8250df;
  padding: 2px 6px;
  border-radius: 5px;
  border: 1px solid var(--border);
}

/* ─── CALLOUTS ───────────────────────────── */
.callout {
  display: flex;
  gap: 12px;
  padding: 14px 16px;
  border-radius: 10px;
  margin: 18px 0;
  border-left: 3px solid;
  align-items: flex-start;
}
.callout.tip   { background: var(--green-t); border-color: var(--green); }
.callout.info  { background: var(--blue-t);  border-color: var(--blue); }
.callout.warn  { background: var(--amber-t); border-color: var(--amber); }
.callout-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.callout p { margin: 0; font-size: 13.5px; }
.callout.tip  p { color: var(--green-d); }
.callout.info p { color: #1e3a8a; }
.callout.warn p { color: #92400e; }

/* ─── CODE OUTPUT ────────────────────────── */
.code-out {
  background: #1e2030;
  border-radius: 0 0 9px 9px;
  margin: -14px 0 18px;
  padding: 12px 16px;
  font-family: 'DM Mono', monospace;
  font-size: 12.5px;
  color: #a6e3a1;
  white-space: pre;
  overflow-x: auto;
  border-top: 2px solid #313450;
}
.code-out::before {
  content: '▶ Output';
  display: block;
  color: #6c7086;
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-bottom: 7px;
}

/* ─── DATAFRAME OUTPUT ───────────────────── */
.df-out {
  margin: -14px 0 18px;
  border-radius: 0 0 9px 9px;
  overflow-x: auto;
  border: 1px solid #313450;
  border-top: 2px solid #313450;
  background: #1e2030;
}
.df-out::before {
  content: '▶ Output';
  display: block;
  color: #6c7086;
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 8px 14px 4px;
  font-family: 'DM Mono', monospace;
}
.df-out table {
  border-collapse: collapse;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  width: auto;
  min-width: 100%;
  border: none;
  border-radius: 0;
  background: #1e2030;
  color: #cdd6f4;
  margin: 0;
}
.df-out thead tr { background: #181825; }
.df-out th {
  color: #89b4fa;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .04em;
  text-transform: none;
  padding: 7px 16px;
  border-bottom: 1px solid #313450;
  text-align: right;
  white-space: nowrap;
}
.df-out th:first-child { text-align: left; color: #6c7086; }
.df-out td {
  padding: 6px 16px;
  border-bottom: 1px solid #252638;
  font-size: 12px;
  text-align: right;
  white-space: nowrap;
  color: #cdd6f4;
}
.df-out td:first-child { color: #6c7086; text-align: left; font-style: italic; }
.df-out tr:last-child td { border-bottom: none; }
@media (max-width: 768px) {
  .df-out { font-size: 11px !important; }
  .df-out th, .df-out td { padding: 5px 10px !important; font-size: 11px !important; }
}

/* ─── MOCK GOOGLE SHEETS (ejemplo visual de hoja de cálculo) ───────────────────── */
.gs-sheet-wrap { margin: 16px 0 22px; overflow-x: auto; border-radius: 10px; border: 1px solid var(--border2); box-shadow: 0 1px 3px rgba(15,17,23,.06); }
.gs-sheet { border-collapse: collapse; font-size: 12.5px; background: #fff; min-width: 100%; }
.gs-sheet th, .gs-sheet td { border: 1px solid #e1e3e8; padding: 6px 12px; white-space: nowrap; }
.gs-sheet .gs-colhead { background: #f8f9fa; color: #5f6368; font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; text-align: center; min-width: 70px; }
.gs-sheet .gs-rownum { background: #f8f9fa; color: #5f6368; font-family: 'DM Mono', monospace; font-size: 11px; text-align: center; width: 28px; }
.gs-sheet td:not(.gs-rownum) { color: var(--ink2); text-align: left; }
.gs-sheet thead .gs-rownum { background: #f8f9fa; }
.gs-sheet tbody tr:first-child td:not(.gs-rownum) { font-weight: 600; color: var(--ink); background: #f8f9fa; }
.gs-sheet .hl-green  { background: #b7e1cd !important; }
.gs-sheet .hl-red    { background: #f4c7c3 !important; }
.gs-sheet .hl-yellow { background: #fce8b2 !important; }
.gs-sheet .hl-blue   { background: #c9daf8 !important; }
.gs-sheet .hl-scale-1 { background: #d9ead3 !important; }
.gs-sheet .hl-scale-2 { background: #b6d7a8 !important; }
.gs-sheet .hl-scale-3 { background: #93c47d !important; color:#fff !important; }
.gs-sheet .hl-scale-4 { background: #38761d !important; color:#fff !important; }
.gs-sheet-caption { font-family: 'DM Mono', monospace; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink3); padding: 7px 12px; border-bottom: 1px solid var(--border); background: var(--paper); }
@media (max-width: 768px) {
  .gs-sheet { font-size: 11px; }
  .gs-sheet th, .gs-sheet td { padding: 5px 8px !important; }
}


.table-wrap { overflow-x: auto; margin: 14px 0 22px; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border);
}
thead tr { background: var(--ink); }
th {
  color: #e2e8f0;
  font-family: 'DM Mono', monospace;
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: .07em;
  text-transform: uppercase;
  padding: 10px 14px;
  text-align: left;
}
td {
  padding: 9px 14px;
  color: var(--ink2);
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
tr:last-child td { border-bottom: none; }
tbody tr:nth-child(even) td { background: var(--paper); }
tbody tr:hover td { background: var(--green-t); }
td code {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: #8250df;
  background: var(--code-bg);
  padding: 1px 5px;
  border-radius: 4px;
}

/* ─── HOME PAGE ──────────────────────────── */
.home-hero {
  margin-bottom: 44px;
}
.home-hero-eyebrow {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--green);
  margin-bottom: 12px;
}
.home-hero-title {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 42px;
  font-weight: 600;
  line-height: 1.1;
  color: var(--ink);
  margin-bottom: 14px;
}
.home-hero-title em { font-style: italic; color: var(--green); font-weight: 300; }
.home-hero-desc { font-size: 16px; color: var(--ink3); max-width: 520px; line-height: 1.65; }

.home-section-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink3);
  margin: 36px 0 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.home-section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.mod-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: 12px; }

.mod-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  cursor: pointer;
  transition: all .18s;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
  overflow: hidden;
}
.mod-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--card-color, var(--border));
  border-radius: 2px 2px 0 0;
}
.mod-card:hover { border-color: var(--card-color, var(--border2)); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.07); }
.mod-card.locked { opacity: .42; cursor: default; }
.mod-card.locked:hover { transform: none; box-shadow: none; border-color: var(--border); }

.mc-num {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--ink3);
}
.mc-title { font-size: 14px; font-weight: 500; color: var(--ink); line-height: 1.3; }
.mc-sub { font-size: 12px; color: var(--ink3); line-height: 1.45; }
.mc-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 4px;
}
.mc-badge {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  background: var(--green-t);
  color: var(--green-d);
  border: 1px solid var(--green-b);
  padding: 2px 8px;
  border-radius: 10px;
}
.mc-lock { font-size: 12px; color: var(--ink3); }

/* ─── COMING SOON ────────────────────────── */
.coming-box {
  border: 2px dashed var(--border2);
  border-radius: var(--radius);
  padding: 48px;
  text-align: center;
  color: var(--ink3);
}
.coming-box .cb-icon { font-size: 36px; margin-bottom: 14px; }
.coming-box h3 { font-size: 17px; font-weight: 500; color: var(--ink2); margin-bottom: 8px; }
.coming-box h3::before { display: none; }
.coming-box p { font-size: 14px; margin: 0; }

/* ─── SCROLLBAR ──────────────────────────── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* ── RESPONSIVE MÓVIL ── */
#menu-toggle {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 1000;
  width: 42px;
  height: 42px;
  border-radius: 10px;
  border: none;
  background: var(--green);
  color: #fff;
  font-size: 22px;
  cursor: pointer;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 10px rgba(0,179,126,.4);
}
#sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 998;
}
@media (max-width: 768px) {
  /* ── Botón y sidebar ── */
  #menu-toggle { display: flex !important; }
  #sidebar {
    left: calc(-1 * var(--sb-w) - 10px) !important;
    transition: left .25s ease;
    box-shadow: 4px 0 24px rgba(0,0,0,.18);

    <h2>Entorno: VSCode + Jupyter Notebook</h2>
    <p>Para trabajar con Python necesitas instalar dos extensiones en VSCode:</p>
    <ul>
      <li><strong>Python</strong> (Microsoft) — ejecuta código Python en el editor.</li>
      <li><strong>Jupyter Notebook</strong> (Microsoft) — archivos <code>.ipynb</code> interactivos con resultados inmediatos.</li>
    </ul>
    <div class="callout info"><span class="callout-icon">⌨️</span><p><code>Ctrl + Enter</code> ejecuta la celda actual · <code>Shift + Enter</code> ejecuta y avanza a la siguiente.</p></div>

    <h2>¿Qué es una variable?</h2>
    <p>Una <strong>caja donde almacenamos un valor</strong>. La sintaxis es siempre <code>nombre = valor</code>:</p>
    <pre><span class="lt">python</span><code><span class="cm"># Definimos una variable numérica</span>
<span class="var">variable_numerica</span> = <span class="num">3</span>
</code></pre>

    <h2>Sobreescribir una variable</h2>
    <p>Si usas el mismo nombre dos veces, el segundo valor <strong>reemplaza</strong> al primero:</p>
    <pre><span class="lt">python</span><code><span class="var">numero_1</span> = <span class="num">100</span>
<span class="var">numero_1</span> = <span class="num">200</span>  <span class="cm"># ahora numero_1 vale 200</span>
</code></pre>
    <div class="callout warn"><span class="callout-icon">⚠️</span><p>Cuidado con los nombres repetidos: el valor final es siempre el último asignado.</p></div>

    <h2>Palabras reservadas</h2>
    <p>Python tiene palabras que <strong>no puedes usar como nombre de variable</strong> porque pertenecen al lenguaje. Tu editor las resaltará en un color diferente:</p>
    <pre><span class="lt">reservadas</span><code><span class="kw">int</span>  <span class="kw">float</span>  <span class="kw">str</span>  <span class="kw">bool</span>  <span class="builtin">True</span>  <span class="builtin">False</span>  <span class="builtin">None</span>
<span class="kw">if</span>  <span class="kw">elif</span>  <span class="kw">else</span>  <span class="kw">for</span>  <span class="kw">while</span>  <span class="kw">def</span>  <span class="kw">return</span>  <span class="kw">class</span></code></pre>
  </div>

  <!-- S2 Tipos y funciones -->
  <div class="sub-sec" id="sub-s2">
    <h2>Tipos de datos</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Tipo</th><th>Palabra clave</th><th>Descripción</th><th>Ejemplo</th></tr></thead>
      <tbody>
        <tr><td>Entero</td><td><code>int</code></td><td>Sin parte decimal</td><td><code>-6, 0, 42</code></td></tr>
        <tr><td>Decimal</td><td><code>float</code></td><td>Con parte decimal</td><td><code>2.8, .2, 3.14</code></td></tr>
        <tr><td>Complejo</td><td><code>complex</code></td><td>Parte real + imaginaria</td><td><code>2+3j</code></td></tr>
        <tr><td>Texto</td><td><code>str</code></td><td>Cadena de caracteres</td><td><code>"Hola"</code></td></tr>
        <tr><td>Booleano</td><td><code>bool</code></td><td>Verdadero o falso</td><td><code>True / False</code></td></tr>
        <tr><td>Nulo</td><td><code>NoneType</code></td><td>Sin valor asignado</td><td><code>None</code></td></tr>
      </tbody>
    </table></div>
    <div class="callout warn"><span class="callout-icon">📌</span><p><code>None</code> no es lo mismo que <code>0</code>, ni que <code>False</code>, ni que <code>""</code>. Son valores completamente distintos.</p></div>

    <h2>Funciones incorporadas</h2>
    <h3>print()</h3>
    <pre><span class="lt">python</span><code><span class="var">nombre</span> = <span class="str">"Ana"</span>
<span class="fn">print</span>(<span class="str">f"Hola, me llamo {<span class="var">nombre</span>}"</span>)  <span class="cm"># f-string (recomendado)</span>
<span class="fn">print</span>(<span class="str">"Tengo"</span>, <span class="num">25</span>, <span class="str">"años"</span>)           <span class="cm"># separando con comas</span>
</code></pre>
    <h3>type()</h3>
    <pre><span class="lt">python</span><code><span class="fn">print</span>(<span class="fn">type</span>(<span class="str">"Hola"</span>))  <span class="cm"># &lt;class 'str'&gt;</span>
<span class="fn">print</span>(<span class="fn">type</span>(<span class="num">3</span>))       <span class="cm"># &lt;class 'int'&gt;</span>
</code></pre>
    <h3>len()</h3>
    <pre><span class="lt">python</span><code><span class="fn">print</span>(<span class="fn">len</span>(<span class="str">"Hola"</span>))  <span class="cm"># 4   ← no funciona con números</span>
</code></pre>
    <h3>input()</h3>
    <pre><span class="lt">python</span><code><span class="var">valor</span> = <span class="fn">input</span>(<span class="str">"Tu nombre: "</span>)  <span class="cm"># siempre devuelve str</span>
<span class="fn">print</span>(<span class="fn">type</span>(<span class="var">valor</span>))               <span class="cm"># &lt;class 'str'&gt;</span>
</code></pre>
    <div class="callout info"><span class="callout-icon">💡</span><p>Si necesitas que el usuario introduzca un número: <code>int(input("Edad: "))</code></p></div>
  </div>

  <!-- S3 Operadores -->
  <div class="sub-sec" id="sub-s3">
    <h2>Operadores aritméticos</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Op.</th><th>Nombre</th><th>Ejemplo</th><th>Resultado</th></tr></thead>
      <tbody>
        <tr><td><code>+</code></td><td>Suma</td><td><code>5 + 3</code></td><td><code>8</code></td></tr>
        <tr><td><code>-</code></td><td>Resta</td><td><code>5 - 3</code></td><td><code>2</code></td></tr>
        <tr><td><code>*</code></td><td>Multiplicación</td><td><code>5 * 3</code></td><td><code>15</code></td></tr>
        <tr><td><code>/</code></td><td>División</td><td><code>5 / 3</code></td><td><code>1.666…</code></td></tr>
        <tr><td><code>//</code></td><td>División entera</td><td><code>5 // 3</code></td><td><code>1</code></td></tr>
        <tr><td><code>%</code></td><td>Módulo (resto)</td><td><code>5 % 3</code></td><td><code>2</code></td></tr>
        <tr><td><code>**</code></td><td>Potencia</td><td><code>5 ** 3</code></td><td><code>125</code></td></tr>
      </tbody>
    </table></div>
    <div class="callout info"><span class="callout-icon">💡</span><p><code>+</code> también concatena strings: <code>"Hola, " + "Ana"</code> → <code>"Hola, Ana"</code></p></div>

    <h2>Operadores de comparación</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Op.</th><th>Significado</th><th>Ejemplo</th><th>Resultado</th></tr></thead>
      <tbody>
        <tr><td><code>==</code></td><td>Igual a</td><td><code>10 == 7</code></td><td><code>False</code></td></tr>
        <tr><td><code>!=</code></td><td>Distinto de</td><td><code>10 != 7</code></td><td><code>True</code></td></tr>
        <tr><td><code>&gt;</code></td><td>Mayor que</td><td><code>10 &gt; 7</code></td><td><code>True</code></td></tr>
        <tr><td><code>&lt;</code></td><td>Menor que</td><td><code>10 &lt; 7</code></td><td><code>False</code></td></tr>
        <tr><td><code>&gt;=</code></td><td>Mayor o igual</td><td><code>10 &gt;= 10</code></td><td><code>True</code></td></tr>
        <tr><td><code>&lt;=</code></td><td>Menor o igual</td><td><code>10 &lt;= 7</code></td><td><code>False</code></td></tr>
      </tbody>
    </table></div>

    <h2>Operadores lógicos</h2>
    <pre><span class="lt">python</span><code><span class="var">edad</span> = <span class="num">20</span>; <span class="var">tiene_licencia</span> = <span class="builtin">False</span>; <span class="var">es_estudiante</span> = <span class="builtin">True</span>

<span class="cm"># and: las DOS condiciones deben ser True</span>
<span class="fn">print</span>((<span class="var">edad</span> > <span class="num">18</span>) <span class="kw">and</span> <span class="var">tiene_licencia</span>)  <span class="cm"># False</span>

<span class="cm"># or: basta con que UNA sea True</span>
<span class="fn">print</span>((<span class="var">edad</span> < <span class="num">25</span>) <span class="kw">or</span> <span class="var">es_estudiante</span>)   <span class="cm"># True</span>
</code></pre>

    <h2>Asignación combinada y conversión</h2>
    <pre><span class="lt">python</span><code><span class="var">x</span> = <span class="num">10</span>
<span class="var">x</span> += <span class="num">5</span>   <span class="cm"># x = x + 5  → 15</span>
<span class="var">x</span> -= <span class="num">3</span>   <span class="cm"># x = x - 3  → 12</span>
<span class="var">x</span> *= <span class="num">2</span>   <span class="cm"># x = x * 2  → 24</span>

<span class="cm"># Conversión de tipos</span>
<span class="fn">int</span>(<span class="str">"5"</span>)      <span class="cm"># → 5</span>
<span class="fn">float</span>(<span class="str">"3.14"</span>)  <span class="cm"># → 3.14</span>
<span class="fn">str</span>(<span class="num">10</span>)        <span class="cm"># → "10"</span>
<span class="fn">bool</span>(<span class="num">0</span>)        <span class="cm"># → False  (0 y "" son False; lo demás True)</span>
</code></pre>
  </div>

  <!-- S4 Indexación -->
  <div class="sub-sec" id="sub-s4">
    <h2>¿Qué es la indexación?</h2>
    <p>Los strings son <strong>iterables</strong>: cada carácter tiene un índice único. El índice positivo empieza en <code>0</code> (izquierda→derecha) y el negativo en <code>-1</code> (derecha→izquierda).</p>
    <pre><span class="lt">python</span><code><span class="var">s</span> = <span class="str">"Me encanta la programación"</span>
<span class="fn">print</span>(<span class="var">s</span>[<span class="num">0</span>])   <span class="cm"># M  (primer carácter)</span>
<span class="fn">print</span>(<span class="var">s</span>[-<span class="num">1</span>])  <span class="cm"># n  (último carácter)</span>
</code></pre>

    <div class="table-wrap"><table>
      <thead><tr><th>Carácter</th><th>P</th><th>y</th><th>t</th><th>h</th><th>o</th><th>n</th></tr></thead>
      <tbody>
        <tr><td>Índice positivo</td><td><code>0</code></td><td><code>1</code></td><td><code>2</code></td><td><code>3</code></td><td><code>4</code></td><td><code>5</code></td></tr>
        <tr><td>Índice negativo</td><td><code>-6</code></td><td><code>-5</code></td><td><code>-4</code></td><td><code>-3</code></td><td><code>-2</code></td><td><code>-1</code></td></tr>
      </tbody>
    </table></div>

    <h2>Slicing — cadena[start : stop : step]</h2>
    <ul>
      <li><strong>start</strong>: índice de inicio (inclusive).</li>
      <li><strong>stop</strong>: índice de fin (no se incluye en el resultado).</li>
      <li><strong>step</strong>: salto entre caracteres.</li>
    </ul>
    <pre><span class="lt">python</span><code><span class="var">t</span> = <span class="str">"Python"</span>

<span class="fn">print</span>(<span class="var">t</span>[<span class="num">0</span>:<span class="num">4</span>])    <span class="cm"># 'Pyth'    del 0 al 3</span>
<span class="fn">print</span>(<span class="var">t</span>[:<span class="num">3</span>])     <span class="cm"># 'Pyt'     inicio → índice 2</span>
<span class="fn">print</span>(<span class="var">t</span>[<span class="num">3</span>:])     <span class="cm"># 'hon'     índice 3 → final</span>
<span class="fn">print</span>(<span class="var">t</span>[<span class="num">0</span>:<span class="num">6</span>:<span class="num">2</span>])  <span class="cm"># 'Pto'     salto de 2</span>
<span class="fn">print</span>(<span class="var">t</span>[::-<span class="num">1</span>])  <span class="cm"># 'nohtyP'  invertida</span>
</code></pre>
    <div class="callout tip"><span class="callout-icon">✅</span><p><code>[::-1]</code> es la forma más rápida de invertir un string. El step negativo recorre de derecha a izquierda.</p></div>
  </div>

  <!-- S5 Métodos string -->
  <div class="sub-sec" id="sub-s5">
    <h2>Sintaxis general</h2>
    <pre><span class="lt">python</span><code><span class="var">cadena</span>.<span class="fn">metodo</span>(argumentos)</code></pre>
    <p>Los strings son <strong>inmutables</strong>: los métodos no modifican el original, devuelven una <strong>nueva cadena</strong>.</p>

    <h2>Mayúsculas y minúsculas</h2>
    <pre><span class="lt">python</span><code><span class="fn">print</span>(<span class="str">"PYTHON"</span>.<span class="fn">lower</span>())               <span class="cm"># 'python'</span>
<span class="fn">print</span>(<span class="str">"python"</span>.<span class="fn">upper</span>())               <span class="cm"># 'PYTHON'</span>
<span class="fn">print</span>(<span class="str">"bienvenidos a python"</span>.<span class="fn">title</span>())   <span class="cm"># 'Bienvenidos A Python'</span>
<span class="fn">print</span>(<span class="str">"python ES GENIAL"</span>.<span class="fn">capitalize</span>()) <span class="cm"># 'Python es genial'</span>
</code></pre>

    <h2>Métodos de búsqueda y transformación</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Método</th><th>Qué hace</th><th>Si no encuentra</th></tr></thead>
      <tbody>
        <tr><td><code>strip()</code></td><td>Elimina espacios del inicio y fin</td><td>—</td></tr>
        <tr><td><code>replace(old, new)</code></td><td>Reemplaza todas las ocurrencias de <em>old</em> por <em>new</em></td><td>—</td></tr>
        <tr><td><code>find(sub)</code></td><td>Índice de la primera aparición de <em>sub</em></td><td>Devuelve <code>-1</code></td></tr>
        <tr><td><code>index(sub)</code></td><td>Índice de la primera aparición de <em>sub</em></td><td>Lanza <code>ValueError</code></td></tr>
        <tr><td><code>join(lista)</code></td><td>Une los elementos de una lista usando el string como separador</td><td>—</td></tr>
      </tbody>
    </table></div>

    <pre><span class="lt">python</span><code><span class="fn">print</span>(<span class="str">"  Hola  "</span>.<span class="fn">strip</span>())                       <span class="cm"># 'Hola'</span>
<span class="fn">print</span>(<span class="str">"Hola Mundo"</span>.<span class="fn">replace</span>(<span class="str">"Mundo"</span>, <span class="str">"Python"</span>))  <span class="cm"># 'Hola Python'</span>
<span class="fn">print</span>(<span class="str">"Hola Mundo"</span>.<span class="fn">find</span>(<span class="str">"Mundo"</span>))              <span class="cm"># 5</span>
<span class="fn">print</span>(<span class="str">"Hola Mundo"</span>.<span class="fn">find</span>(<span class="str">"Python"</span>))             <span class="cm"># -1</span>
<span class="fn">print</span>(<span class="str">" "</span>.<span class="fn">join</span>([<span class="str">"Python"</span>, <span class="str">"es"</span>, <span class="str">"genial"</span>]))    <span class="cm"># 'Python es genial'</span>
</code></pre>
    <div class="callout info"><span class="callout-icon">💡</span><p>Diferencia clave: <code>find()</code> devuelve <code>-1</code> sin error si no encuentra el substring · <code>index()</code> lanza un <code>ValueError</code>.</p></div>
  </div>

  <!-- S6: Listas -->
  <div class="sub-sec" id="sub-s6">
    <h2>¿Qué es una lista?</h2>
    <p>Una <strong>lista</strong> es una estructura de datos que permite almacenar <strong>múltiples elementos dentro de una sola variable</strong>. Los elementos pueden ser de distintos tipos (números, strings, booleanos, incluso otras listas) y se pueden modificar después de crearla — las listas son <strong>mutables</strong>.</p>

    <h2>Crear una lista</h2>
    <pre><span class="lt">python</span><code><span class="cm"># Con corchetes [] separando elementos con comas</span>
<span class="var">mi_lista</span> = [<span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span>, <span class="str">"Python"</span>, <span class="builtin">True</span>]
<span class="fn">print</span>(<span class="var">mi_lista</span>)  <span class="cm"># [1, 2, 3, 'Python', True]</span>

<span class="cm"># Lista vacía (para añadir elementos después)</span>
<span class="var">lista_vacia</span> = []

<span class="cm"># Longitud con len()</span>
<span class="fn">print</span>(<span class="fn">len</span>(<span class="var">mi_lista</span>))  <span class="cm"># 5</span>

<span class="cm"># Convertir un string en lista de caracteres</span>
<span class="var">lista</span> = <span class="fn">list</span>(<span class="str">"Python"</span>)
<span class="fn">print</span>(<span class="var">lista</span>)  <span class="cm"># ['P', 'y', 't', 'h', 'o', 'n']</span></code></pre>

    <h2>Indexación — acceder a elementos</h2>
    <p>Igual que en los strings, los índices empiezan en <code>0</code>. También funcionan los índices negativos:</p>
    <pre><span class="lt">python</span><code><span class="var">mi_lista</span> = [<span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span>, <span class="str">"Python"</span>, <span class="builtin">True</span>]

<span class="fn">print</span>(<span class="var">mi_lista</span>[<span class="num">0</span>])   <span class="cm"># 1       (primero)</span>
<span class="fn">print</span>(<span class="var">mi_lista</span>[<span class="num">3</span>])   <span class="cm"># 'Python'</span>
<span class="fn">print</span>(<span class="var">mi_lista</span>[-<span class="num">1</span>])  <span class="cm"># True    (último)</span></code></pre>

    <h2>Slicing — sublistas con rango [start:stop:step]</h2>
    <pre><span class="lt">python</span><code><span class="var">mi_lista</span> = [<span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span>, <span class="num">4</span>, <span class="num">5</span>, <span class="num">6</span>]

<span class="fn">print</span>(<span class="var">mi_lista</span>[<span class="num">1</span>:<span class="num">4</span>])   <span class="cm"># [2, 3, 4]   del índice 1 al 3</span>
<span class="fn">print</span>(<span class="var">mi_lista</span>[:<span class="num">4</span>])    <span class="cm"># [1, 2, 3, 4] desde el inicio</span>
<span class="fn">print</span>(<span class="var">mi_lista</span>[<span class="num">2</span>:])    <span class="cm"># [3, 4, 5, 6] hasta el final</span>
<span class="fn">print</span>(<span class="var">mi_lista</span>[-<span class="num">3</span>:])   <span class="cm"># [4, 5, 6]   últimos 3 elementos</span></code></pre>

    <h2>Listas anidadas</h2>
    <p>Una lista puede contener otras listas. Para acceder a elementos de una lista anidada, encadenas índices:</p>
    <pre><span class="lt">python</span><code><span class="var">anidada</span> = [<span class="num">1</span>, [<span class="num">2</span>, <span class="num">3</span>], [<span class="num">4</span>, [<span class="num">5</span>, <span class="num">6</span>]]]

<span class="fn">print</span>(<span class="var">anidada</span>[<span class="num">1</span>])          <span class="cm"># [2, 3]</span>
<span class="fn">print</span>(<span class="var">anidada</span>[<span class="num">1</span>][<span class="num">0</span>])       <span class="cm"># 2</span>
<span class="fn">print</span>(<span class="var">anidada</span>[<span class="num">2</span>][<span class="num">1</span>][<span class="num">0</span>])    <span class="cm"># 5  (dentro de la lista más profunda)</span></code></pre>

    <div class="callout tip">
      <span class="callout-icon">✅</span>
      <p>Las listas son <strong>mutables</strong> (se pueden modificar) al contrario que los strings. Puedes cambiar un elemento directamente: <code>mi_lista[0] = 99</code>.</p>
    </div>
  </div>

  <!-- S7: Métodos de listas -->
  <div class="sub-sec" id="sub-s7">
    <h2>Métodos generales</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Método</th><th>Qué hace</th><th>Modifica la original</th></tr></thead>
      <tbody>
        <tr><td><code>len(lista)</code></td><td>Devuelve el número de elementos</td><td>❌</td></tr>
        <tr><td><code>max(lista)</code></td><td>Devuelve el valor máximo</td><td>❌</td></tr>
        <tr><td><code>min(lista)</code></td><td>Devuelve el valor mínimo</td><td>❌</td></tr>
        <tr><td><code>sorted(lista)</code></td><td>Devuelve una <strong>nueva</strong> lista ordenada</td><td>❌</td></tr>
        <tr><td><code>lista.sort()</code></td><td>Ordena la lista en su lugar</td><td>✅</td></tr>
        <tr><td><code>lista.copy()</code></td><td>Devuelve una copia superficial</td><td>❌</td></tr>
        <tr><td><code>lista.count(x)</code></td><td>Cuenta las veces que aparece <code>x</code></td><td>❌</td></tr>
        <tr><td><code>lista.reverse()</code></td><td>Invierte el orden de los elementos</td><td>✅</td></tr>
      </tbody>
    </table></div>

    <pre><span class="lt">python</span><code><span class="var">mi_lista</span> = [<span class="num">3</span>, <span class="num">1</span>, <span class="num">4</span>, <span class="num">2</span>]

<span class="fn">print</span>(<span class="fn">len</span>(<span class="var">mi_lista</span>))         <span class="cm"># 4</span>
<span class="fn">print</span>(<span class="fn">max</span>(<span class="var">mi_lista</span>))         <span class="cm"># 4</span>
<span class="fn">print</span>(<span class="fn">min</span>(<span class="var">mi_lista</span>))         <span class="cm"># 1</span>
<span class="fn">print</span>(<span class="fn">sorted</span>(<span class="var">mi_lista</span>))      <span class="cm"># [1, 2, 3, 4] — original intacta</span>
<span class="fn">print</span>(<span class="var">mi_lista</span>)              <span class="cm"># [3, 1, 4, 2] — sigue igual</span>

<span class="var">mi_lista</span>.<span class="fn">sort</span>()
<span class="fn">print</span>(<span class="var">mi_lista</span>)              <span class="cm"># [1, 2, 3, 4] — original modificada</span>

<span class="var">mi_lista</span>.<span class="fn">reverse</span>()
<span class="fn">print</span>(<span class="var">mi_lista</span>)              <span class="cm"># [4, 3, 2, 1]</span>

<span class="var">lista2</span> = [<span class="num">1</span>, <span class="num">2</span>, <span class="num">2</span>, <span class="num">3</span>]
<span class="fn">print</span>(<span class="var">lista2</span>.<span class="fn">count</span>(<span class="num">2</span>))       <span class="cm"># 2 (aparece dos veces)</span></code></pre>

    <div class="callout warn">
      <span class="callout-icon">⚠️</span>
      <p>Diferencia clave entre <code>sorted()</code> y <code>.sort()</code>: <code>sorted()</code> crea una nueva lista (la original no cambia), mientras que <code>.sort()</code> modifica la lista original directamente.</p>
    </div>

    <h2>Métodos de adición</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Método</th><th>Qué hace</th><th>Ejemplo</th><th>Resultado</th></tr></thead>
      <tbody>
        <tr><td><code>append(x)</code></td><td>Añade <code>x</code> al <strong>final</strong></td><td><code>[1,2].append(3)</code></td><td><code>[1, 2, 3]</code></td></tr>
        <tr><td><code>extend([x,y])</code></td><td>Añade todos los elementos de otra lista al final</td><td><code>[1,2].extend([3,4])</code></td><td><code>[1, 2, 3, 4]</code></td></tr>
        <tr><td><code>insert(i, x)</code></td><td>Inserta <code>x</code> en la posición <code>i</code></td><td><code>[1,3,4].insert(1, 2)</code></td><td><code>[1, 2, 3, 4]</code></td></tr>
      </tbody>
    </table></div>

    <pre><span class="lt">python</span><code><span class="var">lista</span> = [<span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span>]

<span class="var">lista</span>.<span class="fn">append</span>(<span class="num">4</span>)
<span class="fn">print</span>(<span class="var">lista</span>)          <span class="cm"># [1, 2, 3, 4]</span>

<span class="var">lista</span>.<span class="fn">extend</span>([<span class="num">5</span>, <span class="num">6</span>])
<span class="fn">print</span>(<span class="var">lista</span>)          <span class="cm"># [1, 2, 3, 4, 5, 6]</span>

<span class="var">lista</span>.<span class="fn">insert</span>(<span class="num">0</span>, <span class="num">0</span>)    <span class="cm"># inserta 0 en la posición 0</span>
<span class="fn">print</span>(<span class="var">lista</span>)          <span class="cm"># [0, 1, 2, 3, 4, 5, 6]</span></code></pre>

    <div class="callout info">
      <span class="callout-icon">💡</span>
      <p>Diferencia entre <code>append()</code> y <code>extend()</code>: <code>append([3,4])</code> añade la lista como un único elemento → <code>[1, 2, [3, 4]]</code>; <code>extend([3,4])</code> desempaqueta y añade cada elemento por separado → <code>[1, 2, 3, 4]</code>.</p>
    </div>

    <h2>Métodos de eliminación</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Método</th><th>Qué elimina</th><th>Devuelve</th><th>Error si no existe</th></tr></thead>
      <tbody>
        <tr><td><code>pop()</code></td><td>El último elemento (o el de índice i con <code>pop(i)</code>)</td><td>✅ El elemento eliminado</td><td>❌ No</td></tr>
        <tr><td><code>remove(x)</code></td><td>La primera aparición de <code>x</code></td><td>❌ No devuelve nada</td><td>✅ Sí, ValueError</td></tr>
        <tr><td><code>clear()</code></td><td>Todos los elementos</td><td>❌ No</td><td>❌ No</td></tr>
      </tbody>
    </table></div>

    <pre><span class="lt">python</span><code><span class="var">lista</span> = [<span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span>, <span class="num">2</span>]

<span class="cm"># pop() — elimina el último y lo devuelve</span>
<span class="var">ultimo</span> = <span class="var">lista</span>.<span class="fn">pop</span>()
<span class="fn">print</span>(<span class="var">ultimo</span>)  <span class="cm"># 2</span>
<span class="fn">print</span>(<span class="var">lista</span>)   <span class="cm"># [1, 2, 3]</span>

<span class="cm"># remove() — elimina la primera aparición del valor</span>
<span class="var">lista</span>.<span class="fn">remove</span>(<span class="num">2</span>)
<span class="fn">print</span>(<span class="var">lista</span>)   <span class="cm"># [1, 3]</span>

<span class="cm"># clear() — vacía la lista</span>
<span class="var">lista</span>.<span class="fn">clear</span>()
<span class="fn">print</span>(<span class="var">lista</span>)   <span class="cm"># []</span></code></pre>
  </div>

  <!-- S8: Tuplas -->
  <div class="sub-sec" id="sub-s8">
    <h2>¿Qué es una tupla?</h2>
    <p>Una <strong>tupla</strong> es una estructura de datos que almacena una secuencia de elementos de cualquier tipo, igual que las listas. La gran diferencia es que las tuplas son <strong>inmutables</strong>: una vez creadas, no se pueden modificar sus elementos. Esto las hace ideales cuando queremos asegurarnos de que unos datos no cambien a lo largo del programa.</p>

    <h2>Definir una tupla</h2>
    <p>Se define usando paréntesis <code>()</code> y separando los elementos con comas:</p>
    <pre><span class="lt">python</span><code><span class="var">mi_tupla</span> = (<span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span>, <span class="num">4</span>)</code></pre>

    <h2>Tupla de un solo elemento</h2>
    <p>Para definir una tupla con un único elemento hay que añadir una <strong>coma</strong> después del valor; si no, Python lo trata como un valor normal y no como una tupla.</p>
    <pre><span class="lt">python</span><code><span class="var">tupla_un_elemento</span> = (<span class="num">5</span>,)</code></pre>
    <div class="callout warn"><span class="callout-icon">⚠️</span><p><code>(5)</code> es simplemente el número <code>5</code>. <code>(5,)</code> es una tupla con un elemento. La coma es la que marca la diferencia.</p></div>

    <h2>Indexación en tuplas</h2>
    <p>Igual que en las listas, accedemos a los elementos mediante <strong>índices</strong>: el índice positivo empieza en <code>0</code> y también se admite la indexación negativa.</p>
    <pre><span class="lt">python</span><code><span class="var">mi_tupla</span> = (<span class="num">10</span>, <span class="num">20</span>, <span class="num">30</span>, <span class="num">40</span>)

<span class="cm"># Acceso al primer elemento</span>
<span class="fn">print</span>(<span class="var">mi_tupla</span>[<span class="num">0</span>])   <span class="cm"># Salida: 10</span>

<span class="cm"># Acceso al último elemento</span>
<span class="fn">print</span>(<span class="var">mi_tupla</span>[-<span class="num">1</span>])  <span class="cm"># Salida: 40</span></code></pre>

    <h2>Modificación de tuplas</h2>
    <p>Las tuplas son inmutables, así que no se puede modificar, añadir ni eliminar elementos individuales una vez creadas. Sin embargo, podemos <strong>convertir la tupla en lista</strong>, modificarla, y volver a convertirla en tupla si necesitamos cambiar su contenido:</p>
    <pre><span class="lt">python</span><code><span class="var">mi_tupla</span> = (<span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span>, <span class="num">4</span>)

<span class="cm"># Convertir la tupla en lista</span>
<span class="var">lista</span> = <span class="fn">list</span>(<span class="var">mi_tupla</span>)

<span class="cm"># Modificar la lista</span>
<span class="var">lista</span>.<span class="fn">append</span>(<span class="num">5</span>)

<span class="cm"># Convertir de nuevo en tupla</span>
<span class="var">mi_tupla</span> = <span class="fn">tuple</span>(<span class="var">lista</span>)

<span class="fn">print</span>(<span class="var">mi_tupla</span>)  <span class="cm"># Salida: (1, 2, 3, 4, 5)</span></code></pre>

    <div class="callout tip">
      <span class="callout-icon">✅</span>
      <p>Las tuplas son útiles cuando necesitamos una estructura <strong>inmutable</strong> que no pueda modificarse tras su creación. Aunque no permiten cambios directos, siempre podemos hacer cambios indirectos: tupla → lista → modificar → tupla otra vez.</p>
    </div>
  </div>

  <!-- S9: Métodos de tuplas -->
  <div class="sub-sec" id="sub-s9">
    <h2>Métodos de tuplas</h2>
    <p>Aunque las tuplas son inmutables, tienen algunos métodos que nos permiten <strong>obtener información</strong> sobre su contenido sin modificarlas.</p>

    <h3>1️⃣ index()</h3>
    <p>Encuentra la posición del primer elemento con un valor específico. Si el elemento no existe, genera un error.</p>
    <pre><span class="lt">python</span><code><span class="var">mi_tupla</span> = (<span class="num">10</span>, <span class="num">20</span>, <span class="num">30</span>, <span class="num">40</span>)
<span class="fn">print</span>(<span class="var">mi_tupla</span>.<span class="fn">index</span>(<span class="num">30</span>))  <span class="cm"># Salida: 2</span></code></pre>

    <h3>2️⃣ count()</h3>
    <p>Devuelve el número de veces que un valor específico aparece en la tupla.</p>
    <pre><span class="lt">python</span><code><span class="var">mi_tupla</span> = (<span class="num">10</span>, <span class="num">20</span>, <span class="num">20</span>, <span class="num">30</span>, <span class="num">20</span>)
<span class="fn">print</span>(<span class="var">mi_tupla</span>.<span class="fn">count</span>(<span class="num">20</span>))  <span class="cm"># Salida: 3</span></code></pre>

    <h3>3️⃣ min() y 4️⃣ max()</h3>
    <p>Devuelven el valor mínimo y máximo de los elementos de la tupla.</p>
    <pre><span class="lt">python</span><code><span class="var">mi_tupla</span> = (<span class="num">10</span>, <span class="num">20</span>, <span class="num">30</span>, <span class="num">40</span>)
<span class="fn">print</span>(<span class="fn">min</span>(<span class="var">mi_tupla</span>))  <span class="cm"># Salida: 10</span>
<span class="fn">print</span>(<span class="fn">max</span>(<span class="var">mi_tupla</span>))  <span class="cm"># Salida: 40</span></code></pre>

    <h3>5️⃣ len()</h3>
    <p>Devuelve el número de elementos presentes en la tupla.</p>
    <pre><span class="lt">python</span><code><span class="var">mi_tupla</span> = (<span class="num">10</span>, <span class="num">20</span>, <span class="num">30</span>)
<span class="fn">print</span>(<span class="fn">len</span>(<span class="var">mi_tupla</span>))  <span class="cm"># Salida: 3</span></code></pre>

    <h3>6️⃣ type()</h3>
    <p>Devuelve el tipo de dato de un objeto; en este caso, una tupla.</p>
    <pre><span class="lt">python</span><code><span class="var">mi_tupla</span> = (<span class="num">10</span>, <span class="num">20</span>, <span class="num">30</span>)
<span class="fn">print</span>(<span class="fn">type</span>(<span class="var">mi_tupla</span>))  <span class="cm"># Salida: &lt;class 'tuple'&gt;</span></code></pre>

    <div class="callout info">
      <span class="callout-icon">💡</span>
      <p>Aunque las tuplas no se pueden modificar, podemos obtener mucha información sobre ellas con estos métodos, trabajando con ellas de forma eficiente sin alterar su estructura.</p>
    </div>
  </div>

  <!-- S10: Diccionarios -->
  <div class="sub-sec" id="sub-s10">
    <h2>¿Qué es un diccionario?</h2>
    <p>Un <strong>diccionario</strong> es una estructura de datos que almacena pares de <strong>clave-valor</strong>. A diferencia de las listas y las tuplas, que guardan elementos en un orden específico accesible por índice, los diccionarios son estructuras <strong>no ordenadas</strong> y se accede a ellos por sus claves.</p>
    <p>Las claves deben ser <strong>únicas</strong> y de un tipo inmutable (strings, números, tuplas...); los valores, en cambio, pueden ser de cualquier tipo.</p>

    <h2>Creación de diccionarios</h2>
    <p>Podemos crear un diccionario usando llaves <code>{}</code> o la función <code>dict()</code>:</p>
    <pre><span class="lt">python</span><code><span class="cm"># Ejemplo creación con llaves</span>
<span class="var">mi_diccionario</span> = {
    <span class="str">"nombre"</span>: <span class="str">"Juan"</span>,
    <span class="str">"edad"</span>: <span class="num">25</span>,
    <span class="str">"ciudad"</span>: <span class="str">"Madrid"</span>}

<span class="cm"># Ejemplo usando dict()</span>
<span class="var">mi_diccionario</span> = <span class="fn">dict</span>(<span class="var">nombre</span>=<span class="str">"Juan"</span>, <span class="var">edad</span>=<span class="num">25</span>, <span class="var">ciudad</span>=<span class="str">"Madrid"</span>)</code></pre>

    <h2>Indexación en diccionarios</h2>
    <p>En lugar de índices numéricos como en listas o tuplas, en los diccionarios accedemos a los valores a través de sus <strong>claves</strong>:</p>
    <pre><span class="lt">python</span><code><span class="var">mi_diccionario</span> = <span class="fn">dict</span>(<span class="var">nombre</span>=<span class="str">"Juan"</span>, <span class="var">edad</span>=<span class="num">25</span>, <span class="var">ciudad</span>=<span class="str">"Madrid"</span>)
<span class="fn">print</span>(<span class="var">mi_diccionario</span>[<span class="str">"nombre"</span>])  <span class="cm"># Salida: Juan</span></code></pre>

    <div class="callout warn">
      <span class="callout-icon">⚠️</span>
      <p>Si intentamos acceder a una clave que no existe, Python genera un error <code>KeyError</code>. Para evitarlo, usa el método <code>get()</code>, que devuelve <code>None</code> si la clave no está presente.</p>
    </div>
    <pre><span class="lt">python</span><code><span class="var">mi_diccionario</span> = <span class="fn">dict</span>(<span class="var">nombre</span>=<span class="str">"Juan"</span>, <span class="var">edad</span>=<span class="num">25</span>, <span class="var">ciudad</span>=<span class="str">"Madrid"</span>)
<span class="fn">print</span>(<span class="var">mi_diccionario</span>.<span class="fn">get</span>(<span class="str">"apellido"</span>))  <span class="cm"># Salida: None</span></code></pre>

    <h2>Modificar valores</h2>
    <p>Podemos actualizar el valor asociado a una clave simplemente asignando un nuevo valor a esa clave:</p>
    <pre><span class="lt">python</span><code><span class="var">mi_diccionario</span> = <span class="fn">dict</span>(<span class="var">nombre</span>=<span class="str">"Juan"</span>, <span class="var">edad</span>=<span class="num">25</span>, <span class="var">ciudad</span>=<span class="str">"Madrid"</span>)
<span class="var">mi_diccionario</span>[<span class="str">"edad"</span>] = <span class="num">30</span>
<span class="fn">print</span>(<span class="var">mi_diccionario</span>)  <span class="cm"># Salida: {'nombre': 'Juan', 'edad': 30, 'ciudad': 'Madrid'}</span></code></pre>

    <h2>Añadir nuevos pares clave-valor</h2>
    <p>Se añaden de la misma manera que al modificar uno existente; si la clave no existe, Python la crea:</p>
    <pre><span class="lt">python</span><code><span class="var">mi_diccionario</span>[<span class="str">"profesión"</span>] = <span class="str">"Ingeniero"</span>
<span class="fn">print</span>(<span class="var">mi_diccionario</span>)  <span class="cm"># {'nombre': 'Juan', 'edad': 30, 'ciudad': 'Madrid', 'profesión': 'Ingeniero'}</span></code></pre>

    <div class="callout tip">
      <span class="callout-icon">✅</span>
      <p>Los diccionarios nos permiten indexar datos no por posición, sino por claves: muy útil cuando necesitamos asociar valores a identificadores únicos.</p>
    </div>
  </div>

  <!-- S11: Métodos de diccionarios -->
  <div class="sub-sec" id="sub-s11">
    <h2>Métodos de diccionarios</h2>
    <p>Los diccionarios cuentan con varios métodos incorporados que facilitan su manipulación.</p>

    <h3>1️⃣ keys()</h3>
    <p>Devuelve todas las <strong>claves</strong> del diccionario.</p>
    <pre><span class="lt">python</span><code><span class="var">mi_diccionario</span> = {<span class="str">"nombre"</span>: <span class="str">"Juan"</span>, <span class="str">"edad"</span>: <span class="num">25</span>, <span class="str">"ciudad"</span>: <span class="str">"Madrid"</span>}
<span class="var">claves</span> = <span class="var">mi_diccionario</span>.<span class="fn">keys</span>()
<span class="fn">print</span>(<span class="var">claves</span>)  <span class="cm"># Salida: dict_keys(['nombre', 'edad', 'ciudad'])</span></code></pre>

    <h3>2️⃣ values()</h3>
    <p>Devuelve todos los <strong>valores</strong> del diccionario.</p>
    <pre><span class="lt">python</span><code><span class="var">valores</span> = <span class="var">mi_diccionario</span>.<span class="fn">values</span>()
<span class="fn">print</span>(<span class="var">valores</span>)  <span class="cm"># Salida: dict_values(['Juan', 25, 'Madrid'])</span></code></pre>

    <h3>3️⃣ items()</h3>
    <p>Devuelve todos los pares <strong>clave-valor</strong> como tuplas.</p>
    <pre><span class="lt">python</span><code><span class="var">elementos</span> = <span class="var">mi_diccionario</span>.<span class="fn">items</span>()
<span class="fn">print</span>(<span class="var">elementos</span>)  <span class="cm"># dict_items([('nombre', 'Juan'), ('edad', 25), ('ciudad', 'Madrid')])</span></code></pre>

    <h3>4️⃣ get()</h3>
    <p>Obtiene el valor de una clave. Si no existe, devuelve <code>None</code> o un valor por defecto que indiquemos.</p>
    <pre><span class="lt">python</span><code><span class="fn">print</span>(<span class="var">mi_diccionario</span>.<span class="fn">get</span>(<span class="str">"nombre"</span>))  <span class="cm"># Salida: Juan</span>
<span class="fn">print</span>(<span class="var">mi_diccionario</span>.<span class="fn">get</span>(<span class="str">"apellido"</span>, <span class="str">"No especificado"</span>))  <span class="cm"># Salida: No especificado</span></code></pre>

    <h3>5️⃣ update()</h3>
    <p>Actualiza el diccionario con pares clave-valor de otro diccionario; si la clave ya existe, se sobrescribe su valor.</p>
    <pre><span class="lt">python</span><code><span class="var">mi_diccionario</span>.<span class="fn">update</span>({<span class="str">"edad"</span>: <span class="num">30</span>, <span class="str">"profesión"</span>: <span class="str">"Ingeniero"</span>})
<span class="fn">print</span>(<span class="var">mi_diccionario</span>)  <span class="cm"># {'nombre': 'Juan', 'edad': 30, 'ciudad': 'Madrid', 'profesión': 'Ingeniero'}</span></code></pre>

    <h3>6️⃣ setdefault()</h3>
    <p>Devuelve el valor de una clave si existe; si no, la inserta con un valor por defecto y lo devuelve.</p>
    <pre><span class="lt">python</span><code><span class="var">mi_diccionario</span>.<span class="fn">setdefault</span>(<span class="str">"apellido"</span>, <span class="str">"No especificado"</span>)
<span class="fn">print</span>(<span class="var">mi_diccionario</span>)  <span class="cm"># {..., 'apellido': 'No especificado'}</span></code></pre>

    <h3>7️⃣ pop() y popitem()</h3>
    <div class="table-wrap"><table>
      <thead><tr><th>Método</th><th>Qué hace</th><th>Error si no existe</th></tr></thead>
      <tbody>
        <tr><td><code>pop(clave)</code></td><td>Elimina un par clave-valor y devuelve su valor</td><td>✅ Sí, <code>KeyError</code></td></tr>
        <tr><td><code>popitem()</code></td><td>Elimina y devuelve el último par insertado, como tupla</td><td>✅ Sí, si está vacío</td></tr>
      </tbody>
    </table></div>
    <pre><span class="lt">python</span><code><span class="var">valor_eliminado</span> = <span class="var">mi_diccionario</span>.<span class="fn">pop</span>(<span class="str">"profesión"</span>)
<span class="fn">print</span>(<span class="var">valor_eliminado</span>)  <span class="cm"># Salida: Ingeniero</span>

<span class="var">ultimo_elemento</span> = <span class="var">mi_diccionario</span>.<span class="fn">popitem</span>()
<span class="fn">print</span>(<span class="var">ultimo_elemento</span>)  <span class="cm"># Salida: ('apellido', 'No especificado')</span></code></pre>

    <h3>8️⃣ copy()</h3>
    <p>Devuelve una copia superficial del diccionario.</p>
    <pre><span class="lt">python</span><code><span class="var">copia_diccionario</span> = <span class="var">mi_diccionario</span>.<span class="fn">copy</span>()
<span class="fn">print</span>(<span class="var">copia_diccionario</span>)</code></pre>

    <h3>9️⃣ clear()</h3>
    <p>Elimina todos los elementos, dejando el diccionario vacío.</p>
    <pre><span class="lt">python</span><code><span class="var">mi_diccionario</span>.<span class="fn">clear</span>()
<span class="fn">print</span>(<span class="var">mi_diccionario</span>)  <span class="cm"># Salida: {}</span></code></pre>

    <div class="callout info">
      <span class="callout-icon">💡</span>
      <p>Estos métodos nos permiten acceder, actualizar, eliminar y copiar elementos de forma rápida, mejorando la flexibilidad al trabajar con grandes cantidades de información estructurada.</p>
    </div>
  </div>

  <!-- S12: Sets -->
  <div class="sub-sec" id="sub-s12">
    <h2>¿Qué es un set?</h2>
    <p>Un <strong>conjunto o set</strong> es una colección <strong>desordenada</strong> de elementos <strong>únicos</strong> y <strong>mutable</strong>. Se usan principalmente para operaciones matemáticas: unión, intersección, diferencia y diferencia simétrica entre conjuntos.</p>

    <h2>Características principales</h2>
    <ul>
      <li><strong>Colección no ordenada:</strong> los elementos no tienen un orden específico, por lo que no se puede acceder a ellos mediante índices.</li>
      <li><strong>Elementos únicos:</strong> no se pueden tener elementos duplicados en un set.</li>
      <li><strong>Mutable:</strong> se pueden agregar o eliminar elementos del conjunto.</li>
      <li><strong>Métodos matemáticos integrados:</strong> unión, intersección, diferencia y diferencia simétrica.</li>
      <li><strong>No admite elementos mutables:</strong> un set no puede contener listas, sets o diccionarios como elementos, ya que estos podrían cambiar y afectar a la integridad del set.</li>
    </ul>

    <h2>Definir un set</h2>
    <p>Hay dos formas principales:</p>
    <pre><span class="lt">python</span><code><span class="cm"># Definimos una nueva variable de tipo set, usando llaves {}</span>
<span class="var">set_nombres</span> = {<span class="str">"Ana"</span>, <span class="str">"Belén"</span>, <span class="str">"Catalina"</span>, <span class="str">"David"</span>, <span class="str">"Elena"</span>, <span class="str">"Francisco"</span>}

<span class="fn">print</span>(<span class="str">f"Nuestro conjunto de nombres es: {<span class="var">set_nombres</span>}"</span>)
<span class="fn">print</span>(<span class="str">f'El tipo de nuestro conjunto es: '</span>, <span class="fn">type</span>(<span class="var">set_nombres</span>))
<span class="cm"># Output esperado:</span>
<span class="cm"># Nuestro conjunto de nombres es: {'Belén', 'Catalina', 'Ana', 'Elena', 'David', 'Francisco'}</span>
<span class="cm"># El tipo de nuestro conjunto es: &lt;class 'set'&gt;</span></code></pre>

    <pre><span class="lt">python</span><code><span class="cm"># Definimos una variable tipo tupla</span>
<span class="var">tupla_nombres</span> = (<span class="str">"Ana"</span>, <span class="str">"Belén"</span>, <span class="str">"Catalina"</span>, <span class="str">"David"</span>, <span class="str">"Elena"</span>, <span class="str">"Francisco"</span>)

<span class="cm"># Usamos la función set() para convertir tupla_nombres en un conjunto</span>
<span class="var">set_nombres2</span> = <span class="fn">set</span>(<span class="var">tupla_nombres</span>)

<span class="fn">print</span>(<span class="str">f"Nuestro conjunto de nombres es: {<span class="var">set_nombres2</span>}"</span>)
<span class="fn">print</span>(<span class="str">f"El tipo de nuestro conjunto es: {<span class="fn">type</span>(<span class="var">set_nombres2</span>)}"</span>)
<span class="cm"># Output esperado:</span>
<span class="cm"># Nuestro conjunto de nombres es: {'Francisco', 'Ana', 'Catalina', 'David', 'Belén', 'Elena'}</span>
<span class="cm"># El tipo de nuestro conjunto es: &lt;class 'set'&gt;</span></code></pre>

    <div class="callout tip">
      <span class="callout-icon">✅</span>
      <p>Los sets son colecciones desordenadas de elementos únicos: no permiten duplicados. Son ideales para operaciones matemáticas como uniones, intersecciones y diferencias entre conjuntos.</p>
    </div>
  </div>

  <!-- S13: Métodos de sets -->
  <div class="sub-sec" id="sub-s13">
    <h2>Métodos generales</h2>
    <p>Los sets vienen con métodos incorporados que permiten realizar operaciones sobre ellos de forma eficiente. Usaremos este conjunto base en los ejemplos:</p>
    <pre><span class="lt">python</span><code><span class="var">set_nombres</span> = {<span class="str">"Ana"</span>, <span class="str">"Belén"</span>, <span class="str">"Catalina"</span>, <span class="str">"David"</span>, <span class="str">"Elena"</span>, <span class="str">"Francisco"</span>}</code></pre>

    <h3>1️⃣ len()</h3>
    <p>Obtiene la cantidad de elementos que hay en el conjunto.</p>
    <pre><span class="lt">python</span><code><span class="fn">print</span>(<span class="str">f"La longitud de nuestro set es: {<span class="fn">len</span>(<span class="var">set_nombres</span>)}"</span>)
<span class="cm"># Output esperado: La longitud de nuestro set es: 6</span></code></pre>

    <h3>2️⃣ copy()</h3>
    <p>Crea una copia del conjunto existente.</p>
    <pre><span class="lt">python</span><code><span class="var">set_nombres_copia</span> = <span class="var">set_nombres</span>.<span class="fn">copy</span>()
<span class="fn">print</span>(<span class="str">f"Nuestro conjunto de nombres copiado es: {<span class="var">set_nombres_copia</span>}"</span>)</code></pre>

    <h3>3️⃣ add()</h3>
    <p>Agrega un único elemento al conjunto.</p>
    <pre><span class="lt">python</span><code><span class="var">set_nombres</span>.<span class="fn">add</span>(<span class="str">"Victor"</span>)
<span class="fn">print</span>(<span class="str">f"Nuestro conjunto de nombres ahora es: {<span class="var">set_nombres</span>}"</span>)
<span class="cm"># Nuestro conjunto de nombres ahora es: {'Victor', 'Catalina', 'David', 'Francisco', 'Ana', 'Belén', 'Elena'}</span></code></pre>

    <h3>4️⃣ update()</h3>
    <p>Agrega <strong>varios</strong> elementos a la vez, pasados como lista.</p>
    <pre><span class="lt">python</span><code><span class="var">set_nombres</span>.<span class="fn">update</span>([<span class="str">"Victor"</span>, <span class="str">"Marta"</span>, <span class="str">"Julia"</span>])
<span class="fn">print</span>(<span class="str">f"Nuestro conjunto de nombres ahora es: {<span class="var">set_nombres</span>}"</span>)</code></pre>

    <h3>5️⃣ pop()</h3>
    <p>Elimina un elemento <strong>aleatorio</strong> del conjunto y devuelve el elemento eliminado.</p>
    <pre><span class="lt">python</span><code><span class="var">elemento_eliminado</span> = <span class="var">set_nombres</span>.<span class="fn">pop</span>()
<span class="fn">print</span>(<span class="str">f'El elemento eliminado es: '</span>, <span class="var">elemento_eliminado</span>)
<span class="cm"># El elemento eliminado es: Ana (puede variar, es aleatorio)</span></code></pre>

    <h3>6️⃣ remove() vs 7️⃣ discard()</h3>
    <p>Ambos eliminan un elemento específico (uno a la vez), pero se comportan distinto si el elemento no existe:</p>
    <div class="table-wrap"><table>
      <thead><tr><th>Método</th><th>Si el elemento no existe</th></tr></thead>
      <tbody>
        <tr><td><code>remove(x)</code></td><td>❌ Lanza error <code>KeyError</code></td></tr>
        <tr><td><code>discard(x)</code></td><td>✅ No lanza error, simplemente no hace nada</td></tr>
      </tbody>
    </table></div>
    <pre><span class="lt">python</span><code><span class="cm"># remove() con un elemento que no existe, como "Victor"</span>
<span class="var">set_nombres</span>.<span class="fn">remove</span>(<span class="str">"Victor"</span>)
<span class="cm"># Output esperado: KeyError: 'Victor'</span>

<span class="cm"># discard() con un elemento que no existe — no da error</span>
<span class="var">set_nombres</span>.<span class="fn">discard</span>(<span class="str">"Victor"</span>)
<span class="fn">print</span>(<span class="str">f"Nuestro conjunto de nombres ahora es: {<span class="var">set_nombres</span>}"</span>)</code></pre>

    <h3>8️⃣ clear()</h3>
    <p>Elimina todos los elementos del conjunto.</p>
    <pre><span class="lt">python</span><code><span class="var">set_nombres</span>.<span class="fn">clear</span>()
<span class="fn">print</span>(<span class="str">f"Nuestro conjunto de nombres ahora es: {<span class="var">set_nombres</span>}"</span>)
<span class="cm"># Output esperado: Nuestro conjunto de nombres ahora es: set()</span></code></pre>

    <h2>Operaciones entre conjuntos</h2>
    <p>Estas son las operaciones matemáticas más comunes entre dos sets. Usaremos estos dos conjuntos de ejemplo:</p>
    <pre><span class="lt">python</span><code><span class="var">set_numeros1</span> = {-<span class="num">1</span>, -<span class="num">2</span>, -<span class="num">3</span>, -<span class="num">4</span>, <span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span>, <span class="num">4</span>}
<span class="var">set_numeros2</span> = {<span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span>, <span class="num">4</span>}</code></pre>

    <h3>union()</h3>
    <p>Devuelve un conjunto con todos los elementos no repetidos de ambos.</p>
    <pre><span class="lt">python</span><code><span class="var">set_union</span> = <span class="var">set_numeros1</span>.<span class="fn">union</span>(<span class="var">set_numeros2</span>)
<span class="fn">print</span>(<span class="str">f"Nuestros set unidos son: {<span class="var">set_union</span>}"</span>)
<span class="cm"># Nuestros set unidos son: {1, 2, 3, 4, -1, -4, -3, -2}</span></code></pre>

    <h3>intersection()</h3>
    <p>Devuelve los elementos comunes a ambos conjuntos.</p>
    <pre><span class="lt">python</span><code><span class="var">set_interseccion</span> = <span class="var">set_numeros1</span>.<span class="fn">intersection</span>(<span class="var">set_numeros2</span>)
<span class="fn">print</span>(<span class="str">f"La intersección es: {<span class="var">set_interseccion</span>}"</span>)
<span class="cm"># La intersección es: {1, 2, 3, 4}</span></code></pre>

    <h3>difference()</h3>
    <p>Devuelve los elementos que hay en un conjunto pero no en el otro. <strong>El orden importa.</strong></p>
    <pre><span class="lt">python</span><code><span class="var">set_difference1</span> = <span class="var">set_numeros1</span>.<span class="fn">difference</span>(<span class="var">set_numeros2</span>)
<span class="fn">print</span>(<span class="str">f"Los elementos que hay en set_numeros1 y no en set_numeros2 son: {<span class="var">set_difference1</span>}"</span>)
<span class="cm"># Los elementos que hay en set_numeros1 y no en set_numeros2 son: {-4, -3, -1, -2}</span>

<span class="cm"># Ahora buscamos la diferencia en el otro sentido. Cambiamos el orden:</span>
<span class="var">set_difference2</span> = <span class="var">set_numeros2</span>.<span class="fn">difference</span>(<span class="var">set_numeros1</span>)
<span class="fn">print</span>(<span class="str">f"Los elementos que hay en set_numeros2 y no en set_numeros1 son: {<span class="var">set_difference2</span>}"</span>)
<span class="cm"># Los elementos que hay en set_numeros2 y no en set_numeros1 son: set()</span></code></pre>

    <h3>symmetric_difference()</h3>
    <p>Devuelve los elementos que son únicos en cada uno de los conjuntos (no presentes en el otro). Aquí el orden ya <strong>no</strong> importa.</p>
    <pre><span class="lt">python</span><code><span class="var">set_diferencia_simetrica</span> = <span class="var">set_numeros1</span>.<span class="fn">symmetric_difference</span>(<span class="var">set_numeros2</span>)
<span class="fn">print</span>(<span class="str">f"Los elementos únicos de ambos conjuntos son: {<span class="var">set_diferencia_simetrica</span>}"</span>)
<span class="cm"># Los elementos únicos de ambos conjuntos son: {-4, -3, -1, -2}</span></code></pre>

    <h3>isdisjoint()</h3>
    <p>Comprueba si dos conjuntos son <strong>disjuntos</strong> (no tienen elementos en común). Devuelve <code>True</code> si no comparten ningún elemento, <code>False</code> en caso contrario.</p>
    <pre><span class="lt">python</span><code><span class="var">set_disjoint</span> = <span class="var">set_numeros1</span>.<span class="fn">isdisjoint</span>(<span class="var">set_numeros2</span>)
<span class="fn">print</span>(<span class="var">set_disjoint</span>)
<span class="cm"># False — comparten los elementos 1, 2, 3 y 4</span></code></pre>

    <h3>issubset() y issuperset()</h3>
    <p><code>issubset()</code> comprueba si todos los elementos de un set están contenidos en otro. <code>issuperset()</code> es la operación inversa: comprueba si un set contiene a todos los elementos de otro.</p>
    <pre><span class="lt">python</span><code><span class="cm"># ¿Están todos los elementos de set_numeros1 en set_numeros2?</span>
<span class="var">set_subset1</span> = <span class="var">set_numeros1</span>.<span class="fn">issubset</span>(<span class="var">set_numeros2</span>)
<span class="fn">print</span>(<span class="str">f"Todos elementos de set_numeros1 están contenidos en set_numeros2: {<span class="var">set_subset1</span>}"</span>)
<span class="cm"># Todos elementos de set_numeros1 están contenidos en set_numeros2: False</span>

<span class="cm"># ¿Están todos los elementos de set_numeros2 en set_numeros1?</span>
<span class="var">set_subset2</span> = <span class="var">set_numeros2</span>.<span class="fn">issubset</span>(<span class="var">set_numeros1</span>)
<span class="fn">print</span>(<span class="str">f"Todos elementos de set_numeros2 están contenidos en set_numeros1: {<span class="var">set_subset2</span>}"</span>)
<span class="cm"># Todos elementos de set_numeros2 están contenidos en set_numeros1: True</span>

<span class="cm"># issuperset() es la inversa de issubset()</span>
<span class="fn">print</span>(<span class="var">set_numeros1</span>.<span class="fn">issuperset</span>(<span class="var">set_numeros2</span>))  <span class="cm"># True (numeros1 "contiene" a numeros2)</span></code></pre>

    <div class="callout info">
      <span class="callout-icon">💡</span>
      <p>Con <code>union()</code> combinamos conjuntos; con <code>intersection()</code> obtenemos lo común; con <code>difference()</code> lo exclusivo de uno. Son operaciones muy útiles para comparar o combinar grandes cantidades de datos, aprovechando que los elementos de un set son siempre únicos.</p>
    </div>
  </div>

  <!-- S14: Condicionales y control de flujo -->
  <div class="sub-sec" id="sub-s14">
    <h2>¿Qué es el control de flujo?</h2>
    <p>El <strong>control de flujo</strong> se refiere al orden en que se ejecutan las instrucciones de un programa. Determina qué instrucciones se ejecutan y en qué orden, permitiéndonos controlar los posibles caminos del código.</p>

    <h2>Estructura if</h2>
    <p><code>if</code> es la estructura de control de flujo más básica: se utiliza para tomar decisiones basadas en una condición.</p>
    <div class="callout warn"><span class="callout-icon">📌</span><p>IMPORTANTE: acordarse de poner los dos puntos <code>:</code> y a continuación hacer una indentación o sangría.</p></div>
    <ul>
      <li>Si la condición se evalúa como <code>True</code>, se ejecuta el código indentado que sigue a la sentencia <code>if</code>.</li>
      <li>Si la condición se evalúa como <code>False</code>, ese código se salta y el programa continúa con la siguiente línea al mismo nivel de indentación.</li>
    </ul>
    <pre><span class="lt">python</span><code><span class="cm"># Primera condición: 5 es mayor que 2</span>
<span class="kw">if</span> <span class="num">5</span> > <span class="num">2</span>:
    <span class="fn">print</span>(<span class="str">"La condición se cumple"</span>)

<span class="cm"># Una condición que NO se cumple. 5 es menor que 2:</span>
<span class="kw">if</span> <span class="num">5</span> < <span class="num">2</span>:
    <span class="fn">print</span>(<span class="str">"La condición se cumple otra vez"</span>)
<span class="cm"># Output esperado: La condición se cumple</span>
<span class="cm"># (la segunda condición no se cumple, así que no se ejecuta nada y no da error)</span></code></pre>

    <pre><span class="lt">python</span><code><span class="var">lecciones_completadas</span> = <span class="num">3</span>
<span class="var">lecciones_dia</span> = <span class="num">5</span>

<span class="cm"># Comprobamos si hoy hemos completado alguna lección:</span>
<span class="kw">if</span> <span class="var">lecciones_dia</span> > <span class="num">0</span>:
    <span class="var">lecciones_completadas</span> += <span class="var">lecciones_dia</span>

<span class="fn">print</span>(<span class="str">f"Las lecciones completadas ahora son: {<span class="var">lecciones_completadas</span>}"</span>)
<span class="cm"># Output esperado: Las lecciones completadas ahora son: 8</span></code></pre>

    <h2>Condicionales: if ... else</h2>
    <p>Permite ejecutar un bloque de código <strong>u otro</strong>, según si la condición es verdadera o falsa.</p>
    <div class="callout warn"><span class="callout-icon">📌</span><p>IMPORTANTE: usar los dos puntos <code>:</code> después de la condición, e indentar tanto el bloque <code>if</code> como el bloque <code>else</code>.</p></div>
    <pre><span class="lt">python</span><code><span class="var">lecciones_completadas</span> = <span class="num">3</span>
<span class="var">lecciones_dia</span> = <span class="num">5</span>

<span class="kw">if</span> <span class="var">lecciones_dia</span> > <span class="num">0</span>:
    <span class="var">lecciones_completadas</span> += <span class="var">lecciones_dia</span>
<span class="kw">else</span>:
    <span class="fn">print</span>(<span class="str">f"Hoy no hemos completado ninguna lección"</span>)

<span class="fn">print</span>(<span class="str">f"Las lecciones completadas ahora son: {<span class="var">lecciones_completadas</span>}"</span>)
<span class="cm"># Output esperado: Las lecciones completadas ahora son: 8</span></code></pre>

    <pre><span class="lt">python</span><code><span class="cm"># Lo mismo, pero sin completar ninguna lección hoy</span>
<span class="var">lecciones_completadas</span> = <span class="num">3</span>
<span class="var">lecciones_dia</span> = <span class="num">0</span>

<span class="kw">if</span> <span class="var">lecciones_dia</span> > <span class="num">0</span>:
    <span class="var">lecciones_completadas</span> += <span class="var">lecciones_dia</span>
<span class="kw">else</span>:
    <span class="fn">print</span>(<span class="str">f'Hoy no hemos completado ninguna lección'</span>)
<span class="cm"># Output esperado: Hoy no hemos completado ninguna lección</span></code></pre>
    <div class="callout tip"><span class="callout-icon">✅</span><p>Si la condición del <code>if</code> es verdadera se ejecuta su bloque y el <code>else</code> se ignora; si es falsa, ocurre justo lo contrario.</p></div>

    <h2>Condicionales: if ... elif ... else</h2>
    <p>Permite evaluar <strong>múltiples condiciones</strong> en secuencia, para decisiones con más de dos caminos posibles.</p>
    <div class="callout warn"><span class="callout-icon">📌</span><p>IMPORTANTE: dos puntos <code>:</code> después de cada condición (<code>if</code>, <code>elif</code> y <code>else</code>), e indentación en cada bloque.</p></div>
    <pre><span class="lt">python</span><code><span class="cm"># Comprobamos si hemos completado más de 5 lecciones hoy</span>
<span class="var">lecciones_completadas</span> = <span class="num">3</span>
