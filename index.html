     GOOGLE SHEETS — LECCIÓN 3: CRUZAR TABLAS CON BUSCARV
     subtabs: BUSCARV básico · SI.ERROR · COINCIDIR (índice dinámico) · CONCATENAR (varios criterios)
══════════════════════════════════════ -->
<template id="tpl-gs_buscarv">
  <div class="topic-header">
    <div class="th-eyebrow">Módulo 10 · Google Sheets · Lección 2</div>
    <div class="th-title">Cruzar tablas con <em>BUSCARV</em></div>
    <p class="th-desc">La función más usada para traer datos de una tabla a otra, y cómo blindarla con SI.ERROR, COINCIDIR y CONCATENAR.</p>
  </div>

  <div class="subtab-nav">
    <button class="stab active" data-sub="gsb1">1. BUSCARV básico</button>
    <button class="stab" data-sub="gsb2">2. + SI.ERROR</button>
    <button class="stab" data-sub="gsb3">3. + COINCIDIR</button>
    <button class="stab" data-sub="gsb4">4. + CONCATENAR</button>
  </div>

  <!-- GSB1: BUSCARV básico -->
  <div class="sub-sec on" id="sub-gsb1">
    <h2>¿Qué es BUSCARV?</h2>
    <p><strong>BUSCARV</strong> (en inglés <code>VLOOKUP</code>, "Vertical Lookup") busca un valor en la <strong>primera columna</strong> de un rango y devuelve un dato de esa misma fila, pero de otra columna. Es la función estándar para <strong>cruzar dos tablas</strong>: tienes un dato conocido (ej. un ID de cliente) y quieres traer información relacionada (ej. su categoría) desde otra tabla.</p>
    <div class="callout info"><span class="callout-icon">💡</span><p>Piénsalo como buscar un nombre en una guía telefónica: encuentras el nombre, y justo al lado está el número que necesitas. BUSCARV hace exactamente eso con tus datos.</p></div>

    <h2>Sintaxis</h2>
    <pre><span class="lt">sheets</span><code><span class="fn">BUSCARV</span>(valor_búsqueda; rango; índice; [está_ordenado])</code></pre>
    <div class="table-wrap"><table>
      <thead><tr><th>Argumento</th><th>Qué es</th></tr></thead>
      <tbody>
        <tr><td><code>valor_búsqueda</code></td><td>El valor que quieres encontrar (ej. una celda con un ID o un nombre)</td></tr>
        <tr><td><code>rango</code></td><td>El rango donde se busca. La <strong>primera columna</strong> de este rango es donde se busca el valor</td></tr>
        <tr><td><code>índice</code></td><td>El número de columna (contando desde 1, empezando por la primera columna del rango) de donde se devuelve el resultado</td></tr>
        <tr><td><code>está_ordenado</code></td><td><strong>FALSO</strong> para coincidencia exacta (recomendado casi siempre) · VERDADERO para coincidencia aproximada</td></tr>
      </tbody>
    </table></div>
    <div class="callout warn"><span class="callout-icon">📌</span><p>IMPORTANTE: cuenta las columnas del <strong>rango que has seleccionado</strong>, no de toda la hoja, y siempre empezando en 1. Si tu rango es <code>B2:E50</code>, la columna B es la 1, la C es la 2, etc.</p></div>

    <h2>Ejemplo paso a paso</h2>
    <p>Tienes esta tabla de empleados en <code>A1:B6</code> (columna A = nombre, columna B = departamento), y en la celda <code>D2</code> quieres saber el departamento de "Marta":</p>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Hoja1 — Empleados</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th><th class="gs-colhead">D</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Nombre</td><td>Departamento</td><td></td><td>Nombre buscado</td></tr>
          <tr><td class="gs-rownum">2</td><td>Ana</td><td>Marketing</td><td></td><td class="hl-blue">Marta</td></tr>
          <tr><td class="gs-rownum">3</td><td>Luis</td><td>Ventas</td><td></td><td></td></tr>
          <tr><td class="gs-rownum">4</td><td>Marta</td><td>Contabilidad</td><td></td><td></td></tr>
          <tr><td class="gs-rownum">5</td><td>Carlos</td><td>IT</td><td></td><td></td></tr>
          <tr><td class="gs-rownum">6</td><td>Eva</td><td>Marketing</td><td></td><td></td></tr>
        </tbody>
      </table>
    </div>
    <pre><span class="lt">sheets</span><code><span class="fn">BUSCARV</span>(D2; A1:B6; <span class="num">2</span>; <span class="kw">FALSO</span>)   <span class="cm">// devuelve "Contabilidad"</span></code></pre>
    <p>La fórmula busca "Marta" (el valor de D2) en la columna A —la primera del rango— y, al encontrarla en la fila 4, devuelve el valor de esa misma fila en la columna B —la 2ª columna del rango—: <strong>"Contabilidad"</strong>.</p>

    <h2>La gran limitación: solo busca hacia la derecha</h2>
    <div class="callout warn"><span class="callout-icon">⚠️</span><p>BUSCARV solo puede devolver datos de columnas que estén <strong>a la derecha</strong> de la columna de búsqueda. Si el dato que quieres traer está a la izquierda, BUSCARV no funciona — para eso existen <code>ÍNDICE + COINCIDIR</code> o <code>BUSCARX</code>, más flexibles.</p></div>

    <h2>Cruzar datos entre hojas distintas</h2>
    <p>Si la tabla de origen está en otra pestaña, antepón el nombre de la hoja al rango:</p>
    <pre><span class="lt">sheets</span><code><span class="fn">BUSCARV</span>(A2; Precios!A:C; <span class="num">3</span>; <span class="kw">FALSO</span>)</code></pre>
    <div class="callout tip"><span class="callout-icon">✅</span><p>Fija el rango con <code>$</code> (ej. <code>$A$1:$C$500</code>) antes de arrastrar la fórmula hacia abajo, o el rango se irá desplazando fila a fila y dejará de encontrar coincidencias. Truco: selecciona el rango y pulsa <code>F4</code> para que Sheets añada los símbolos del dólar automáticamente.</p></div>
  </div>

  <!-- GSB2: + SI.ERROR -->
  <div class="sub-sec" id="sub-gsb2">
    <h2>El problema: el error #N/A</h2>
    <p>Cuando BUSCARV no encuentra el valor que buscas, devuelve <code>#N/A</code>. Es información correcta (significa "no existe esa coincidencia"), pero queda feo en un informe y puede romper otras fórmulas que dependan de esa celda. Siguiendo con la tabla de empleados, si buscamos a "Pedro" (que no está en la lista):</p>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Hoja1 — Empleados</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th><th class="gs-colhead">D</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Nombre</td><td>Departamento</td><td></td><td>Nombre buscado</td></tr>
          <tr><td class="gs-rownum">2</td><td>Ana</td><td>Marketing</td><td></td><td class="hl-blue">Pedro</td></tr>
          <tr><td class="gs-rownum">3</td><td>Luis</td><td>Ventas</td><td></td><td class="hl-red">#N/A</td></tr>
          <tr><td class="gs-rownum">4</td><td>Marta</td><td>Contabilidad</td><td></td><td></td></tr>
        </tbody>
      </table>
    </div>
    <p>"Pedro" no existe en la columna A, así que <code>BUSCARV(D2;A1:B6;2;FALSO)</code> devuelve <code>#N/A</code> en D3.</p>

    <h2>La solución: envolver con SI.ERROR</h2>
    <p><code>SI.ERROR</code> (en inglés <code>IFERROR</code>) comprueba si una fórmula devuelve un error y, si es así, muestra otra cosa en su lugar — en vez del error feo.</p>
    <pre><span class="lt">sheets</span><code><span class="fn">SI.ERROR</span>(valor; [valor_si_error])</code></pre>
    <pre><span class="lt">sheets</span><code><span class="fn">SI.ERROR</span>(<span class="fn">BUSCARV</span>(D2; A1:B6; <span class="num">2</span>; <span class="kw">FALSO</span>); <span class="str">"No encontrado"</span>)</code></pre>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Mismo caso, ahora con SI.ERROR</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th><th class="gs-colhead">D</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Nombre</td><td>Departamento</td><td></td><td>Nombre buscado</td></tr>
          <tr><td class="gs-rownum">2</td><td>Ana</td><td>Marketing</td><td></td><td class="hl-blue">Pedro</td></tr>
          <tr><td class="gs-rownum">3</td><td>Luis</td><td>Ventas</td><td></td><td class="hl-green">No encontrado</td></tr>
          <tr><td class="gs-rownum">4</td><td>Marta</td><td>Contabilidad</td><td></td><td></td></tr>
        </tbody>
      </table>
    </div>
    <p>Si BUSCARV encuentra el valor, la fórmula muestra el resultado normal. Si no lo encuentra, en vez de <code>#N/A</code> muestra el texto <code>"No encontrado"</code>.</p>
    <div class="callout tip"><span class="callout-icon">✅</span><p>Para informes de cara a un cliente o jefe, es habitual dejar el segundo argumento vacío («») en vez de un texto, para que la celda simplemente quede en blanco: <code>SI.ERROR(BUSCARV(...); "")</code></p></div>

    <h2>Diferencia con SI.ND</h2>
    <p>Si solo quieres capturar específicamente el error <code>#N/A</code> (valor no encontrado) y dejar pasar otros errores distintos (como <code>#REF!</code>, que normalmente indica un fallo real en la fórmula), usa <code>SI.ND</code> en vez de <code>SI.ERROR</code>. En la práctica, para BUSCARV casi siempre se usa <code>SI.ERROR</code> porque es más general.</p>

    <h2>BUSCARV en varias hojas con SI.ERROR encadenado</h2>
    <p>Si el dato puede estar en una hoja u otra, puedes encadenar dos BUSCARV: si el primero falla, se intenta el segundo.</p>
    <pre><span class="lt">sheets</span><code><span class="fn">SI.ERROR</span>(
  <span class="fn">BUSCARV</span>(A2; Hoja1!A:B; <span class="num">2</span>; <span class="kw">FALSO</span>);
  <span class="fn">BUSCARV</span>(A2; Hoja2!A:B; <span class="num">2</span>; <span class="kw">FALSO</span>)
)</code></pre>
    <p>Primero busca en "Hoja1". Si no lo encuentra (da error), prueba en "Hoja2" en su lugar.</p>
  </div>

  <!-- GSB3: + COINCIDIR -->
  <div class="sub-sec" id="sub-gsb3">
    <h2>El problema: índices de columna "a mano"</h2>
    <p>En BUSCARV normal, escribes el número de columna a mano (el <code>2</code>, el <code>3</code>...). Si más adelante insertas o eliminas una columna en la tabla de origen, ese número deja de ser correcto y la fórmula empieza a traer datos equivocados sin avisar.</p>

    <h2>La solución: COINCIDIR como índice dinámico</h2>
    <p><strong>COINCIDIR</strong> (en inglés <code>MATCH</code>) no busca un dato — busca la <strong>posición</strong> de un valor dentro de un rango.</p>
    <pre><span class="lt">sheets</span><code><span class="fn">COINCIDIR</span>(valor_búsqueda; rango; [tipo_de_coincidencia])</code></pre>
    <p>El <code>tipo_de_coincidencia</code> casi siempre es <code>0</code> (coincidencia exacta). Ampliamos la tabla de empleados con una columna más, "Sueldo":</p>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Hoja1 — Empleados (ampliada)</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Nombre</td><td class="hl-yellow">Departamento</td><td>Sueldo</td></tr>
          <tr><td class="gs-rownum">2</td><td>Ana</td><td>Marketing</td><td>1.900</td></tr>
          <tr><td class="gs-rownum">3</td><td>Luis</td><td>Ventas</td><td>1.750</td></tr>
          <tr><td class="gs-rownum">4</td><td>Marta</td><td>Contabilidad</td><td>2.100</td></tr>
        </tbody>
      </table>
    </div>
    <pre><span class="lt">sheets</span><code><span class="fn">COINCIDIR</span>(<span class="str">"Departamento"</span>; A1:C1; <span class="num">0</span>)   <span class="cm">// devuelve 2</span></code></pre>
    <p>"Departamento" está en la 2ª posición de la fila de encabezados (A1:C1), así que COINCIDIR devuelve <strong>2</strong>.</p>

    <h2>Combinando BUSCARV + COINCIDIR</h2>
    <p>En vez de escribir el índice de columna a mano, dejas que COINCIDIR lo calcule por ti, buscando el encabezado:</p>
    <pre><span class="lt">sheets</span><code><span class="fn">BUSCARV</span>(D2; A1:C6; <span class="fn">COINCIDIR</span>(<span class="str">"Departamento"</span>; A1:C1; <span class="num">0</span>); <span class="kw">FALSO</span>)</code></pre>
    <div class="callout tip"><span class="callout-icon">✅</span><p>Ahora, si insertas una columna nueva entre "Nombre" y "Departamento" (por ejemplo "Antigüedad"), COINCIDIR recalcula solo que "Departamento" pasó a ser la 3ª columna, y BUSCARV sigue funcionando sin tocar nada. Con un índice fijo (<code>2</code> escrito a mano), la fórmula se habría roto silenciosamente.</p></div>

    <h2>La alternativa más potente: ÍNDICE + COINCIDIR</h2>
    <p>Cuando BUSCARV no es suficiente (por ejemplo, porque necesitas buscar hacia la izquierda), se sustituye por completo por la combinación <code>ÍNDICE + COINCIDIR</code>:</p>
    <pre><span class="lt">sheets</span><code><span class="fn">ÍNDICE</span>(columna_resultado; <span class="fn">COINCIDIR</span>(valor_búsqueda; columna_búsqueda; <span class="num">0</span>))</code></pre>
    <p>Ejemplo con una tabla de ventas donde las ciudades están en filas y los años en columnas — y queremos la venta de "Valencia" en "2026", a la <strong>izquierda</strong> de donde estaría el valor de búsqueda si usáramos BUSCARV normal:</p>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Hoja2 — Ventas por ciudad y año</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th><th class="gs-colhead">D</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Ciudad</td><td>2024</td><td>2025</td><td class="hl-yellow">2026</td></tr>
          <tr><td class="gs-rownum">2</td><td>Madrid</td><td>12.000</td><td>14.500</td><td>15.800</td></tr>
          <tr><td class="gs-rownum">3</td><td>Valencia</td><td>8.200</td><td>9.100</td><td class="hl-green">9.950</td></tr>
          <tr><td class="gs-rownum">4</td><td>Bilbao</td><td>6.700</td><td>7.300</td><td>7.600</td></tr>
        </tbody>
      </table>
    </div>
    <pre><span class="lt">sheets</span><code><span class="fn">ÍNDICE</span>(B2:D4; <span class="fn">COINCIDIR</span>(<span class="str">"Valencia"</span>; A2:A4; <span class="num">0</span>); <span class="fn">COINCIDIR</span>(<span class="num">2026</span>; B1:D1; <span class="num">0</span>))   <span class="cm">// devuelve 9.950</span></code></pre>
    <p>El primer COINCIDIR encuentra que "Valencia" está en la 2ª fila del rango de ciudades; el segundo COINCIDIR encuentra que "2026" está en la 3ª columna del rango de años. ÍNDICE cruza ambas posiciones dentro de B2:D4 y devuelve <strong>9.950</strong>.</p>
    <div class="table-wrap"><table>
      <thead><tr><th></th><th>BUSCARV</th><th>ÍNDICE + COINCIDIR</th></tr></thead>
      <tbody>
        <tr><td><strong>¿Busca a la izquierda?</strong></td><td>No</td><td>Sí</td></tr>
        <tr><td><strong>¿Afectado por insertar columnas?</strong></td><td>Sí (si el índice es fijo)</td><td>No</td></tr>
        <tr><td><strong>Complejidad</strong></td><td>Más simple</td><td>Más flexible, algo más larga de escribir</td></tr>
      </tbody>
    </table></div>
  </div>

  <!-- GSB4: + CONCATENAR -->
  <div class="sub-sec" id="sub-gsb4">
    <h2>El problema: BUSCARV solo admite un criterio</h2>
    <p>BUSCARV busca un único valor en una única columna. Pero, ¿qué pasa si necesitas buscar por <strong>dos condiciones a la vez</strong>? Por ejemplo: el departamento "Ventas" <em>y</em> el año "2026" — porque puede haber varias filas con "Ventas" en años distintos.</p>
    <div class="callout warn"><span class="callout-icon">📌</span><p>BUSCARV no admite varios criterios de forma nativa. La solución estándar es crear una <strong>columna auxiliar</strong> que combine los criterios en un único valor de texto.</p></div>

    <h2>La solución: columna auxiliar con CONCATENAR</h2>
    <p><strong>CONCATENAR</strong> (o el operador <code>&amp;</code>, que hace lo mismo y es más corto de escribir) une el contenido de varias celdas en una sola cadena de texto.</p>
    <pre><span class="lt">sheets</span><code><span class="fn">CONCATENAR</span>(texto1; texto2; ...)
<span class="cm">// equivalente, más corto:</span>
texto1 &amp; texto2</code></pre>

    <h2>Ejemplo paso a paso</h2>
    <p>Tienes esta tabla de pedidos con columnas "Cliente" (B), "Año" (C) y "Producto" (D), y quieres encontrar el producto comprado por "Juan" en "2026" — hay dos filas con "Juan", así que un BUSCARV normal por nombre traería siempre la primera que encuentre:</p>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Hoja1 — Pedidos (antes de la columna auxiliar)</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th><th class="gs-colhead">D</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>ID</td><td>Cliente</td><td>Año</td><td>Producto</td></tr>
          <tr><td class="gs-rownum">2</td><td>1</td><td>Juan</td><td>2025</td><td>Teclado</td></tr>
          <tr><td class="gs-rownum">3</td><td>2</td><td>Juan</td><td>2026</td><td>Monitor</td></tr>
          <tr><td class="gs-rownum">4</td><td>3</td><td>Eva</td><td>2026</td><td>Ratón</td></tr>
        </tbody>
      </table>
    </div>
    <ol>
      <li>Inserta una <strong>columna auxiliar</strong> a la izquierda de tus columnas de búsqueda (será la nueva primera columna).</li>
      <li>En la primera celda de esa columna escribe: <code>=B2&amp;C2</code> (o <code>=CONCATENAR(B2;C2)</code>). Esto combina "Juan" y "2026" en <code>"Juan2026"</code>.</li>
      <li>Copia esa fórmula a todas las filas de la tabla.</li>
    </ol>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Hoja1 — con columna auxiliar "Clave" insertada en A</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th><th class="gs-colhead">D</th><th class="gs-colhead">E</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td class="hl-yellow">Clave</td><td>ID</td><td>Cliente</td><td>Año</td><td>Producto</td></tr>
          <tr><td class="gs-rownum">2</td><td class="hl-yellow">Juan2025</td><td>1</td><td>Juan</td><td>2025</td><td>Teclado</td></tr>
          <tr><td class="gs-rownum">3</td><td class="hl-green">Juan2026</td><td>2</td><td>Juan</td><td>2026</td><td>Monitor</td></tr>
          <tr><td class="gs-rownum">4</td><td class="hl-yellow">Eva2026</td><td>3</td><td>Eva</td><td>2026</td><td>Ratón</td></tr>
        </tbody>
      </table>
    </div>
    <p>Ahora usa BUSCARV normal, buscando el mismo texto combinado como valor de búsqueda — ya no hay ambigüedad entre las dos filas de "Juan":</p>
    <pre><span class="lt">sheets</span><code><span class="fn">BUSCARV</span>(<span class="str">"Juan"</span>&amp;<span class="str">"2026"</span>; A2:E4; <span class="num">5</span>; <span class="kw">FALSO</span>)   <span class="cm">// devuelve "Monitor"</span></code></pre>
    <p>O, si los criterios están en celdas (por ejemplo F1 = "Juan" y F2 = "2026"):</p>
    <pre><span class="lt">sheets</span><code><span class="fn">BUSCARV</span>(F1&amp;F2; A2:E4; <span class="num">5</span>; <span class="kw">FALSO</span>)</code></pre>

    <h2>La fórmula completa, blindada</h2>
    <p>Juntando todo lo aprendido en esta lección — BUSCARV + SI.ERROR + CONCATENAR — una fórmula robusta para cruzar tablas por varios criterios queda así:</p>
    <pre><span class="lt">sheets</span><code><span class="fn">SI.ERROR</span>(
  <span class="fn">BUSCARV</span>(F1&amp;F2; A2:E4; <span class="num">5</span>; <span class="kw">FALSO</span>);
  <span class="str">"No encontrado"</span>
)</code></pre>
    <div class="callout tip"><span class="callout-icon">✅</span><p>Antes de dar por bueno un cruce de tablas por texto, comprueba que no haya espacios sobrantes al copiar datos de otra fuente (ej. "Juan " con espacio al final no es igual a "Juan"). La función <code>ESPACIOS()</code> (TRIM) limpia esos espacios antes de concatenar.</p></div>
  </div>
</template>

<!-- ══════════════════════════════════════
     GOOGLE SHEETS — LECCIÓN 4: VALIDACIÓN DE DATOS
     subtabs: Listas desplegables · Números y fechas · Fórmula personalizada
══════════════════════════════════════ -->
<template id="tpl-gs_validacion">
  <div class="topic-header">
    <div class="th-eyebrow">Módulo 10 · Google Sheets · Lección 3</div>
    <div class="th-title">Validación de <em>datos</em></div>
    <p class="th-desc">Cómo controlar qué se puede escribir en una celda: listas desplegables, rangos numéricos, fechas y reglas avanzadas.</p>
  </div>

  <div class="subtab-nav">
    <button class="stab active" data-sub="gsv1">1. Qué es y listas desplegables</button>
    <button class="stab" data-sub="gsv2">2. Números, texto y fechas</button>
    <button class="stab" data-sub="gsv3">3. Fórmula personalizada</button>
  </div>

  <!-- GSV1 -->
  <div class="sub-sec on" id="sub-gsv1">
    <h2>¿Qué es la validación de datos?</h2>
    <p>La <strong>validación de datos</strong> es una regla que se aplica a una celda o rango para controlar qué se puede escribir en ella. Sirve para evitar errores de digitación, estandarizar las respuestas y mantener la calidad de los datos desde el momento en que se introducen — no después, al revisar.</p>
    <p>Se activa desde <code>Datos → Validación de datos</code>.</p>

    <h2>Crear una lista desplegable con valores manuales</h2>
    <p>Ejemplo: una columna "Estado" en una tabla de pedidos, donde solo se permiten tres valores posibles.</p>
    <ol>
      <li>Selecciona la celda o el rango donde quieres el desplegable.</li>
      <li><code>Datos → Validación de datos → Añadir regla</code>.</li>
      <li>En "Criterios", elige <strong>Menú desplegable</strong>.</li>
      <li>Escribe las opciones manualmente, separadas (ej. "Pendiente", "Enviado", "Entregado").</li>
      <li>Pulsa <strong>Hecho</strong>.</li>
    </ol>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Hoja1 — Pedidos, con desplegable en la columna B</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Pedido</td><td>Estado</td></tr>
          <tr><td class="gs-rownum">2</td><td>#1001</td><td class="hl-green">Entregado ▾</td></tr>
          <tr><td class="gs-rownum">3</td><td>#1002</td><td class="hl-yellow">Pendiente ▾</td></tr>
          <tr><td class="gs-rownum">4</td><td>#1003</td><td class="hl-blue">Enviado ▾</td></tr>
        </tbody>
      </table>
    </div>
    <p>Cada celda de la columna B muestra una flecha ▾: al hacer clic, se despliegan únicamente las tres opciones permitidas — no se puede escribir libremente "en tránsito" o cualquier otro texto.</p>
    <div class="callout info"><span class="callout-icon">💡</span><p>Esta opción es ideal para listas cortas y cerradas que casi nunca van a cambiar.</p></div>

    <h2>Crear una lista desplegable desde un rango</h2>
    <p>Cuando la lista es más larga o cambia con el tiempo (clientes, productos, países...), es mejor que el desplegable lea sus opciones de un rango de celdas en vez de escribirlas a mano:</p>
    <ol>
      <li>En "Criterios", elige <strong>Menú desplegable (de un intervalo)</strong>.</li>
      <li>Selecciona el rango de celdas que contiene las opciones (ej. <code>Hoja1!B2:B50</code>).</li>
    </ol>
    <div class="callout tip"><span class="callout-icon">✅</span><p>Fija el rango con <code>$</code> (ej. <code>$B$2:$B$50</code>) o usa un rango algo más amplio del necesario (ej. hasta la fila 1000), así no tendrás que tocar la validación cada vez que añadas una opción nueva a la lista.</p></div>

    <h2>Opciones complementarias</h2>
    <ul>
      <li><strong>Mostrar texto de ayuda:</strong> un mensaje que aparece al seleccionar la celda, explicando qué se espera que se introduzca ahí.</li>
      <li><strong>Mostrar una advertencia</strong> vs. <strong>Rechazar la entrada:</strong> la primera permite escribir algo distinto pero avisa con un mensaje; la segunda bloquea por completo cualquier valor que no esté en la lista.</li>
    </ul>
    <p>Si alguien intenta escribir "En camino" a mano en vez de elegir del desplegable, con "Rechazar la entrada" activado se vería así:</p>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Hoja1 — intento de entrada no válida en B4</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Pedido</td><td>Estado</td></tr>
          <tr><td class="gs-rownum">4</td><td>#1003</td><td class="hl-red">"En camino" ✕</td></tr>
        </tbody>
      </table>
    </div>
    <p>Sheets rechaza el valor y muestra un mensaje de error, manteniendo el contenido anterior de la celda (o dejándola vacía si era nueva).</p>
    <div class="callout warn"><span class="callout-icon">📌</span><p>Para aplicar la misma validación (incluida la lista desplegable) a otras celdas sin repetir todo el proceso: copia la celda con la validación, selecciona el rango destino, clic derecho → <strong>Pegado especial → Pegar solo la validación de datos</strong>.</p></div>
  </div>

  <!-- GSV2 -->
  <div class="sub-sec" id="sub-gsv2">
    <h2>Validar números dentro de un rango</h2>
    <p>Útil para evitar valores imposibles (ej. existencias negativas, edades absurdas, porcentajes fuera de 0-100):</p>
    <ol>
      <li>En "Criterios", elige <strong>Número</strong>.</li>
      <li>Elige la condición: <strong>Mayor que</strong>, <strong>Menor que</strong>, <strong>Está entre</strong>, <strong>Es igual a</strong>...</li>
      <li>Introduce el valor o valores límite (ej. "Está entre" 1 y 100).</li>
    </ol>

    <h2>Validar texto</h2>
    <p>Permite controlar cadenas de texto por longitud o por contenido — por ejemplo, exigir que un código tenga un formato concreto.</p>

    <h2>Validar fechas</h2>
    <p>Garantiza que solo se introduzcan fechas válidas, y permite restringir a un rango (ej. solo fechas del año en curso, o posteriores a una fecha determinada).</p>

    <h2>Qué pasa si el dato no es válido</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Opción</th><th>Comportamiento</th></tr></thead>
      <tbody>
        <tr><td><strong>Mostrar una advertencia</strong></td><td>Permite la entrada de todas formas, pero marca la celda y avisa al usuario</td></tr>
        <tr><td><strong>Rechazar la entrada</strong></td><td>No deja guardar el valor; aparece un mensaje de error y hay que corregirlo</td></tr>
      </tbody>
    </table></div>
    <div class="callout warn"><span class="callout-icon">⚠️</span><p>Si te aparece un mensaje de error al escribir un dato que "debería" ser válido, revisa: que el rango de validación sea el correcto, que no haya espacios sobrantes, y que el tipo de dato coincida (ej. un número guardado como texto no pasará una validación de "Número").</p></div>
  </div>

  <!-- GSV3 -->
  <div class="sub-sec" id="sub-gsv3">
    <h2>¿Qué es una fórmula personalizada en validación?</h2>
    <p>Cuando ninguna de las opciones estándar (lista, número, fecha) es suficiente, puedes escribir tu propia regla con una <strong>fórmula personalizada</strong>. La regla es siempre la misma: la fórmula tiene que devolver <code>VERDADERO</code> o <code>FALSO</code>.</p>
    <ul>
      <li><strong>VERDADERO</strong> → el dato introducido es válido, se permite.</li>
      <li><strong>FALSO</strong> → el dato no es válido, se avisa o se rechaza según la configuración.</li>
    </ul>

    <h2>Cómo configurarla</h2>
    <ol>
      <li>Selecciona el rango.</li>
      <li><code>Datos → Validación de datos → Añadir regla</code>.</li>
      <li>En "Criterios", elige <strong>Fórmula personalizada es</strong>.</li>
      <li>Escribe la fórmula (siempre empieza con <code>=</code>).</li>
    </ol>

    <h2>Ejemplos prácticos</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Necesidad</th><th>Fórmula personalizada</th></tr></thead>
      <tbody>
        <tr><td>Solo números positivos (sin stock negativo)</td><td><code>=Y(ESNUMERO(A1); A1&gt;0)</code></td></tr>
        <tr><td>Solo texto en mayúsculas</td><td><code>=IGUAL(A1; MAYUSC(A1))</code></td></tr>
        <tr><td>Que el texto empiece por una palabra concreta</td><td><code>=IZQUIERDA(A1;6)=&quot;Cliente&quot;</code></td></tr>
        <tr><td>Evitar duplicados en una columna</td><td><code>=CONTAR.SI(A:A; A1)=1</code></td></tr>
        <tr><td>Validar con una expresión regular (ej. código postal de 5 cifras)</td><td><code>=REGEXMATCH(A1; &quot;^\d{5}$&quot;)</code></td></tr>
      </tbody>
    </table></div>
    <div class="callout tip"><span class="callout-icon">✅</span><p><code>Y(...)</code> permite exigir que se cumplan varias condiciones a la vez. Es muy útil cuando una sola regla estándar (solo número, o solo texto) no es suficiente.</p></div>

    <h2>Validación basada en otra celda</h2>
    <p>La fórmula personalizada también permite condicionar una celda al valor de otra. Por ejemplo, para que la columna B solo acepte texto si en la celda A1 pone "Permitir":</p>
    <pre><span class="lt">sheets</span><code>=$A$<span class="num">1</span>=<span class="str">"Permitir"</span></code></pre>
    <div class="callout warn"><span class="callout-icon">📌</span><p>Las fórmulas personalizadas son potentes, pero conviene probarlas bien antes de aplicarlas a un rango grande — un error de lógica puede rechazar (o aceptar) datos de forma inesperada.</p></div>

    <h2>Resumen: tipos de validación</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Tipo</th><th>Para qué sirve</th></tr></thead>
      <tbody>
        <tr><td><strong>Lista de elementos</strong></td><td>Opciones cerradas y cortas, escritas a mano</td></tr>
        <tr><td><strong>Lista desde un rango</strong></td><td>Opciones que viven en una hoja/columna y pueden crecer</td></tr>
        <tr><td><strong>Número / Texto / Fecha</strong></td><td>Restringir por tipo de dato y condiciones simples (rango, longitud...)</td></tr>
        <tr><td><strong>Fórmula personalizada</strong></td><td>Cualquier regla que devuelva VERDADERO/FALSO; la opción más flexible</td></tr>
      </tbody>
    </table></div>
  </div>
</template>
<!-- ══════════════════════════════════════
     GOOGLE SHEETS — LECCIÓN 5: FORMATO CONDICIONAL
     subtabs: Color único · Escala de colores · Fórmula personalizada · Analizar datos
══════════════════════════════════════ -->
<template id="tpl-gs_formato">
  <div class="topic-header">
    <div class="th-eyebrow">Módulo 10 · Google Sheets · Lección 4</div>
    <div class="th-title">Formato <em>condicional</em></div>
    <p class="th-desc">Cómo resaltar automáticamente celdas según su contenido, y cómo usarlo para analizar datos de un vistazo. Todos los ejemplos usan la misma tabla de ventas.</p>
  </div>

  <div class="callout info"><span class="callout-icon">📊</span><p>Tabla de ejemplo usada en toda la lección: ventas mensuales por comercial, con importe vendido y nº de pedidos.</p></div>
  <div class="gs-sheet-wrap">
    <div class="gs-sheet-caption">Hoja1 — Ventas Q1 2026</div>
    <table class="gs-sheet">
      <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th><th class="gs-colhead">D</th></tr></thead>

  <!-- GSF1: Color único -->
  <div class="sub-sec on" id="sub-gsf1">
    <h2>¿Qué es el formato condicional?</h2>
    <p>El <strong>formato condicional</strong> cambia automáticamente la apariencia (color de fondo, color de texto, negrita...) de una celda cuando su contenido cumple una condición que tú defines. Se activa desde <code>Formato → Formato condicional</code>, lo que abre un panel a la derecha donde se construye la regla con tres piezas: <strong>rango</strong> (a qué celdas se aplica), <strong>condición</strong> (qué se comprueba) y <strong>estilo</strong> (qué cambia visualmente).</p>
    <div class="callout tip"><span class="callout-icon">✅</span><p>Es dinámico: si los datos cambian, el formato se recalcula solo. No hace falta repetir el proceso cada vez que se actualiza la hoja.</p></div>

    <h2>Ejemplo: resaltar ventas bajas en rojo</h2>
    <p>Queremos detectar de un vistazo qué meses de algún comercial vendieron por debajo de 3.000€. Seleccionamos el rango C2:C7 (la columna "Ventas") y aplicamos:</p>
    <ol>
      <li><code>Formato → Formato condicional</code>.</li>
      <li>En "Aplicar formato a las celdas si", elegimos <strong>Menor que</strong>.</li>
      <li>Escribimos el valor <code>3000</code>.</li>
      <li>En "Estilo de formato", elegimos relleno rojo.</li>
    </ol>
    <p>Resultado sobre la misma tabla:</p>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Regla: C2:C7 — Menor que 3000 → rojo</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th><th class="gs-colhead">D</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Comercial</td><td>Mes</td><td>Ventas (€)</td><td>Pedidos</td></tr>
          <tr><td class="gs-rownum">2</td><td>Ana</td><td>Enero</td><td>4.200</td><td>18</td></tr>
          <tr><td class="gs-rownum">3</td><td>Luis</td><td>Enero</td><td class="hl-red">950</td><td>6</td></tr>
          <tr><td class="gs-rownum">4</td><td>Marta</td><td>Enero</td><td>3.100</td><td>14</td></tr>
          <tr><td class="gs-rownum">5</td><td>Ana</td><td>Febrero</td><td class="hl-red">2.800</td><td>11</td></tr>
          <tr><td class="gs-rownum">6</td><td>Luis</td><td>Febrero</td><td>5.600</td><td>22</td></tr>
          <tr><td class="gs-rownum">7</td><td>Marta</td><td>Febrero</td><td>3.100</td><td>14</td></tr>
        </tbody>
      </table>
    </div>
    <p>Solo las celdas de Luis en enero (950€) y Ana en febrero (2.800€) — las que están por debajo de 3.000 — quedan en rojo. El resto no cambia.</p>

    <h2>Otras condiciones habituales con "Color único"</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Condición</th><th>Para qué sirve</th></tr></thead>
      <tbody>
        <tr><td>Mayor que / Menor que / Está entre</td><td>Umbrales numéricos (presupuestos, objetivos, alertas)</td></tr>
        <tr><td>El texto contiene / No contiene</td><td>Marcar categorías, estados o palabras clave</td></tr>
        <tr><td>Texto exacto</td><td>Resaltar un valor concreto (ej. un departamento determinado)</td></tr>
        <tr><td>Está vacío / No está vacío</td><td>Detectar huecos en la entrada de datos</td></tr>
        <tr><td>Fecha es anterior a / posterior a</td><td>Plazos vencidos o próximos a vencer</td></tr>
      </tbody>
    </table></div>
    <div class="callout warn"><span class="callout-icon">📌</span><p>Puedes apilar varias reglas sobre el mismo rango (ej. rojo si &lt;3000 y verde si &gt;5000). Sheets las evalúa en el orden en que las creaste, pero el orden se puede cambiar arrastrando las reglas en el panel.</p></div>
  </div>

  <!-- GSF2: Escala de colores -->
  <div class="sub-sec" id="sub-gsf2">
    <h2>¿Qué es la escala de colores?</h2>
    <p>En vez de fijar un umbral tú mismo, la <strong>escala de colores</strong> colorea todas las celdas del rango de forma relativa entre sí: los valores más altos se ven de un color, los más bajos de otro, con una gradación en medio. Es exactamente el "mapa de calor" (heatmap) que ves en los dashboards.</p>
    <ol>
      <li>Selecciona el rango (ej. C2:C7).</li>
      <li><code>Formato → Formato condicional → Escala de colores</code>.</li>
      <li>Elige una escala predefinida (rojo-amarillo-verde es la más habitual) o personaliza los colores de los puntos mínimo, medio y máximo.</li>
    </ol>

    <h2>Ejemplo sobre la tabla de ventas</h2>
    <p>Aplicando una escala de colores a la columna "Ventas (€)", de rojo (menos ventas) a verde (más ventas):</p>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Regla: C2:C7 — Escala de colores (rojo → verde)</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th><th class="gs-colhead">D</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Comercial</td><td>Mes</td><td>Ventas (€)</td><td>Pedidos</td></tr>
          <tr><td class="gs-rownum">2</td><td>Ana</td><td>Enero</td><td class="hl-scale-3">4.200</td><td>18</td></tr>
          <tr><td class="gs-rownum">3</td><td>Luis</td><td>Enero</td><td class="hl-red">950</td><td>6</td></tr>
          <tr><td class="gs-rownum">4</td><td>Marta</td><td>Enero</td><td class="hl-scale-2">3.100</td><td>14</td></tr>
          <tr><td class="gs-rownum">5</td><td>Ana</td><td>Febrero</td><td class="hl-scale-1">2.800</td><td>11</td></tr>
          <tr><td class="gs-rownum">6</td><td>Luis</td><td>Febrero</td><td class="hl-scale-4">5.600</td><td>22</td></tr>
          <tr><td class="gs-rownum">7</td><td>Marta</td><td>Febrero</td><td class="hl-scale-2">3.100</td><td>14</td></tr>
        </tbody>
      </table>
    </div>
    <p>De un solo vistazo se ve que <strong>Luis en febrero (5.600€)</strong> es el mejor dato, y <strong>Luis en enero (950€)</strong> el peor — sin tener que leer ni comparar los números uno a uno.</p>
    <div class="callout tip"><span class="callout-icon">✅</span><p>La escala de colores es la herramienta perfecta para detectar de un vistazo quién/qué rinde mejor o peor en una tabla larga — mucho más rápido que ordenar o leer cifra por cifra.</p></div>
  </div>

  <!-- GSF3: Fórmula personalizada -->
  <div class="sub-sec" id="sub-gsf3">
    <h2>¿Cuándo hace falta una fórmula personalizada?</h2>
    <p>Las opciones estándar (Mayor que, Texto contiene...) solo miran <strong>la propia celda</strong>. Cuando la condición depende de <strong>otra celda</strong>, de <strong>otra fila completa</strong>, o de un cálculo (como contar repeticiones), se necesita <strong>"La fórmula personalizada es"</strong>. La regla es siempre la misma: la fórmula debe devolver <code>VERDADERO</code> o <code>FALSO</code>.</p>

    <h2>Ejemplo 1: resaltar la fila completa según una columna</h2>
    <p>Queremos que toda la fila se coloree en verde cuando el comercial sea "Luis" — no solo la celda del nombre, sino las 4 columnas de esa fila:</p>
    <ol>
      <li>Selecciona todo el rango de la tabla (A2:D7).</li>
      <li><code>Formato → Formato condicional → La fórmula personalizada es</code>.</li>
      <li>Escribe: <code>=$A2="Luis"</code></li>
      <li>Estilo: relleno verde claro.</li>
    </ol>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Regla: A2:D7 — Fórmula <code style="background:none;padding:0">=$A2="Luis"</code> → verde, fila completa</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th><th class="gs-colhead">D</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Comercial</td><td>Mes</td><td>Ventas (€)</td><td>Pedidos</td></tr>
          <tr><td class="gs-rownum">2</td><td>Ana</td><td>Enero</td><td>4.200</td><td>18</td></tr>
          <tr><td class="gs-rownum">3</td><td class="hl-green">Luis</td><td class="hl-green">Enero</td><td class="hl-green">950</td><td class="hl-green">6</td></tr>
          <tr><td class="gs-rownum">4</td><td>Marta</td><td>Enero</td><td>3.100</td><td>14</td></tr>
          <tr><td class="gs-rownum">5</td><td>Ana</td><td>Febrero</td><td>2.800</td><td>11</td></tr>
          <tr><td class="gs-rownum">6</td><td class="hl-green">Luis</td><td class="hl-green">Febrero</td><td class="hl-green">5.600</td><td class="hl-green">22</td></tr>
          <tr><td class="gs-rownum">7</td><td>Marta</td><td>Febrero</td><td>3.100</td><td>14</td></tr>
        </tbody>
      </table>
    </div>
    <div class="callout warn"><span class="callout-icon">📌</span><p>La clave está en el signo <code>$</code>: <code>$A2</code> fija la <strong>columna</strong> A pero deja libre la <strong>fila</strong> (2). Así, al evaluar la fila 3, la fórmula comprueba <code>$A3</code>; al evaluar la fila 6, comprueba <code>$A6</code>. Si fijaras también la fila (<code>$A$2</code>), todas las filas comprobarían siempre la celda A2 y la regla no funcionaría.</p></div>

    <h2>Ejemplo 2: resaltar pedidos por debajo del promedio</h2>
    <p>En vez de un número fijo, comparamos cada celda con el promedio de toda la columna — la regla se recalcula sola si los datos cambian:</p>
    <pre><span class="lt">sheets</span><code>=D2&lt;PROMEDIO($D$2:$D$7)</code></pre>
    <p>Aquí <code>D2</code> queda libre (cambia fila a fila) y <code>$D$2:$D$7</code> queda fijo (siempre se compara contra el mismo rango completo).</p>
  </div>

  <!-- GSF4: Analizar datos -->
  <div class="sub-sec" id="sub-gsf4">
    <h2>Formato condicional como herramienta de análisis</h2>
    <p>Más allá de "decorar" una hoja, el formato condicional sirve para <strong>detectar patrones, errores y valores extremos</strong> sin tener que leer fila por fila. Aquí van los usos analíticos más útiles, todos sobre fórmula personalizada.</p>

    <h2>Detectar duplicados</h2>
    <p>Imagina que en la columna "Comercial" se ha registrado por error el mismo comercial dos veces en el mismo mes. La fórmula clásica para detectarlo es <code>CONTAR.SI</code>:</p>
    <pre><span class="lt">sheets</span><code>=CONTAR.SI($A$2:$A$7; A2)&gt;1</code></pre>
    <p>Esto cuenta cuántas veces aparece el valor de A2 en toda la columna; si aparece más de una vez, se resalta. Para detectar duplicados <strong>combinando varias columnas</strong> (ej. mismo comercial + mismo mes, que sí sería un error real, ya que "Ana" aparece dos veces pero en meses distintos, lo cual es correcto):</p>
    <pre><span class="lt">sheets</span><code>=CONTAR.SI.CONJUNTO($A$2:$A$7; A2; $B$2:$B$7; B2)&gt;1</code></pre>
    <div class="callout tip"><span class="callout-icon">✅</span><p><code>CONTAR.SI.CONJUNTO</code> evalúa varias columnas a la vez; sin esto, "Ana" en enero y "Ana" en febrero se marcarían como duplicado, cuando en realidad son registros distintos y válidos.</p></div>

    <h2>Resaltar el máximo y el mínimo de una columna</h2>
    <p>Para destacar automáticamente el mejor y el peor dato sin tener que mirarlos a mano:</p>
    <pre><span class="lt">sheets</span><code><span class="cm">// Regla 1 — el máximo, en verde</span>
=C2=MAX($C$2:$C$7)

<span class="cm">// Regla 2 — el mínimo, en rojo</span>
=C2=MIN($C$2:$C$7)</code></pre>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Regla combinada: máximo en verde, mínimo en rojo</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th><th class="gs-colhead">D</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Comercial</td><td>Mes</td><td>Ventas (€)</td><td>Pedidos</td></tr>
          <tr><td class="gs-rownum">2</td><td>Ana</td><td>Enero</td><td>4.200</td><td>18</td></tr>
          <tr><td class="gs-rownum">3</td><td>Luis</td><td>Enero</td><td class="hl-red">950</td><td>6</td></tr>
          <tr><td class="gs-rownum">4</td><td>Marta</td><td>Enero</td><td>3.100</td><td>14</td></tr>
          <tr><td class="gs-rownum">5</td><td>Ana</td><td>Febrero</td><td>2.800</td><td>11</td></tr>
          <tr><td class="gs-rownum">6</td><td>Luis</td><td>Febrero</td><td class="hl-green">5.600</td><td>22</td></tr>
          <tr><td class="gs-rownum">7</td><td>Marta</td><td>Febrero</td><td>3.100</td><td>14</td></tr>
        </tbody>
      </table>
    </div>

    <h2>Detectar valores fuera de rango (outliers)</h2>
    <p>Útil para encontrar errores de digitación (ej. un cero de más) o valores que rompen el patrón normal:</p>
    <pre><span class="lt">sheets</span><code>=O(C2&gt;PROMEDIO($C$2:$C$7)+2*DESVEST($C$2:$C$7); C2&lt;PROMEDIO($C$2:$C$7)-2*DESVEST($C$2:$C$7))</code></pre>
    <p>Esto marca cualquier valor que se aleje más de 2 desviaciones estándar del promedio — un criterio estadístico estándar para detectar valores "anómalos".</p>

    <h2>Resumen: qué tipo de regla usar según el objetivo</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Quiero...</th><th>Uso...</th></tr></thead>
      <tbody>
        <tr><td>Marcar valores por encima/debajo de un umbral fijo</td><td>Color único + Mayor que / Menor que</td></tr>
        <tr><td>Ver de un vistazo qué es alto y qué es bajo en toda una columna</td><td>Escala de colores</td></tr>
        <tr><td>Resaltar una fila completa según una columna</td><td>Fórmula personalizada con <code>$columna+fila libre</code></td></tr>
        <tr><td>Encontrar duplicados o errores de registro</td><td>Fórmula personalizada con <code>CONTAR.SI</code> / <code>CONTAR.SI.CONJUNTO</code></td></tr>
        <tr><td>Destacar el mejor/peor dato automáticamente</td><td>Fórmula personalizada con <code>MAX</code> / <code>MIN</code></td></tr>
        <tr><td>Detectar valores anómalos (outliers)</td><td>Fórmula personalizada con <code>PROMEDIO</code> + <code>DESVEST</code></td></tr>
      </tbody>
    </table></div>
    <div class="callout warn"><span class="callout-icon">📌</span><p>El formato condicional se recalcula automáticamente con cualquier cambio en los datos, pero si cambias el <strong>rango</strong> de la tabla (ej. añades filas muy abajo, fuera del rango original de la regla), tendrás que editar la regla para que cubra el nuevo rango.</p></div>
  </div>

<template id="tpl-gs_funciones">
  <div class="topic-header">
    <div class="th-eyebrow">Módulo 10 · Google Sheets · Lección 5</div>
    <div class="th-title">Funciones <em>esenciales</em></div>
    <p class="th-desc">Cuatro funciones con usos muy distintos: lógica condicional (SI), sumas con varios criterios (SUMAR.SI.CONJUNTO), números al azar (ALEATORIO.ENTRE) y posición dentro de una tabla (ÍNDICE).</p>
  </div>

  <div class="subtab-nav">
    <button class="stab active" data-sub="gsx1">1. SI</button>
    <button class="stab" data-sub="gsx2">2. SUMAR.SI.CONJUNTO</button>
    <button class="stab" data-sub="gsx3">3. ALEATORIO.ENTRE</button>
    <button class="stab" data-sub="gsx4">4. ÍNDICE</button>
  </div>

  <!-- GSX1: SI -->
  <div class="sub-sec on" id="sub-gsx1">
    <h2>¿Qué hace la función SI?</h2>
    <p><strong>SI</strong> (en inglés <code>IF</code>) es la función de lógica condicional más básica y más usada de toda la hoja de cálculo: evalúa una condición y devuelve un valor si es <strong>VERDADERO</strong>, y otro distinto si es <strong>FALSO</strong>.</p>
    <pre><span class="lt">sheets</span><code><span class="fn">SI</span>(prueba_lógica; valor_si_verdadero; valor_si_falso)</code></pre>

    <h2>Ejemplo: aprobado o no aprobado</h2>
    <p>Tabla de notas de un examen, donde se aprueba con un 5 o más:</p>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Hoja1 — Notas examen</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Alumno</td><td>Nota</td><td>Resultado</td></tr>
          <tr><td class="gs-rownum">2</td><td>Ana</td><td>7</td><td class="hl-green">Aprobado</td></tr>
          <tr><td class="gs-rownum">3</td><td>Luis</td><td>4</td><td class="hl-red">No aprobado</td></tr>
          <tr><td class="gs-rownum">4</td><td>Marta</td><td>5</td><td class="hl-green">Aprobado</td></tr>
        </tbody>
      </table>
    </div>
    <pre><span class="lt">sheets</span><code><span class="fn">SI</span>(B2&gt;=<span class="num">5</span>; <span class="str">"Aprobado"</span>; <span class="str">"No aprobado"</span>)</code></pre>
    <p>Para Ana (nota 7), <code>B2&gt;=5</code> es VERDADERO → devuelve "Aprobado". Para Luis (nota 4), la condición es FALSA → devuelve "No aprobado".</p>

    <h2>SI anidado: más de dos resultados posibles</h2>
    <p>Cuando hacen falta más de dos resultados, se mete una función SI dentro de otra. Por ejemplo, calificar con letras A/B/C/D según la nota:</p>
    <pre><span class="lt">sheets</span><code><span class="fn">SI</span>(B2&gt;=<span class="num">9</span>; <span class="str">"A"</span>;
  <span class="fn">SI</span>(B2&gt;=<span class="num">7</span>; <span class="str">"B"</span>;
    <span class="fn">SI</span>(B2&gt;=<span class="num">5</span>; <span class="str">"C"</span>; <span class="str">"D"</span>)))</code></pre>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Resultado del SI anidado en la columna D</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">D</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Alumno</td><td>Nota</td><td>Calificación</td></tr>
          <tr><td class="gs-rownum">2</td><td>Ana</td><td>7</td><td class="hl-blue">B</td></tr>
          <tr><td class="gs-rownum">3</td><td>Luis</td><td>4</td><td class="hl-yellow">D</td></tr>
          <tr><td class="gs-rownum">4</td><td>Marta</td><td>5</td><td class="hl-yellow">C</td></tr>
        </tbody>
      </table>
    </div>
    <p>El orden importa: se comprueba primero la condición más alta (≥9); si no se cumple, pasa a comprobar la siguiente (≥7), y así hasta llegar al último "else" (D).</p>
    <div class="callout tip"><span class="callout-icon">✅</span><p>Cuando hay más de 2-3 niveles, <code>SI.CONJUNTO</code> es más legible que anidar muchos SI: <code>SI.CONJUNTO(B2&gt;=9;"A"; B2&gt;=7;"B"; B2&gt;=5;"C"; VERDADERO;"D")</code> — evalúa condiciones en orden y devuelve el primer resultado verdadero, sin tantos paréntesis anidados.</p></div>

    <h2>Combinando SI con Y / O</h2>
    <p>Para exigir varias condiciones a la vez se usa <code>Y</code> (todas deben cumplirse) u <code>O</code> (basta con que se cumpla una).</p>
    <pre><span class="lt">sheets</span><code><span class="fn">SI</span>(<span class="fn">Y</span>(B2&gt;=<span class="num">5</span>; C2&gt;=<span class="num">75</span>%); <span class="str">"Aprobado"</span>; <span class="str">"No aprobado"</span>)</code></pre>
    <p>Aquí solo se aprueba si la nota es ≥5 <strong>Y</strong> la asistencia es ≥75% — si falta cualquiera de las dos, el resultado es "No aprobado".</p>
  </div>

  <!-- GSX2: SUMAR.SI.CONJUNTO -->
  <div class="sub-sec" id="sub-gsx2">
    <h2>¿Qué hace SUMAR.SI.CONJUNTO?</h2>
    <p><strong>SUMAR.SI.CONJUNTO</strong> (en inglés <code>SUMIFS</code>) suma los valores de un rango que cumplen <strong>varias condiciones a la vez</strong>, cada una en su propia columna. Es la evolución de SUMAR.SI cuando un solo criterio no es suficiente.</p>
    <pre><span class="lt">sheets</span><code><span class="fn">SUMAR.SI.CONJUNTO</span>(rango_suma; rango_criterio1; criterio1; [rango_criterio2; criterio2; ...])</code></pre>
    <div class="callout warn"><span class="callout-icon">📌</span><p>Todas las condiciones deben cumplirse a la vez (es un "Y" implícito). Si necesitas sumar cuando se cumple <em>cualquiera</em> de varias condiciones, hace falta otro enfoque (varias SUMAR.SI sumadas, o SUMAPRODUCTO).</p></div>

    <h2>Ejemplo: ventas de un comercial en un mes concreto</h2>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Hoja1 — Ventas</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Comercial</td><td>Mes</td><td>Ventas (€)</td></tr>
          <tr><td class="gs-rownum">2</td><td class="hl-yellow">Ana</td><td>Enero</td><td>1.200</td></tr>
          <tr><td class="gs-rownum">3</td><td class="hl-yellow">Ana</td><td class="hl-yellow">Febrero</td><td class="hl-green">1.800</td></tr>
          <tr><td class="gs-rownum">4</td><td>Luis</td><td class="hl-yellow">Febrero</td><td>950</td></tr>
          <tr><td class="gs-rownum">5</td><td class="hl-yellow">Ana</td><td class="hl-yellow">Febrero</td><td class="hl-green">700</td></tr>
        </tbody>
      </table>
    </div>
    <p>Queremos saber cuánto vendió "Ana" en "Febrero" (hay dos filas que cumplen ambas condiciones a la vez):</p>
    <pre><span class="lt">sheets</span><code><span class="fn">SUMAR.SI.CONJUNTO</span>(C2:C5; A2:A5; <span class="str">"Ana"</span>; B2:B5; <span class="str">"Febrero"</span>)   <span class="cm">// devuelve 2.500</span></code></pre>
    <p>Solo suma las celdas de la columna C donde, en esa misma fila, A="Ana" <strong>y</strong> B="Febrero": 1.800 + 700 = <strong>2.500</strong>. La fila de Ana en enero y la de Luis en febrero quedan excluidas porque no cumplen las dos condiciones a la vez.</p>

    <h2>Con criterios numéricos y celdas dinámicas</h2>
    <p>Los criterios pueden ser operadores de comparación (<code>"&gt;1000"</code>) o referencias a celdas, para que la fórmula sea reutilizable cambiando solo el contenido de una celda:</p>
    <pre><span class="lt">sheets</span><code><span class="fn">SUMAR.SI.CONJUNTO</span>(C2:C5; A2:A5; F1; B2:B5; F2; C2:C5; <span class="str">"&gt;500"</span>)</code></pre>
    <p>Donde F1 y F2 contienen el comercial y el mes a consultar — así, cambiando solo esas dos celdas, la fórmula recalcula el resultado sin tocar nada más.</p>

    <h2>Función equivalente para contar: CONTAR.SI.CONJUNTO</h2>
    <p>Si en vez de sumar quieres <strong>contar</strong> cuántas filas cumplen varias condiciones (sin sumar ningún importe), se usa la versión hermana:</p>
    <pre><span class="lt">sheets</span><code><span class="fn">CONTAR.SI.CONJUNTO</span>(A2:A5; <span class="str">"Ana"</span>; B2:B5; <span class="str">"Febrero"</span>)   <span class="cm">// devuelve 2</span></code></pre>
  </div>

  <!-- GSX3: ALEATORIO.ENTRE -->
  <div class="sub-sec" id="sub-gsx3">
    <h2>¿Qué hace ALEATORIO.ENTRE?</h2>
    <p><strong>ALEATORIO.ENTRE</strong> (en inglés <code>RANDBETWEEN</code>) genera un número <strong>entero</strong> aleatorio entre dos valores, ambos incluidos. Cada vez que la hoja se recalcula (por ejemplo, al editar cualquier celda), el valor cambia — es una función <strong>volátil</strong>.</p>
    <pre><span class="lt">sheets</span><code><span class="fn">ALEATORIO.ENTRE</span>(inferior; superior)</code></pre>
    <pre><span class="lt">sheets</span><code><span class="fn">ALEATORIO.ENTRE</span>(<span class="num">1</span>; <span class="num">10</span>)   <span class="cm">// un entero al azar entre 1 y 10, ambos incluidos</span></code></pre>

    <h2>Ejemplo: sorteo de un ganador entre varios participantes</h2>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Hoja1 — Participantes</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Nº</td><td>Participante</td></tr>
          <tr><td class="gs-rownum">2</td><td>1</td><td>Ana</td></tr>
          <tr><td class="gs-rownum">3</td><td>2</td><td>Luis</td></tr>
          <tr><td class="gs-rownum">4</td><td>3</td><td class="hl-green">Marta</td></tr>
          <tr><td class="gs-rownum">5</td><td>4</td><td>Carlos</td></tr>
        </tbody>
      </table>
    </div>
    <p>Para elegir un ganador al azar entre las 4 filas de participantes, generamos un número aleatorio entre 1 y 4, y lo usamos junto a ÍNDICE para "traer" el nombre de esa fila (ÍNDICE se ve en detalle en el siguiente subtema):</p>
    <pre><span class="lt">sheets</span><code><span class="fn">ÍNDICE</span>(B2:B5; <span class="fn">ALEATORIO.ENTRE</span>(<span class="num">1</span>; <span class="num">4</span>))   <span class="cm">// ej. devuelve "Marta"</span></code></pre>
    <div class="callout warn"><span class="callout-icon">⚠️</span><p>Al ser volátil, este número cambia solo con tocar cualquier celda de la hoja. Si necesitas "congelar" el resultado del sorteo, copia la celda y pégala con <strong>Pegado especial → Solo el valor</strong>, para que deje de recalcularse.</p></div>

    <h2>ALEATORIO.ENTRE vs ALEATORIO</h2>
    <div class="table-wrap"><table>
      <thead><tr><th></th><th>ALEATORIO.ENTRE(inf;sup)</th><th>ALEATORIO()</th></tr></thead>
      <tbody>
        <tr><td><strong>Devuelve</strong></td><td>Un número entero</td><td>Un decimal entre 0 y 1 (sin incluir el 1)</td></tr>
        <tr><td><strong>Argumentos</strong></td><td>Mínimo y máximo</td><td>Ninguno</td></tr>
        <tr><td><strong>Uso típico</strong></td><td>Sorteos, simulaciones con enteros, asignación aleatoria de IDs</td><td>Probabilidades, simulaciones con decimales, generar ruido aleatorio</td></tr>
      </tbody>
    </table></div>

    <h2>Otro uso práctico: asignar grupos al azar</h2>
    <p>Para repartir personas en 2 grupos de forma aleatoria, se puede generar un 1 o un 2 por fila y traducirlo con SI:</p>
    <pre><span class="lt">sheets</span><code><span class="fn">SI</span>(<span class="fn">ALEATORIO.ENTRE</span>(<span class="num">1</span>;<span class="num">2</span>)=<span class="num">1</span>; <span class="str">"Grupo A"</span>; <span class="str">"Grupo B"</span>)</code></pre>
    <div class="callout tip"><span class="callout-icon">✅</span><p>Para que la asignación no cambie cada vez que editas la hoja, recuerda "congelar" los resultados con Pegado especial → Solo el valor, igual que en el sorteo.</p></div>
  </div>

  <!-- GSX4: ÍNDICE -->
  <div class="sub-sec" id="sub-gsx4">
    <h2>¿Qué hace ÍNDICE?</h2>
    <p><strong>ÍNDICE</strong> (en inglés <code>INDEX</code>) devuelve el contenido de una celda dentro de un rango, indicando su posición mediante un número de <strong>fila</strong> y, opcionalmente, de <strong>columna</strong>. No "busca" nada — simplemente "apunta" a una posición concreta dentro de los datos que le has dado.</p>
    <pre><span class="lt">sheets</span><code><span class="fn">ÍNDICE</span>(rango; [fila]; [columna])</code></pre>

    <h2>Ejemplo básico: traer un elemento por su posición</h2>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Hoja1 — Frutas</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Manzana</td></tr>
          <tr><td class="gs-rownum">2</td><td>Plátano</td></tr>
          <tr><td class="gs-rownum">3</td><td class="hl-green">Pera</td></tr>
          <tr><td class="gs-rownum">4</td><td>Piña</td></tr>
        </tbody>
      </table>
    </div>
    <pre><span class="lt">sheets</span><code><span class="fn">ÍNDICE</span>(A1:A4; <span class="num">3</span>)   <span class="cm">// devuelve "Pera"</span></code></pre>
    <p>El rango A1:A4 es una sola columna, así que basta con indicar la fila: la 3ª posición es "Pera".</p>

    <h2>Con fila y columna: una tabla de dos dimensiones</h2>
    <div class="gs-sheet-wrap">
      <div class="gs-sheet-caption">Hoja2 — Nutrientes por fruta (por 100g)</div>
      <table class="gs-sheet">
        <thead><tr><th class="gs-rownum"></th><th class="gs-colhead">A</th><th class="gs-colhead">B</th><th class="gs-colhead">C</th></tr></thead>
        <tbody>
          <tr><td class="gs-rownum">1</td><td>Fruta</td><td>Calorías</td><td>Proteínas (g)</td></tr>
          <tr><td class="gs-rownum">2</td><td>Manzana</td><td>52</td><td>0,3</td></tr>
          <tr><td class="gs-rownum">3</td><td>Plátano</td><td class="hl-green">89</td><td>1,1</td></tr>
          <tr><td class="gs-rownum">4</td><td>Pera</td><td>57</td><td>0,4</td></tr>
        </tbody>
      </table>
    </div>
    <pre><span class="lt">sheets</span><code><span class="fn">ÍNDICE</span>(A1:C4; <span class="num">3</span>; <span class="num">2</span>)   <span class="cm">// devuelve 89 (fila 3, columna 2 del rango)</span></code></pre>
    <p>Fila 3 dentro del rango es "Plátano"; columna 2 dentro del rango es "Calorías" → la intersección es <strong>89</strong>.</p>
    <div class="callout warn"><span class="callout-icon">📌</span><p>La fila y columna son <strong>relativas al rango</strong> que has puesto como primer argumento, no a la hoja entera. Si el rango empieza en A1, la "fila 3" es la 3ª fila <em>del rango</em> (que en este caso coincide con la fila 3 de la hoja, pero no sería así si el rango empezara más abajo).</p></div>

    <h2>El uso más potente: ÍNDICE + COINCIDIR en vez de números fijos</h2>
    <p>En vez de escribir "fila 3, columna 2" a mano, se usa COINCIDIR para que calcule esas posiciones buscando el nombre de la fruta y del nutriente — así la fórmula sigue funcionando aunque cambie el orden de filas o columnas:</p>
    <pre><span class="lt">sheets</span><code><span class="fn">ÍNDICE</span>(A1:C4; <span class="fn">COINCIDIR</span>(<span class="str">"Plátano"</span>; A1:A4; <span class="num">0</span>); <span class="fn">COINCIDIR</span>(<span class="str">"Calorías"</span>; A1:C1; <span class="num">0</span>))</code></pre>
    <div class="callout tip"><span class="callout-icon">✅</span><p>Esta es la combinación ÍNDICE + COINCIDIR vista en la lección de BUSCARV — aquí queda claro que ÍNDICE es la mitad "de posición" de esa combinación: COINCIDIR encuentra las coordenadas, e ÍNDICE las usa para devolver el dato.</p></div>

    <h2>ÍNDICE con fila o columna en 0: traer toda una fila/columna</h2>
    <p>Si se deja la fila en <code>0</code>, ÍNDICE devuelve <strong>toda la columna</strong> indicada; si se deja la columna en <code>0</code>, devuelve <strong>toda la fila</strong>:</p>
    <pre><span class="lt">sheets</span><code><span class="fn">ÍNDICE</span>(A1:C4; <span class="num">0</span>; <span class="num">2</span>)   <span class="cm">// devuelve toda la columna "Calorías": 52, 89, 57</span></code></pre>

    <h2>Resumen: cuándo usar cada función de esta lección</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Necesito...</th><th>Función</th></tr></thead>
      <tbody>
        <tr><td>Tomar una decisión según una condición</td><td>SI (o SI.CONJUNTO si hay muchos niveles)</td></tr>
        <tr><td>Sumar un importe que cumple varias condiciones a la vez</td><td>SUMAR.SI.CONJUNTO</td></tr>
        <tr><td>Generar un número entero al azar (sorteos, asignaciones)</td><td>ALEATORIO.ENTRE</td></tr>
        <tr><td>Traer un valor de una posición concreta de una tabla</td><td>ÍNDICE (combinado con COINCIDIR si la posición no se sabe de antemano)</td></tr>
      </tbody>
    </table></div>
  </div>
</template>

    <p class="th-desc">SUMAPRODUCTO, fechas (SI.FECHA, DIAS.LAB), texto y matrices (EXTRAE, TRANSPONER), y conteo de datos (CONTAR.SI, CONTARA, ESPACIOS).</p>
  </div>

  <div class="subtab-nav">
    <button class="stab active" data-sub="gsa1">1. SUMAPRODUCTO</button>
    <button class="stab" data-sub="gsa2">2. SI.FECHA y DIAS.LAB</button>
